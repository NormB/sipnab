# sipnab MCP diagnostic harness
#
# Topology (single shared network namespace owned by opensips-1):
#
#   sipp-uac ──┐                         ┌── (network_mode: service:opensips-1)
#   (172.28.0.21)                        │     rtpengine   (media anchor, userspace)
#              ├──> opensips-1 ──────────┤     sipnab      (capture + MCP HTTP server)
#   sipp-uas ──┘    (172.28.0.10)        └──
#   (172.28.0.20)   owns netns + ports
#
# opensips-1 anchors all media through rtpengine, so every SIP message AND
# every RTP packet transits the opensips-1 network namespace -- a single
# capture point for sipnab. An external system (your laptop) reaches the
# sipnab MCP server on <host>:${MCP_PORT} and can also register/call into
# opensips-1 on <host>:${SIP_HOST_PORT}/udp.

name: ${COMPOSE_PROJECT_NAME:-sipnab-harness}

services:
  # ---- SIP core: OpenSIPS proxy/registrar (owns the shared netns) ----------
  opensips-1:
    build:
      context: ./opensips
      network: host          # RUN steps need the host resolver (daemon DNS is blocked)
      args:
        OPENSIPS_GIT_URL: ${OPENSIPS_GIT_URL:-https://github.com/OpenSIPS/opensips.git}
        # The 4.0 BRANCH head, not a tag: this tracks the current 4.x line.
        # Compose args override the Dockerfile's ARG default entirely, so
        # editing the Dockerfile alone changes nothing and the build reports
        # "Built" off a full cache hit.
        OPENSIPS_GIT_REF: ${OPENSIPS_GIT_REF:-4.0}
    image: sipnab-harness/opensips:local
    container_name: opensips-1
    hostname: opensips-1
    restart: unless-stopped
    init: true                 # tini as PID 1 -> clean signal handling for opensips
    cap_add:
      - NET_RAW      # rtpengine + sipnab (sharing this netns) capture here
      - NET_ADMIN
    environment:
      OPENSIPS_IP: ${OPENSIPS_IP:-172.28.0.10}
      UAS_TARGET: ${UAS_IP:-172.28.0.20}:5060          # internal SIP port is fixed
      # rtpengine lives in its own namespace now, so loopback no longer
      # reaches it. This address and RTPENGINE_NG_BIND below must agree, or
      # opensips answers every INVITE with a 500 and the media never anchors.
      RTPENGINE_SOCK: udp:${RTPENGINE_IP:-172.28.0.11}:22222
    ports:
      # bind_addr:host_port:container_port -- internal ports are fixed; only the
      # host side is configurable (to dodge conflicts with a host SIP service).
      #
      # BIND ADDRESS DEFAULTS TO LOOPBACK, and that default is load-bearing.
      # Published on 0.0.0.0 this is an open SIP service: it answers calls from
      # anyone who can route to the host. That is not hypothetical -- with this
      # stack on 0.0.0.0 a public address placed calls into it, OpenSIPS
      # answered them and rtpengine anchored media for them, and twelve of that
      # caller's control-plane exchanges had to be filtered out of a test
      # fixture by correlation-id before the fixture was safe to commit.
      #
      # The laptop workflow this was opened for still works: set HARNESS_BIND
      # to the LAN address of this host (not 0.0.0.0) in .env, so the exposure
      # is a decision someone made rather than the default they inherited.
      - "${HARNESS_BIND:-127.0.0.1}:${SIP_HOST_PORT:-5060}:5060/udp"         # SIP
      - "${HARNESS_BIND:-127.0.0.1}:${MCP_PORT:-8731}:8731/tcp"              # sipnab-proxy MCP HTTP
      - "${HARNESS_BIND:-127.0.0.1}:${API_PORT:-8080}:8080/tcp"              # sipnab-proxy REST
    networks:
      sipnet:
        ipv4_address: ${OPENSIPS_IP:-172.28.0.10}
    healthcheck:
      test: ["CMD-SHELL", "ss -uln | grep -q ':5060' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- Media anchor: rtpengine in userspace mode, shares opensips netns ----
  # Stand-in Homer collector. rtpengine refuses to mirror to an address that
  # answers with ICMP port-unreachable, so without something absorbing HEP the
  # control plane never reaches the wire at all. sipnab does NOT receive from
  # here -- it reads the same datagrams passively.
  hep-sink:
    build:
      context: ./hep-sink
      network: host
    image: sipnab-harness/hep-sink:local
    container_name: hep-sink
    restart: unless-stopped
    networks:
      sipnet:
        ipv4_address: ${HEP_SINK_IP:-172.28.0.30}

  rtpengine:
    build:
      context: ./rtpengine
      network: host
    image: sipnab-harness/rtpengine:local
    container_name: rtpengine
    restart: unless-stopped
    # Its OWN namespace, not opensips-1's. Sharing one meant a sipnab on the
    # "relay" and a sipnab on the "proxy" read the same eth0 and returned
    # identical answers -- two copies of one capture point, which cannot show
    # that a leg seen at the proxy is the leg seen at the relay.
    ports:
      # These moved here with rtpengine. They were published on opensips-1 while
      # the two shared a namespace; a namespace split moves the ports with the
      # process that binds them, and leaving them behind publishes nothing.
      - "${HARNESS_BIND:-127.0.0.1}:${RELAY_MCP_PORT:-8732}:8732/tcp"        # sipnab-relay MCP HTTP
      - "${HARNESS_BIND:-127.0.0.1}:${RELAY_API_PORT:-8081}:8081/tcp"        # sipnab-relay REST
      - "${HARNESS_BIND:-127.0.0.1}:${RTP_MIN:-30000}-${RTP_MAX:-30050}:30000-30050/udp"  # media
    networks:
      sipnet:
        ipv4_address: ${RTPENGINE_IP:-172.28.0.11}
    depends_on:
      - opensips-1
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      RTPENGINE_IF: ${RTPENGINE_IP:-172.28.0.11}
      # Reachable from another namespace now, so the ng control socket cannot
      # stay on loopback.
      RTPENGINE_NG_BIND: ${RTPENGINE_IP:-172.28.0.11}:22222
      RTP_MIN: ${RTP_MIN:-30000}
      RTP_MAX: ${RTP_MAX:-30050}
      # Empty by default. Set it to mirror the ng control plane, which is what
      # lets sipnab name media captured on a relay -- see docs/rtpengine.md.
      # ON by default now, not empty. Mirroring the ng control plane is what
      # lets the relay NAME the media it sees: signaling never transits
      # rtpengine, so without this its streams carry associated_dialog=null and
      # no amount of correlation downstream can recover the Call-ID.
      #
      # The destination does not have to listen -- sipnab reads these datagrams
      # off the wire rather than receiving them, because rtpengine takes exactly
      # ONE Homer destination and pointing it at a diagnostic tool would take it
      # away from the collector it feeds.
      HOMER: ${HOMER:-172.28.0.30:9060}
      HOMER_ID: ${HOMER_ID:-2001}

  # ---- sipnab: capture (shared netns) + MCP HTTP server --------------------
  sipnab-proxy:
    build:
      context: ..
      dockerfile: harness/sipnab/Dockerfile
      network: host
    image: sipnab-harness/sipnab:local
    container_name: sipnab-proxy
    restart: unless-stopped
    # The PROXY capture point: opensips-1's namespace. Sees signaling, and no
    # media at all now that rtpengine anchors it elsewhere.
    network_mode: "service:opensips-1"
    depends_on:
      - opensips-1
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      MCP_BIND: 0.0.0.0:8731
      API_BIND: 0.0.0.0:8080
      MCP_ALLOWED_HOST: ${SIPNAB_MCP_ALLOWED_HOST:-*}
      CAPTURE_IFACE: eth0
      SIP_PORTRANGE: ${SIP_PORT:-5060}-5061
      # Its own token file: the rotator renames within /run/secrets, and two
      # instances writing one path would each publish a token the other just
      # replaced.
      MCP_TOKEN_FILE: /run/secrets/mcp.token.proxy
      MCP_TOKEN_TTL: ${SIPNAB_MCP_TOKEN_TTL:-600}
      MCP_ROTATE_INTERVAL: ${SIPNAB_MCP_ROTATE_INTERVAL:-300}
      NODE_NAME: proxy
    volumes:
      - ./secrets:/run/secrets
      - ./captures:/captures

  sipnab-relay:
    image: sipnab-harness/sipnab:local
    container_name: sipnab-relay
    restart: unless-stopped
    # The RELAY capture point: rtpengine's namespace. Sees media, and the ng
    # control plane, and no signaling.
    network_mode: "service:rtpengine"
    depends_on:
      - rtpengine
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      MCP_BIND: 0.0.0.0:8732
      API_BIND: 0.0.0.0:8081
      MCP_ALLOWED_HOST: ${SIPNAB_MCP_ALLOWED_HOST:-*}
      CAPTURE_IFACE: eth0
      SIP_PORTRANGE: ${SIP_PORT:-5060}-5061
      # The ng control socket and the HEP mirror of it. The relay sees no
      # signaling, so these are what let it NAME the media it captures.
      CONTROL_PORTS: "22222 9060"
      # The relay is the node that HAS the media, so it is the node that keeps
      # the payloads. Without this its vCon carries an "incomplete" dialog and
      # no audio, which reads as a silent call rather than as a run that never
      # kept the bytes.
      RETAIN_AUDIO: "1"
      # Safe to leave ON since the unwrap carries the wrapper's metadata
      # forward. It did not, and the two halves of HEP support were mutually
      # exclusive: unwrapping removed the wrapper that identifies mirrored ng,
      # so the relay named nothing while every setting looked correct.
      HEP_PARSE: "1"
      MCP_TOKEN_FILE: /run/secrets/mcp.token.relay
      MCP_TOKEN_TTL: ${SIPNAB_MCP_TOKEN_TTL:-600}
      MCP_ROTATE_INTERVAL: ${SIPNAB_MCP_ROTATE_INTERVAL:-300}
      NODE_NAME: relay
    volumes:
      - ./secrets:/run/secrets
      - ./captures:/captures

  # ---- SIPp UAS: answers calls relayed by opensips-1 -----------------------
  sipp-uas:
    build:
      context: ./sipp
      network: host
    image: sipnab-harness/sipp:local
    container_name: sipp-uas
    restart: unless-stopped
    depends_on:
      - opensips-1
    networks:
      sipnet:
        ipv4_address: ${UAS_IP:-172.28.0.20}
    entrypoint: ["/harness/run-uas.sh"]

  # ---- SIPp UAC: loops public scenarios through opensips-1 -----------------
  sipp-uac:
    image: sipnab-harness/sipp:local
    container_name: sipp-uac
    restart: unless-stopped
    depends_on:
      - opensips-1
      - sipp-uas
      - rtpengine
    environment:
      # Idle by default: a background call loop running during a measurement
      # makes every count "the calls under test, plus whatever the loop fit in
      # the same window". Set UAC_IDLE=0 to restore the soak loop.
      UAC_IDLE: ${UAC_IDLE:-1}
      PROXY: ${OPENSIPS_IP:-172.28.0.10}:5060          # internal SIP port is fixed
      UAS_AOR: ${UAS_IP:-172.28.0.20}
      LOOP_PAUSE: ${LOOP_PAUSE:-5}
    networks:
      sipnet:
        ipv4_address: ${UAC_IP:-172.28.0.21}
    entrypoint: ["/harness/run-uac-loop.sh"]

networks:
  sipnet:
    name: ${COMPOSE_PROJECT_NAME:-sipnab-harness}_sipnet
    driver: bridge
    ipam:
      config:
        - subnet: ${SIPNET_SUBNET:-172.28.0.0/24}
