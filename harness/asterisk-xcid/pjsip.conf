;
; docs/asterisk.md's two endpoints, moved to RFC 5737 TEST-NET-3: SIPp's
; caller and callee both run on the Docker host at 203.0.113.1.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[caller]
type = endpoint
context = from-caller
disallow = all
allow = ulaw
direct_media = no

[caller-ip]
type = identify
endpoint = caller
match = 203.0.113.1

[callee]
type = endpoint
context = from-callee
disallow = all
allow = ulaw
direct_media = no
aors = callee

[callee]
type = aor
contact = sip:203.0.113.1:5070
