;
; Extension 100 dials the callee, and a pre-dial handler adds an X-CID header
; to the callee's INVITE carrying the caller's Call-ID. The lines are the ones
; docs/follow-a-call.md shows.
[from-caller]
exten => 100,1,Dial(PJSIP/callee,30,b(add-xcid^s^1(${CHANNEL(pjsip,call-id)})))
 same => n,Hangup()

[add-xcid]
exten => s,1,Set(PJSIP_HEADER(add,X-CID)=${ARG1})
 same => n,Return()
