#
# A record-routing proxy for the sipnab REFER fixture. capture.sh runs it at
# 198.51.100.10 and relays every new INVITE to the SIPp UAS on the host at
# 198.51.100.1:5070. In-dialog requests (ACK, REFER, NOTIFY, BYE) follow the
# Route set, so every message crosses the Docker bridge capture.sh records.
log_level=3
stderror_enabled=yes
udp_workers=2
socket=udp:198.51.100.10:5060
mpath="/usr/local/lib64/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "sipmsgops.so"
loadmodule "maxfwd.so"
loadmodule "rr.so"
loadmodule "proto_udp.so"

route {
	if (!mf_process_maxfwd_header(10)) {
		send_reply(483, "Too Many Hops");
		exit;
	}
	if (has_totag()) {
		if (loose_route()) {
			t_relay();
			exit;
		}
		if (is_method("ACK") && t_check_trans()) {
			t_relay();
			exit;
		}
		send_reply(404, "Not here");
		exit;
	}
	if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
		exit;
	}
	if (!is_method("INVITE")) {
		send_reply(503, "Service Unavailable");
		exit;
	}
	record_route();
	$du = "sip:198.51.100.1:5070";
	if (!t_relay())
		send_reply(500, "Internal Error");
	exit;
}
