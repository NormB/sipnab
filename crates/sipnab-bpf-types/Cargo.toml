# SPDX-License-Identifier: MIT OR Apache-2.0

# The record layout shared by sipnab and its BPF program.
#
# Deliberately dependency-free and `no_std`: one half of its audience is a
# `bpfel-unknown-none` target with no allocator and a verifier that rejects
# anything it cannot prove. Anything added here has to compile there too.
[package]
name = "sipnab-bpf-types"
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Record layout shared between sipnab and its eBPF program"
repository = "https://github.com/NormB/sipnab"
# crates.io shows this as the crate's page. 0.1.0 went up without one.
readme = "README.md"
# Published: sipnab depends on it unconditionally, so it has to exist on
# crates.io before sipnab can.

[dependencies]

# Linux only, for the same reason the parent crate scopes it: `aya` cannot
# compile on Apple, and the `pod` feature is reachable from `--all-features`.
[target.'cfg(target_os = "linux")'.dependencies]
# Only for the `Pod` impls, and only on the host. The kernel half never enables
# this: `aya` is the userspace loader and does not build for bpfel-unknown-none.
aya = { version = "0.16", optional = true }

[features]
# Marks the record types as plain-old-data so `aya` will read and write them
# through its maps. Behind a feature because the orphan rule forces the impl to
# live here, and this crate must stay `no_std` and dependency-free for the
# kernel build that is its other consumer.
pod = ["dep:aya"]

# The workspace's lints, stated here and not inherited.
#
# `bpf/` reaches this crate by path, and Dependabot's run for `/bpf` fetches
# that directory and this manifest, not the repository root. With
# `[lints] workspace = true` cargo ended every such run with "failed to find a
# workspace root" (run 42694599982, 2026-11-09). This is the one workspace
# member that states them; `the_shared_record_crate_states_the_workspace_lints`
# in tests/dependabot_cargo_layout_test.rs fails when this table and
# `[workspace.lints]` in the root Cargo.toml differ. The reason for each lint
# is beside it there.
[lints.clippy]
undocumented_unsafe_blocks = "warn"
borrowed_box = "deny"
ptr_arg = "deny"
should_implement_trait = "deny"
wrong_self_convention = "deny"
new_without_default = "deny"
len_without_is_empty = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
wildcard_imports = "warn"
many_single_char_names = "warn"
cognitive_complexity = "warn"
