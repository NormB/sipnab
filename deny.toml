# cargo-deny configuration for sipnab
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Advisories with no explicit ignore are denied by default.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "GPL-3.0",
    "GPL-3.0-only",
    "OpenSSL",
]
confidence-threshold = 0.8

# tiny-keccak is CC0-1.0, a public-domain dedication. It is in Cargo.lock
# through `parquet` (feature `fleet-store`): parquet asks `ahash` for
# `compile-time-rng` on wasm32 only, which brings `const-random`, whose
# proc macro uses tiny-keccak at build time. No release target is wasm32 with
# that feature, so no shipped binary is built with it. The exception is for
# this one crate; CC0-1.0 is not allowed for any other.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

# ring uses a custom license (ISC-style + OpenSSL); clarify it so the check passes
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Read every feature (DENY-CHECKS-DEFAULT-FEATURES-ONLY). Without this,
# `cargo deny check` reads the default features: 240 crates of the 364 that
# all features resolve (cargo-deny 0.20.2, 2026-11-12), so no rule above saw
# a crate that only an optional feature brings in. The setting is here and
# not a flag on one command line, so every run reads it.
# tests/dependency_policy_doc_test.rs holds it.
[graph]
all-features = true
