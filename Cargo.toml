[workspace]
members = [".", "crates/sipnab-audio", "crates/sipnab-plugin-example", "crates/sipnab-bpf-types"]
# `fuzz/` is a standalone cargo-fuzz package (its own build via `cargo fuzz`);
# it depends on this crate by path and must NOT be pulled into the workspace.
# `bpf/` is the kernel half of the BPF capture backend: a `bpfel-unknown-none`
# package needing nightly and `bpf-linker`, where sipnab pins stable 1.97.1.
# Excluded so a stock `cargo build` never demands that toolchain.
exclude = ["fuzz", "bpf"]
resolver = "2"

# Single source of lint truth for all workspace crates (both crates set
# `lints.workspace = true`). Narrow, per-site lint control uses `#[expect]`
# so stale suppressions self-report. Two lints deliberately live as crate
# attributes in the library roots instead of here:
# - missing_docs: a workspace entry also lints test/bench crates, and an
#   integration test whose whole body is `#![cfg(feature = ...)]`-gated
#   loses its crate doc when the feature is off — under CI's
#   RUSTFLAGS=-Dwarnings every reduced-feature check then fails on a
#   false "missing documentation for the crate".
# - unwrap_used/expect_used: idiomatic in test/bench code (unit tests are
#   exempted via clippy.toml's allow-unwrap-in-tests).
[workspace.lints.clippy]
# Every `unsafe` block needs an adjacent `// SAFETY:` justification.
undocumented_unsafe_blocks = "warn"
# A parking_lot guard held across .await deadlocks the runtime.
await_holding_lock = "deny"

[lints]
workspace = true

[package]
name = "sipnab"
version = "0.5.133"
edition = "2024"
rust-version = "1.97"
authors = ["Norm Brandinger"]
description = "SIP & RTP capture, analysis, and security tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NormB/sipnab"
homepage = "https://sipnab.com"
default-run = "sipnab"
keywords = ["sip", "rtp", "voip", "pcap", "network"]
categories = ["network-programming", "command-line-utilities"]
exclude = ["website/", "demos/", "fuzz/", ".githooks/", "tests/pcap-samples/"]

[dependencies]
sipnab-bpf-types = { path = "crates/sipnab-bpf-types" }
# Fast, DoS-resistant (random-seeded, AES-based) hasher for the per-packet
# stores. Replaces the default SipHash on the hot path — every RTP packet does a
# StreamStore key lookup — while keeping flood resistance for attacker-controlled
# keys (5-tuple/SSRC, Call-ID). Profiled at ~7% of total instructions as SipHash.
ahash = "0.8"
# SIMD byte search for the SIP line scanner (CRLF). Already in the tree via
# nom/regex/etherparse; promoted to a direct dep. Replaces scalar windows(2).
memchr = "2"
# Inline-capacity vector for `PacketProcessor::process`: the dominant cases
# (UDP, single-frame TCP, one reassembled fragment) yield exactly one
# ParsedPacket, so a `SmallVec<[_; 1]>` keeps that on the stack and removes a
# heap allocation from every packet on the capture hot path. Already in the
# tree transitively (via hyper); promoted to a direct dep.
smallvec = "1"
# Phase 1: Capture & core
pcap = { version = "2", optional = true }
# Transparent decompression of gzip-compressed capture files (libpcap, unlike
# Wireshark, cannot read them directly). Unconditional: the pure-Rust reader
# (and thus the WASM browser analyzer) gunzips too, and the default
# `rust_backend` compiles fine on wasm32.
flate2 = "1"
# Filename globbing and directory walking for multi-file capture input. Both
# were already in the dependency tree transitively, so promoting them to direct
# dependencies adds no new supply chain -- and neither is worth hand-rolling:
# glob's bracket-expression and `**` semantics are fiddly enough to get subtly
# wrong, and walkdir carries the symlink-loop protection a naive recursive
# read_dir does not.
glob = "0.3"
walkdir = "2"
tempfile = { version = "3", optional = true }
etherparse = "0.21"
clap = { version = "4", features = ["derive", "env", "string"], optional = true }
clap_complete = { version = "4", optional = true }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
log = "0.4"
env_logger = { version = "0.11", optional = true }
# Phase 8.0b: tracing facade is unconditional; subscriber is gated under
# the `native` feature alongside env_logger.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"], optional = true }
tracing-log = { version = "0.2", optional = true }
parking_lot = "0.12"
crossbeam-channel = { version = "0.5", optional = true }
libc = { version = "0.2", optional = true }

# Phase 2: SIP parsing & output
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Format-preserving TOML editing for surgical writes to the user's sipnabrc
# (updates the [names.manual] table without clobbering comments/other sections).
toml_edit = "0.25"
pcap-file = { version = "2", optional = true }
memmap2 = { version = "0.9", optional = true }
nom = "8"
indexmap = "2"
bytes = "1"

# Phase 2: Error handling
anyhow = "1"
thiserror = "2"

# Phase 3: TUI
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
unicode-width = { version = "0.2", optional = true }

# Phase 5: STIR/SHAKEN & analysis
base64 = { version = "0.23", optional = true }

# Auth: HMAC self-describing bearer tokens (pure-Rust RustCrypto). Available
# whenever `api` OR `mcp` is enabled; deliberately NOT tied to the `tls`
# feature (no `ring`).
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }

# Phase 5: TLS/Crypto (feature-gated)
zeroize = { version = "1", features = ["derive"], optional = true }
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }
# RSA private-key (`--tls-key`) decryption of the TLS 1.2 RSA-kx pre-master
# secret. PKCS#1 v1.5; PEM parsing for PKCS#1/#8 private keys.
rsa = { version = "0.9", default-features = false, features = ["std", "pem"], optional = true }

# Audio playback (feature-gated). The rodio/ALSA dependency lives in the
# `sipnab-audio` cdylib plugin (crates/sipnab-audio); the main binary only
# dlopen's it lazily via libloading so there is no load-time libasound NEEDED.
libloading = { version = "0.9", optional = true }
# WASM plugin host (feature `plugins`). wasmi is a pure-safe-Rust interpreter:
# no JIT, so no W^X pages, which is most of why WASM answers D7 where Lua did
# not. See docs/design/wasm-plugin-api.md.
wasmi = { version = "1.1", optional = true }

# Opus codec (pure Rust, no FFI — always available for WAV export)
opus-decoder = "0.1"

# Phase 5: Metrics & API
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
# OpenAPI 3.1 document for the REST surface, derived from the handlers rather
# than written beside them. `docs/rest-api.md` is the prose reference and stays
# hand-written; this is the machine-readable contract the website's Scalar page
# renders, and `tests/openapi_contract_test.rs` fails the build when the two
# disagree with the router. MSRV 1.75, comfortably under this crate's pinned
# 1.97 — and no fork: the published crate is used as-is.
#
# Default features kept: the only one is `macros`, which is the whole point --
# `#[utoipa::path]` and `#[derive(OpenApi)]` live there.
utoipa = { version = "5", optional = true }

# Phase 8.1: MCP server (Model Context Protocol)
rmcp = { version = "3", default-features = false, features = ["server", "transport-io", "macros", "schemars"], optional = true }

# WASM browser integration (feature-gated)
[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom has no default wasm32 backend: it needs BOTH the `wasm_js` feature
# AND the `--cfg getrandom_backend="wasm_js"` rustflag (set in
# .cargo/config.toml). The rustflag is per-target, so it reaches *every*
# getrandom in the graph, and the feature therefore has to be enabled on every
# major line present — enabling it on one and not the other fails the build in
# the one that was missed.
#
# Both lines are present: ahash (a direct dependency) resolves 0.3, while 0.4
# arrives on its own. This declared 0.4 only, under a comment correctly naming
# ahash and 0.3, so the fix never applied to the version it was written for and
# `cargo build --target wasm32-unknown-unknown --lib` failed on getrandom 0.3.
# `wasm_target_builds` in tests/wasm_exports_test.rs now builds it for real.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Faster general-purpose allocator for the native binary. sipnab's offline
# ingestion is allocation-heavy (one buffer per captured packet); mimalloc cuts
# that malloc/free cost vs the system allocator. Native targets only — WASM keeps
# its own allocator.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
# Assembles WAT fixtures for the WASM plugin host's own tests, so they do
# not need a wasm32 toolchain to run.
wat = "1"
base64 = "0.23"
sha2 = "0.11"
bytes = "1"
unicode-width = "0.2"
parking_lot = "0.12"
proptest = "1"
trycmd = "1"
jsonschema = "0.49"
clap = { version = "4", features = ["derive", "env", "string"] }
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
insta = "1"
tokio = { version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
libc = "0.2"
# Serializes security tests that touch process-global state (the SIPNAB_API_KEY
# env var and the test crate's allocation counter) so they are not raced by
# concurrent tests.
serial_test = "4"

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "tui_derived"
harness = false

[features]
default = ["native", "tui", "audio", "metrics"]
# Native platform deps (not available in WASM)
native = ["dep:pcap", "dep:clap", "dep:clap_complete", "dep:env_logger", "dep:crossbeam-channel", "dep:libc", "dep:pcap-file", "dep:memmap2", "dep:tracing-subscriber", "dep:tracing-log", "dep:tempfile"]
tui = ["native", "dep:ratatui", "dep:crossterm", "dep:unicode-width", "dep:base64"]
tls = ["dep:zeroize", "dep:ring", "dep:rustls", "dep:aes", "dep:cbc", "dep:base64", "dep:rsa", "dep:libc"]
hep = ["native", "dep:hmac", "dep:sha2"]
# Standalone Prometheus /metrics server (raw TCP + threads; no axum/tokio,
# so it is independent of the `api` feature). Needs base64 for Basic-auth.
metrics = ["native", "dep:base64"]
audio = ["dep:libloading", "dep:libc"]
api = ["native", "dep:axum", "dep:tokio", "dep:base64", "dep:hmac", "dep:sha2", "dep:utoipa"]
mcp = ["native", "dep:tokio", "dep:rmcp", "dep:base64", "dep:hmac", "dep:sha2"]
mcp-http = ["mcp", "api", "rmcp/transport-streamable-http-server"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:console_error_panic_hook"]
# WASM plugin host. NON-DEFAULT on purpose: someone who does not want an
# interpreter inside their capture tool does not get one, and the default
# binary is unchanged (see docs/design/wasm-plugin-api.md, which measures the
# cost at +1.56 MB and 15 crates before deciding anything).
plugins = ["native", "dep:wasmi"]
# The eBPF capture backend: the only one that can report the peer a TLS
# session went out to. NON-DEFAULT and deliberately outside `full`, because
# building it needs a nightly toolchain and `bpf-linker` for the kernel half,
# where this crate pins stable 1.97.1 — and running it needs a kernel with
# CONFIG_DEBUG_INFO_BTF. A contributor without either must still be able to
# build sipnab, and CI's pinned jobs must be unaffected.
bpf = ["native", "dep:aya", "sipnab-bpf-types/pod"]
# vCon export: one observed dialog as an unsigned OBSERVER vCon container
# (draft-ietf-vcon-vcon-core). NON-DEFAULT, because a capture tool that nobody
# asked for a conversation container from should not carry one -- and IN
# `full`, so the pre-commit hook's `cargo test --features full` covers it.
# Needs `native` for the JSON projection and the capture analysis the container
# reuses, sha2 for the UUIDv8 derivation and the media content_hash, and base64
# because media travels INLINE as base64url: the draft requires HTTPS for a
# by-reference url and sipnab hosts nothing.
vcon = ["native", "dep:sha2", "dep:hmac", "dep:base64"]
full = ["native", "tui", "tls", "hep", "api", "audio", "mcp", "mcp-http", "metrics", "plugins", "vcon"]

# Userspace half of the eBPF backend. Stable Rust; only the KERNEL half needs
# nightly.
#
# LINUX ONLY, and not merely by convention: `aya` calls `SYS_bpf`,
# `SYS_perf_event_open` and `CLOCK_BOOTTIME`, none of which exist on Apple. A
# plain optional dependency was pulled in by `--all-features` on the macOS CI
# job and failed to compile there, which is what turned main red on 0.5.102.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", optional = true }

[lib]
name = "sipnab"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
# The lib has no harness benchmarks; all benchmarks are the criterion
# [[bench]] targets. NOTE: run benches as `cargo bench --profile profiling`.
# Plain `cargo bench` cannot build: the cdylib crate-type (required for the
# wasm build) must embed a panic runtime, so the lib dependency unit inherits
# profile.release's panic="abort" while bench units are forced to unwind —
# cargo then compiles shared deps (bytes, chrono) twice with different panic
# strategies and the two type instances fail to unify (E0308 "multiple
# different versions of crate"). The profiling profile is release codegen
# with panic="unwind", which keeps the whole graph on one strategy.
bench = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Test binaries link the whole dependency tree, and this repository has a lot
# of them. Measured on 0.5.133: a debug test binary is 422 MB, of which 315 MB
# (75%) is `.debug_*`. The Linux CI leg runs on GitHub's hosted
# `ubuntu-24.04-arm`, which has roughly 14 GB of disk, and adding two test
# files was enough to reach `ld: final link failed: No space left on device`.
#
# `line-tables-only` keeps what a test run actually reads -- file and line in a
# backtrace -- and drops the variable and type information only an interactive
# debugger uses. Reverse it locally with `CARGO_PROFILE_DEV_DEBUG=full` when
# stepping through something under a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = "line-tables-only"

# Release codegen + full symbols, unstripped — for profilers (perf, valgrind
# callgrind). `cargo build --profile profiling`. panic=unwind because callgrind
# dislikes abort; otherwise identical optimization to release.
[profile.profiling]
inherits = "release"
strip = false
debug = true
panic = "unwind"

[[bin]]
name = "sipnab"
path = "src/main.rs"
required-features = ["native"]
# Keep bins out of `cargo bench`'s unit graph: they have no benchmarks, and
# under the bench profile they drag profile.release's panic="abort" into the
# build (see the [lib] note — benches must run with --profile profiling).
bench = false

[[bin]]
name = "gen_fixture"
path = "src/bin/gen_fixture.rs"
required-features = ["native"]
bench = false
