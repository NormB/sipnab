# cargo-nextest configuration.
#
# The suite runs under cargo-nextest, in the pre-commit hook and in CI, through
# scripts/parallel-tests.py with the `suite` profile below
# (TEST-DEADLINE-NEXTEST-SIPNAB). `cargo test` bounds no single test, so one
# hung test held the hook until its 30-minute wall-clock watchdog fired, with
# no name attached; nextest's slow-timeout stops that test and fails it by
# name.
#
# The version is pinned exactly. nextest itself refuses an older one through
# `nextest-version`; scripts/parallel-tests.py and
# scripts/check-hook-prerequisites.py refuse any other one, and
# .github/actions/nextest installs this one in CI. Install it locally with
#   cargo install cargo-nextest --locked --version 0.9.148
nextest-version = { required = "0.9.148" }

# Where nextest keeps its reports, relative to the workspace root. It does not
# follow CARGO_TARGET_DIR, so scripts/parallel-tests.py reads the suite's
# JUnit report from here, not from the build directory: on CI's self-hosted
# runners the two differ.
[store]
dir = "target/nextest"

[profile.default]
# Deterministic by default: no retries, so flaky tests surface immediately.
retries = 0
# A test is reported slow after 60 s and stopped after three periods, 180 s.
# The slowest tests measured under nextest on 2026-11-06 (14 cores, the full
# suite at once) took 77 s (every_documented_command_runs_or_says_why_not),
# 70 s and 68 s, so 180 s leaves them more than twice their time.
slow-timeout = { period = "60s", terminate-after = 3 }

# What scripts/parallel-tests.py runs, in the hook and in CI: every test even
# after a failure, no retries, the same deadline, and a JUnit report, which
# the script renders as libtest text for the readers of the suite's output.
# Only slow, failing and timed-out tests are printed while it runs; the
# rendered report carries each failure's output.
[profile.suite]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "slow"
final-status-level = "slow"
failure-output = "never"
success-output = "never"

[profile.suite.junit]
path = "junit.xml"

# One test runs past three periods on a slower machine, measured, not guessed:
# every_documented_command_runs_or_says_why_not runs every command the docs
# show, and on CI's macos-latest runner its binary finished in 191.85 s under
# cargo test (CI run 42188622852, on 86a902663); nextest stopped it at 180 s
# on that runner (CI run 42258292162). It took 77 s here on 14 cores. Six
# periods, 360 s, is about twice the macOS figure. Every other test keeps
# three; `test_only_the_test_measured_past_the_deadline_gets_a_longer_one`
# in scripts/tests/test_parallel_tests_nextest.py holds the list to this one.
[[profile.suite.overrides]]
filter = "test(=every_documented_command_runs_or_says_why_not)"
slow-timeout = { period = "60s", terminate-after = 6 }

# Two more, measured as well. Each of these runs a whole hook harness
# (scripts/test-pre-commit.sh, scripts/test-pre-push.sh): one short process
# after another, dozens of hook runs. Alone, at a load average of 12 to 17 on
# 14 cores, they took 42.48 s and 36.30 s (2026-11-11). In the suite, at a
# load average of 44 to 50, nextest stopped both at 180 s (180.405 s and
# 180.259 s, the commit hook run that ended 03:46:27Z on 2026-11-11), and two
# more commit hooks failed the same way that day. The pre-commit hook's own
# share of each hook run was cut first, from 2.24 s to 1.28 s in a sandbox
# (its suite watch slept a whole second), and the limit went to six periods.
# At a load average of 38 that was passed as well (both ended at 300 s by
# their own limit, 2026-11-12). The cause: each harness is about 45 s of
# processor time in a row (46.0 s and 44.4 s, measured alone with `cargo`
# stubbed, 2026-11-13), so its run time is that work divided by the share of a
# core the host gives it, and no number of seconds fits every load. The two
# tests now end a harness themselves when its log stops growing for 120 s or
# passes 4 MiB (`HookLimits` in tests/hook_test_scripts_git_env_test.rs),
# which does not depend on the load. The limit here is no longer what ends a
# hang of these two: 30 periods are the 30 minutes of the pre-commit hook's
# own watch on the suite, for the case that the tests' own watch fails.
# `test_the_harness_tests_end_a_hang_themselves_before_nextest_would` in
# scripts/tests/test_parallel_tests_nextest.py holds the two together.
[[profile.suite.overrides]]
filter = "binary(=hook_test_scripts_git_env_test) & (test(=test_pre_commit_sh_leaves_the_hooks_repository_alone) | test(=test_pre_push_sh_leaves_the_hooks_repository_alone))"
slow-timeout = { period = "60s", terminate-after = 30 }

# PTY / terminal E2E tests (tests/tui_e2e_test.rs) can be timing-flaky; allow a
# couple of retries here ONLY. Per spec §13.4 they must also pass a no-retry
# stability check before the `continue-on-error` CI shim is removed.
[profile.e2e]
retries = 2
slow-timeout = { period = "60s", terminate-after = 2 }
