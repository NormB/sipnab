# voipmonitor configuration for the sipnab benchmark comparison.
#
# The aim is to make voipmonitor do the SAME work sipnab is timed on -- parse
# every packet, reconstruct dialogs, associate RTP into streams -- and nothing
# else. Anything writing to disk or a database would time I/O rather than
# reconstruction, and neither tool is asked to persist.

# The corpus deliberately reuses SDP media endpoints. voipmonitor's default DoS
# guard (=3) suppresses duplicate-SDP streams, so it would do LESS RTP
# association than sipnab and the comparison would flatter sipnab.
sdp_multiplication = 0

# No database. Without this voipmonitor expects MySQL on localhost.
nocdr = yes

# No spooling. This disables SAVING, not analysis -- verified by re-running
# with savesip/savertp switched on and confirming voipmonitor emits one SIP and
# one RTP capture per call, each containing both directions of the stream.
savesip = no
savertp = no
savertcp = no
savegraph = no

rtpthreads = 4

# Nothing should listen during a benchmark.
managerport = 0
