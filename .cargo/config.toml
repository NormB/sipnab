# Enable bulk-memory and mutable-globals for wasm32 targets.
# Modern browsers (2019+) and Node.js 12+ all support these.
# Without this, Rust 1.82+ emits memory.copy/memory.fill that
# wasm-bindgen's validator rejects under the baseline spec.
# getrandom 0.3 (via ahash's runtime RNG) has no default wasm32 backend; the
# browser backend must be opted into with this cfg PLUS the crate's `wasm_js`
# feature (enabled in Cargo.toml's wasm32 target dependencies).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+bulk-memory,+mutable-globals", "--cfg", "getrandom_backend=\"wasm_js\""]

# There is deliberately no `[env] RUST_MIN_STACK` here any more.
#
# libtest gives each test its own thread with a 2 MiB stack, and clap's
# GENERATED parser for `Cli` -- `augment_args` and `from_arg_matches` -- had a
# frame that grew with every flag until, in a debug build, it crossed that line.
# Two tests overflowed: `bootstrap_test::portrange_resolution_and_error` and
# `app::batch::tests::dispatch_sip_output_all_modes`. Measured then: the frame
# needed between 2048 and 2560 KiB, while `Cli`, `Config` and `RunPlan` are
# 2744, 2072 and 760 bytes -- so the tests' own locals were never the cost.
#
# Raising the stack to 8 MiB hid that, and hid how close the next flag would
# come. `Cli` is now split into `#[command(flatten)]` sub-structs (see
# `src/cli.rs`), so no single generated function carries every flag: the largest
# group is 37 fields rather than 215. Re-measured with RUST_MIN_STACK REMOVED,
# which is the only way the measurement means anything: 0 of 139 test binaries
# overflow, against a baseline of 2.
#
# If a future flag pushes a group over again, split that group -- do not put the
# override back. A green suite under an 8 MiB override says nothing about the
# frame.
