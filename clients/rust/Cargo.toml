[package]
name = "sipnab-client"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false
description = "The Rust REST client the site's client page shows, compiled and run in CI."

[lints]
workspace = true

# A workspace member so that the Clippy step compiles it with -D warnings and
# cargo-deny and cargo-audit read the one Cargo.lock that pins these. Each line
# below is also shown at the top of src/main.rs's region, and
# tests/client_snippets_test.rs holds the two to each other. reqwest's
# `blocking` and `json` features are the ones jsonschema, a sipnab
# dev-dependency, already enables, so this adds no crate to the lockfile.
[dependencies]
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
