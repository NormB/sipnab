[sipnab-scanner]
enabled = true
filter = sipnab-scanner
logpath = /var/log/sipnab.log
# Read logpath, whatever the distribution's default backend is. Ubuntu 24.04
# sets backend = systemd for every jail, which reads the journal and never
# this file.
backend = auto
maxretry = 5
bantime = 3600
findtime = 60
# Ban on every port, UDP and TCP, with nftables.
action = nftables[type=allports, name=sipnab, protocol="udp,tcp"]
# On a host that bans with legacy iptables instead of nftables, use:
# action = iptables-allports[name=sipnab, protocol=all]
