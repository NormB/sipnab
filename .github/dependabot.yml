version: 2
updates:
  # Rust dependencies (Cargo workspace at the repo root)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The fuzz workspace is SEPARATE: its own Cargo.toml and its own Cargo.lock,
  # outside the root workspace. `directory: "/"` above does not reach it, and
  # neither does the root `cargo audit` / `cargo deny`, which read ./Cargo.lock
  # in the working directory. 194 packages were therefore updated by nobody and
  # scanned by nobody, and had drifted: 39 crates shared with the root were
  # pinned at older versions there, `env_filter` a whole major behind.
  #
  # These are the fuzz targets that validate the parsers against hostile input.
  # Running them on a stale, unaudited tree is not a shipping vulnerability, but
  # it is the security tooling itself going unmaintained.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      fuzz-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(fuzz)"

  # Base images. The runtime image ships to users via GHCR; a CVE in it was
  # previously surfaced by nothing at all.
  - package-ecosystem: "docker"
    # `directory: "/"` is NOT recursive and covered only the root Dockerfile —
    # one of eight. The other seven (bench/, docker/cross/ x2, harness/ x4) were
    # pinned by digest with no update path at all, which is the CVE-rot outcome
    # digest pinning is supposed to avoid. A glob keeps this from needing a
    # hand-kept list that rots the next time a Dockerfile is added.
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # The builder image carries the pinned Rust toolchain, and
      # rust_toolchain_pins_agree asserts `FROM rust:X.Y` matches the version
      # every workflow pins. Letting Dependabot bump it would fight that gate
      # rather than update anything — same reasoning as the
      # dtolnay/rust-toolchain ignore below. Bump it with the toolchain.
      - dependency-name: "rust"

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Two, not five. Each open PR is a BRANCH, and every branch triggers a full
    # ci.yml run on the one self-hosted runner. On 2026-08-08 five of these
    # queued ~100 jobs ahead of a release: main's `CI success` aggregate job is
    # dispatched only after its 20 siblings finish, so it landed at the back and
    # the v0.5.89 tag waited two and a half hours behind dependency bumps. The
    # runs had to be cancelled by hand to let the release through.
    open-pull-requests-limit: 2
    groups:
      # One PR for every action bump rather than one per action. Five separate
      # codeql-action branches are five CI runs to say the same thing.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    ignore:
      # The CI Rust toolchain is pinned deliberately; Dependabot misreads the
      # action tag as a version bump (e.g. proposing a non-existent 1.100.0).
      - dependency-name: "dtolnay/rust-toolchain"
