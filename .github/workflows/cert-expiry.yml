# Watch the published site's certificates, on a schedule, before they expire.
#
# On 2026-09-11 the ORIGIN certificate for sipnab.com expired at 14:10 UTC. The
# CDN was in a strict SSL mode, refused an origin it could not validate, and
# returned 526 to every visitor. Nothing warned, because nothing was watching a
# date.
#
# The renewal had been failing silently for weeks: the published CNAME named
# `www.sipnab.com` while GitHub Pages was configured for the apex, so every
# deploy flipped the custom domain and each flip dropped the certificate. A
# certificate that is never renewed looks perfectly healthy until the minute it
# does not, which is why "is the site up" is the wrong question to automate.
#
# TWO certificates, and watching one of them is worse than useless. The public
# name resolves to the CDN, so a check pointed at it reads the EDGE certificate
# — a different CA, a later date, and entirely healthy all through the outage.
# The one that expired belongs to the ORIGIN. This job checks both and says
# which is which.
name: Certificate expiry

on:
  schedule:
    # 07:10 UTC daily. Early enough that a weekday warning is seen the same
    # morning, and offset off the hour because every scheduler on the planet
    # fires at :00 and GitHub delays the crowd.
    - cron: '10 7 * * *'
  workflow_dispatch:
  # On changes to the check itself, so a broken watcher is caught by the thing
  # it is watching rather than at 07:10 the next morning.
  push:
    paths:
      - 'scripts/check-cert-expiry.sh'
      - 'scripts/classify-origin-cert.sh'
      - 'scripts/verify-site-advertises.sh'
      # The advertisement step's check.
      - 'scripts/pages-live.py'
      # The advertisement step resolves the release with it.
      - 'scripts/advertise-release.py'
      - '.github/workflows/cert-expiry.yml'
      - 'website/static/CNAME'
      - 'website/config.toml'

permissions:
  contents: read

jobs:
  expiry:
    name: Certificates have time left
    runs-on: ubuntu-24.04
    # issues: write is this job's own grant, not the workflow's (OpenSSF
    # Baseline AC-04.02): it opens the expiry issue.
    permissions:
      contents: read
      issues: write
    # Four network round trips and a file comparison. A bound at all is the
    # point: a job that hangs on an unreachable host would sit for six hours
    # and report nothing, which is the same silence this whole workflow exists
    # to break. Raised 5 -> 10 with the advertisement step's static reads:
    # at the worst six reads of 20 s, two waits of 15 s and one page read of
    # 20 s, 170 s, after the certificate steps.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: The CNAME matches the site it is built for
        # The mismatch that broke renewal, checked where it cannot drift back.
        # `base_url` is what the site is generated for and CNAME is what Pages
        # is told; when they disagree, every deploy changes the custom domain
        # and the certificate is dropped each time.
        run: |
          set -euo pipefail
          cname=$(tr -d '[:space:]' < website/static/CNAME)
          base=$(sed -n 's|^base_url = "https://\([^/"]*\).*|\1|p' website/config.toml)
          echo "CNAME=$cname base_url host=$base"
          if [ "$cname" != "$base" ]; then
            echo "::error::website/static/CNAME says '$cname' and base_url says '$base'."
            echo "::error::Every deploy then re-sets the Pages custom domain, and each"
            echo "::error::change drops the HTTPS certificate. That is how the origin"
            echo "::error::certificate came to expire unrenewed on 2026-09-11."
            exit 1
          fi

      - name: The edge certificate has time left
        run: sh scripts/check-cert-expiry.sh sipnab.com

      - name: The origin certificate, and whether anything depends on it
        # The one that actually expired. GitHub Pages' addresses are stable and
        # documented; SNI carries the hostname so the right certificate comes
        # back.
        #
        # Failing on it outright was the first shape of this step, and it was
        # red every morning after the outage was fixed: the CDN moved to a mode
        # that terminates TLS at the edge and reaches the origin over plain
        # HTTP, so a dead origin certificate stopped deciding anything a visitor
        # could see. A check that is red every day is one nobody reads.
        #
        # So the verdict is paired with the only question that matters — can
        # anybody load the page. Serving means the CDN is not validating the
        # origin and the certificate is not load-bearing today; that is a
        # warning about an unencrypted leg, not a failure. Not serving with a
        # dead origin is the 2026-09-11 outage, and fails.
        env:
          SIPNAB_ORIGIN: 185.199.108.153
        run: |
          set -uo pipefail
          sh scripts/check-cert-expiry.sh sipnab.com || cert=$?
          cert=${cert:-0}
          # Asked up to three times, named rather than anonymous: one timeout
          # from this runner read as an outage on 2026-09-22 while the site
          # served everyone else. The probe prints one status, 000 only when
          # no attempt got an answer.
          status=$(sh scripts/classify-origin-cert.sh --probe https://sipnab.com/)
          verdict=$(sh scripts/classify-origin-cert.sh --classify "$cert" "$status") \
            && rc=0 || rc=$?
          printf '%s\n' "$verdict"
          case $rc in
          0) ;;
          2) echo "::warning::The origin certificate is unusable. No visitor is affected, because the CDN terminates TLS at the edge — but the leg between the CDN and the origin is unencrypted." ;;
          3) echo "::warning::The CDN refused this check, so nothing was learned about the origin certificate either way. Let the checker through at the edge, or expect this every morning." ;;
          *)
            echo "::error::The origin certificate is unusable AND the site is not serving."
            exit 1
            ;;
          esac

      - name: The site advertises the release it claims to
        # Separate from the certificates on purpose: a healthy certificate and a
        # stale page are different problems with different fixes, and the check
        # this replaced scored both as `0`.
        #
        # Not on a push. A push that moves published_version cannot have been
        # deployed yet, so asking on the push is red by construction. The
        # schedule and a manual run ask once the deploy can have happened; the
        # release flow runs scripts/verify-site-advertises.sh after the deploy.
        #
        # The release to expect is the one pages.yml advertises, resolved by
        # the same rule (scripts/advertise-release.py), not the committed
        # published_version: since RELEASE-FAST C the committed value lags the
        # site by one release until the next release pull request. A failed
        # read of GitHub's releases fails the step rather than guess.
        #
        # The check is `scripts/pages-live.py daily`
        # (CDN-REFUSED-RELEASE-CHECK-FROM-RUNNER). The CDN answers this
        # runner's read of the download page with a browser challenge on
        # some runner images, and until 2026-11-14 this step turned that
        # refusal into a warning and a green step that had verified nothing.
        # The CDN answers static files from every runner, so the check reads
        # two of them: deploy-stamp.txt and advertised-release.txt, which
        # the site build writes from its own download page (the release that
        # page names by scripts/verify-site-advertises.sh --classify, and the
        # page's sha256). Files of one deploy that name the release verify
        # it. They prove what the deployed build's page said; they do not
        # prove what the edge serves a visitor, so the live page is still
        # read once: a page that answers and does not name the release
        # fails, and a refused read is a warning with the edge's answer.
        # When the files say nothing and the page is refused, the step
        # writes a line that starts with `NOT VERIFIED:` to the job summary
        # and to a warning and keeps its conclusion: nothing is known, in
        # either direction.
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! published=$(python3 scripts/advertise-release.py resolve --repo "$GITHUB_REPOSITORY"); then
            echo "::error::could not resolve the release the site should advertise"
            exit 1
          fi
          echo "site should advertise $published"
          python3 scripts/pages-live.py daily --expect "$published"
