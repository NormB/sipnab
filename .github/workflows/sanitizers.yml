name: Sanitizers

# ThreadSanitizer over the threaded paths. Nightly is used as a TOOL here, never
# as the toolchain: the release build stays pinned to the stable version
# rust_toolchain_pins_agree enforces, exactly as fuzz.yml already does.
#
# Why this exists. sipnab runs a capture thread, a channel, and a processing
# thread, and holds ~49 `unsafe` blocks, 41 of them libc FFI for privilege
# dropping and capture setup. The borrow checker cannot see into either: it
# stops at `unsafe`, and data races across threads are not its job. The existing
# suite exercises those threads but cannot observe a race in them — a test that
# passes and a test that raced look identical.
#
# Weekly rather than per-push: -Zbuild-std rebuilds the standard library with
# instrumentation, and the run is minutes, not seconds.
on:
  schedule:
    # Tuesdays 06:11 UTC — offset from fuzz.yml (Mondays 05:17) so two long
    # nightly jobs do not contend for runners.
    - cron: '11 6 * * 2'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sanitizers.yml'
      - 'ops/tsan/**'
      # Two files outside this workflow decide whether its result means
      # anything, so a change to either has to re-run it. src/main.rs carries
      # the `#[cfg(not(sipnab_tsan))]` on the global allocator — drop that and
      # every run reports allocator false positives again. tests/support/server.rs
      # is how a spawned server's death gets reported; it once reported a
      # timeout instead, and the misdiagnosis cost a full investigation cycle.
      # Both are low-churn, so this does not put the job on the hot path.
      - 'src/main.rs'
      - 'tests/support/server.rs'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    # The whole point is to see failures, so no continue-on-error: a race that
    # is detected and discarded is worse than one never looked for.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system deps
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev libasound2-dev

      # rust-src is required by -Zbuild-std: the standard library has to be
      # rebuilt with instrumentation, or TSan sees std's synchronisation as
      # opaque and reports the channel itself as a race.
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: rust-src

      - name: Run the threaded suites under ThreadSanitizer
        env:
          # --cfg sipnab_tsan swaps mimalloc for the system allocator; see the
          # comment on the #[global_allocator] in src/main.rs. Without it this
          # job reports a data race on every block the allocator recycles across
          # threads, because mimalloc is C that -Zsanitizer=thread does not
          # instrument. That is not theoretical -- it is what the 2026-07-29 run
          # actually reported, and it took a bisect against the system allocator
          # to tell that finding apart from a real race.
          RUSTFLAGS: -Zsanitizer=thread --cfg sipnab_tsan
          RUSTDOCFLAGS: -Zsanitizer=thread --cfg sipnab_tsan
          # Instrumented code against an instrumented std runs several times
          # slower, and every integration deadline is a wall-clock bet on the
          # binary's speed, so deadlines are scaled rather than raced against.
          #
          # Read the history carefully: the seven "did not report a listening
          # address" failures that first motivated this were NOT slowness. The
          # children were being aborted by halt_on_error below, and the harness
          # named a timeout it had never waited out (fixed in
          # tests/support/server.rs). Scaling is still right for instrumented
          # builds; it just was not the fix for that run.
          SIPNAB_TEST_TIMEOUT_SCALE: '12'

          # halt_on_error keeps the first finding as the failure rather than
          # letting a later clean test overwrite the verdict. history_size
          # widens the recorded stack depth, which is what makes a report
          # actionable instead of a bare address.
          #
          # log_path is what makes CHILD processes visible. The suites spawn the
          # sipnab binary and consume its stderr, so a report from a child
          # reaches the cargo log only if some test happens to print the child's
          # stderr into an assertion message. The first run of this job reported
          # "0 races" for exactly that reason. With log_path, every process --
          # harness and child alike -- writes its own tsan.<pid>, and the verdict
          # below reads all of them.
          TSAN_OPTIONS: >-
            suppressions=${{ github.workspace }}/ops/tsan/suppressions.txt
            log_path=${{ github.workspace }}/tsan-logs/tsan
            halt_on_error=1
            history_size=4
            second_deadlock_stack=1
        run: |
          set -o pipefail
          # TSan appends <pid> to log_path but will not create the directory.
          mkdir -p "${{ github.workspace }}/tsan-logs"

          # SCOPE, stated because it is a sample and not the whole suite: these
          # are the integration tests that actually spawn threads — the REST API
          # and its token path, the HEP listener, the MCP stdio server, and the
          # CLI paths that drive a capture. Running everything under
          # -Zbuild-std costs far more wall clock for tests that are
          # single-threaded by construction.
          #
          # A race in a path not listed here will NOT be found. Add the suite
          # rather than assuming coverage.
          #
          # The exit code is captured rather than allowed to abort the step
          # (`run:` is `bash -e`). A failing suite must not skip the verdict
          # below: a race and a test failure arrive together far more often than
          # either arrives alone -- one aborted child fails nine tests -- and the
          # race is the more informative of the two. Both still fail the job.
          rc=0
          cargo +nightly test \
            -Zbuild-std \
            --target x86_64-unknown-linux-gnu \
            --features full \
            --test api_test \
            --test api_token_test \
            --test hep_test \
            --test mcp_stdio_test \
            --test cli_flag_behavior_test \
            2>&1 | tee tsan.log || rc=$?

          # TSan reports a finding and can still exit 0 when the test itself
          # passes, so the exit code alone is not the verdict — the logs are.
          # That logic lives in ops/tsan/verdict.sh, with scenario tests beside
          # it, because the version that lived here was wrong in the direction
          # nobody checks: its warning loop was a bare `grep | sort | while`, and
          # this `run:` block is `bash -e -o pipefail`, so a tree with NO
          # findings made grep exit 1 and killed the step before it printed
          # anything. The job failed silently when the tree was clean and passed
          # while a thread leak was present. Inline YAML cannot be run against a
          # fixture; that is why this is one line now.
          bash ops/tsan/verdict.sh \
            target/x86_64-unknown-linux-gnu/debug/sipnab \
            tsan.log \
            "${{ github.workspace }}/tsan-logs"

          # The suites' own verdict, reported after the sanitizer's so a red
          # suite never hides a race.
          if [ "$rc" -ne 0 ]; then
            echo "::error::the sanitizer suites failed (cargo test exit $rc) — see tsan.log"
            exit "$rc"
          fi

      - name: Upload the sanitizer log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tsan-log
          path: |
            tsan.log
            tsan-logs/
          if-no-files-found: warn
