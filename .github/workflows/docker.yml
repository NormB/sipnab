name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

# Read by default; the one job that publishes declares what it needs. A
# workflow-level `packages: write` would hand any job added later the ability
# to push to GHCR.
#
# `security-events: write` used to sit here for Trivy's SARIF upload and has
# been removed. The only job in this file restates it in its own block -- which
# REPLACES this one -- so the grant here reached nothing, while still widening
# the default for any job added later. Scorecard's Token-Permissions check
# flagged it as a top-level write, correctly. Read-only here; every write is
# declared by the job that needs it, and a test enforces that
# (workflow_supply_chain_test.rs).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 7.7 min.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so `contents: read`
    # must be restated here — without it the checkout has no read grant.
    # `security-events: write` is here for the same reason, and was missed when
    # Trivy was added: a workflow-level grant (since removed, see above) looked
    # sufficient, the scan itself passed, and only the SARIF upload failed with
    # "Resource not accessible by integration" — a permissions error that names
    # neither the permission nor the job-level override that dropped it.
    #
    # This block is now the ONLY place any of these are granted.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally and RUN it before anything is published. This workflow
      # went straight from build to push to sigstore attestation without ever
      # executing the image, so a broken runtime layer — missing
      # libpcap0.8t64, a wrong entrypoint, a non-root user that cannot read its
      # own binary — would ship, and ship attested. The push below reuses this
      # build from cache, so the smoke test costs seconds rather than a rebuild.
      - name: Build image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: sipnab:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The DB is ~60 MB pulled from mirror.gcr.io, and on 2026-08-20 that
      # download stalled and took the whole Docker job with it -- the image had
      # already built and passed smoke. Cached per day: a re-run on the same day
      # reaches no network, and `restore-keys` falls back to the previous day's
      # DB if today's fetch fails, so a scan still runs against slightly older
      # data instead of the job dying. The date, not a fixed key, because a
      # vulnerability DB that never refreshes is a scan that stops finding things.
      - name: Date stamp for the vulnerability DB cache
        id: trivy-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache the Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ steps.trivy-day.outputs.day }}
          restore-keys: trivy-db-

      # Scan the image BEFORE it is pushed, so a vulnerable layer never
      # reaches ghcr.io in the first place.
      #
      # Nothing else covers this. `cargo audit` and Dependabot read Cargo.lock,
      # which says nothing about the Debian base layer -- a vulnerable OpenSSL
      # or zlib lives there, not in the crate graph. The image is the artifact
      # users `docker pull`, and until now it was the one published thing with
      # no vulnerability scan at all.
      - name: Scan the image for vulnerable OS packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        with:
          image-ref: sipnab:smoke
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # Only what can actually be acted on: an advisory with no fixed
          # version cannot be resolved by rebuilding, so failing on it would
          # block every release until upstream moves. Those still appear in the
          # Security tab via the SARIF upload below.
          ignore-unfixed: true
          exit-code: '1'

      # Uploaded even when the scan FOUND something, or the findings that
      # caused the failure would never be visible anywhere.
      #
      # `hashFiles` guard: a scan that dies before writing the report is a
      # different thing from a scan that reports findings, and `always()` alone
      # conflated them -- on 2026-08-20 the DB download stalled, no SARIF was
      # written, and this step turned one infrastructure failure into two by
      # failing with `Path does not exist: trivy.sarif`. The scan step's own
      # non-zero exit is what should fail the job; this one has nothing to say.
      - name: Upload image scan results
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Smoke test the image
        run: |
          set -euo pipefail
          echo "::group::version"
          docker run --rm sipnab:smoke --version
          echo "::endgroup::"
          echo "::group::help"
          docker run --rm sipnab:smoke --help > /dev/null
          echo "::endgroup::"
          # Real work, not just a banner: parse a fixture capture end to end.
          echo "::group::parse a fixture pcap"
          out=$(docker run --rm -v "$PWD/tests/pcap-samples:/pcaps:ro" \
            sipnab:smoke -N -I /pcaps/codec-negotiation.pcap 2>&1)
          echo "$out"
          echo "::endgroup::"
          if ! printf '%s' "$out" | grep -q "packets captured"; then
            echo "::error::the image ran but did not parse the fixture capture — runtime layer is broken"
            exit 1
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sigstore provenance for the image, stored in ghcr next to it so
      #   gh attestation verify oci://ghcr.io/normb/sipnab:<tag> --repo NormB/sipnab
      # proves the image came from this workflow. subject-name is the
      # lowercase registry path — github.repository is mixed-case.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/normb/sipnab
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The attestation was gated only by a test asserting the string
      # "actions/attest-build-provenance@" appears in this file — which stays
      # true if the step above is commented out, and did: the whole step was
      # commented and every gate stayed green. release.yml has verified its own
      # attestation since 0.5.49; this workflow never did, while the download
      # page tells users to run exactly this command.
      #
      # The exit code IS the gate. `gh attestation verify` fails when the image
      # does not match a signed attestation for this repo, so a broken or
      # missing attestation fails the push that produced it rather than a user's
      # verify weeks later.
      - name: Verify the attestation we just created
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          subject="oci://ghcr.io/normb/sipnab@${DIGEST}"
          echo "verifying $subject"
          # --format json because the human summary prints only on a TTY: on a
          # runner a passing run would otherwise leave no evidence in the log.
          out=$(gh attestation verify "$subject" --repo "${{ github.repository }}" \
                  --format json 2>&1) || { echo "$out"; exit 1; }
          echo "--- what was verified ---"
          printf '%s' "$out" | jq -r '
            [.. | objects | select(has("buildDefinition"))][0]
            | "  workflow: \(.buildDefinition.externalParameters.workflow.path // "?")",
              "  ref:      \(.buildDefinition.externalParameters.workflow.ref // "?")"
          ' || echo "  (verified; summary shape not recognized)"
