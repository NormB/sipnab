name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

# Read by default; the one job that publishes declares what it needs. A
# workflow-level `packages: write` would hand any job added later the ability
# to push to GHCR.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so `contents: read`
    # must be restated here — without it the checkout has no read grant.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally and RUN it before anything is published. This workflow
      # went straight from build to push to sigstore attestation without ever
      # executing the image, so a broken runtime layer — missing
      # libpcap0.8t64, a wrong entrypoint, a non-root user that cannot read its
      # own binary — would ship, and ship attested. The push below reuses this
      # build from cache, so the smoke test costs seconds rather than a rebuild.
      - name: Build image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: sipnab:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail
          echo "::group::version"
          docker run --rm sipnab:smoke --version
          echo "::endgroup::"
          echo "::group::help"
          docker run --rm sipnab:smoke --help > /dev/null
          echo "::endgroup::"
          # Real work, not just a banner: parse a fixture capture end to end.
          echo "::group::parse a fixture pcap"
          out=$(docker run --rm -v "$PWD/tests/pcap-samples:/pcaps:ro" \
            sipnab:smoke -N -I /pcaps/codec-negotiation.pcap 2>&1)
          echo "$out"
          echo "::endgroup::"
          if ! printf '%s' "$out" | grep -q "packets captured"; then
            echo "::error::the image ran but did not parse the fixture capture — runtime layer is broken"
            exit 1
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sigstore provenance for the image, stored in ghcr next to it so
      #   gh attestation verify oci://ghcr.io/normb/sipnab:<tag> --repo NormB/sipnab
      # proves the image came from this workflow. subject-name is the
      # lowercase registry path — github.repository is mixed-case.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/normb/sipnab
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
