name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Every pip install in this workflow reads these. pip 24.0's defaults are a
  # 15-second socket timeout and 5 retries. On 2026-10-01 a wheel download
  # from files.pythonhosted.org ran at 8 kB/s, one read waited longer than 15
  # seconds, and pip failed the Check job with ReadTimeoutError. A read that
  # stalls mid-download is not retried, so the timeout is what covers that;
  # the retries cover connection errors and 5xx responses. Worst case for one
  # request against an unreachable index: 9 attempts of up to 60 s to connect
  # plus 60 s to read, and 63.5 s of urllib3 backoff, about 19 minutes, so an
  # outage still fails the first install well inside the Check job's 40.
  # tests/ci_pip_network_test.rs holds every install to these settings.
  PIP_TIMEOUT: '60'
  PIP_RETRIES: '8'

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed on GitHub's runners: 20.2 and
    # 22.1 min ubuntu-24.04-arm, 20.8 and 24.3 min macos (2026-10-09); 23.4
    # min ubuntu-24.04-arm with no cargo cache to restore and 27.7 min macos
    # on pull request #601 (2026-10-28, run 40735575581). The timeout clears
    # the slowest by half again.
    # Slowest run measured on GitHub's runners: 27.7 min
    timeout-minutes: 45
    name: Check (${{ matrix.os }})
    # GitHub's runners: the Linux leg on ubuntu-24.04-arm, which keeps the
    # aarch64 build it has had since 2026-08-10, and macOS on macos-latest. The
    # repository is public, so they cost nothing.
    #
    # From 2026-10-18 to 2026-10-27 the Linux leg ran on the four aarch64
    # self-hosted runners, beside the feature matrix and Coverage. Those
    # runners share one machine's 14 cores with the local gates' build queue,
    # and on 2026-10-27 that queue held about 20 entries with a wait of about
    # two hours while these jobs were among the busiest processes on the
    # machine, so the three moved back that day. The job keeps the shape
    # that let it run there: the runner-target step and the guards on the
    # steps written for a disposable VM (free-disk, the cargo cache) mean
    # routing it back is a change to the line below alone, and
    # tests/ci_runner_target_test.rs holds both halves.
    #
    # The macOS leg is the job `check-macos` below, which runs these same
    # steps (the YAML alias `*check-steps`) and which `CI success` does not
    # need: see the comment on `check-macos`. `matrix.os` keeps its
    # ubuntu-latest / macos-latest value in each, so the job names and the
    # step conditionals below are unchanged.
    #
    # The suite itself runs in the `test` job, split into shards; this job
    # runs everything else.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps: &check-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
          # The suite includes site_advertises_only_a_released_version, which
          # asks git whether published_version has a matching tag. actions/
          # checkout fetches NO tags by default, so that gate saw zero and
          # refused to answer -- correctly, but it turned CI red on a release
          # commit. Fetch them so the gate is real here rather than skipped
          # where it matters most.
          fetch-tags: true
          fetch-depth: 0
      # GitHub-hosted only: on the self-hosted machine this would delete
      # software other work uses.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/system-deps
        with:
          # libyang2-tools is yanglint, for the YANG validation step below.
          # Ubuntu 24.04 has no libyang3-tools; that is the Debian 13 name.
          # tmux drives the PTY tests below. cmake builds libopus for the
          # `opus` feature, which --all-features compiles. The self-hosted
          # machine has all of these, so a job that ran there can drop one
          # and stay green until it runs here:
          # a_hosted_leg_installs_what_its_steps_need holds the list.
          packages: libpcap-dev libasound2-dev libyang2-tools tmux cmake

      - id: toolchain
        uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt
          # `cargo test --all-features` includes `plugins`, and
          # plugin_example_test builds crates/sipnab-plugin-example for wasm32
          # exactly as the docs instruct. Without the target it fails with
          # "can't find crate for `std`" — the test doing its job, so CI gets
          # the target rather than the test getting weakened.
          targets: wasm32-unknown-unknown

      # On a self-hosted runner, the build directory outside the workspace
      # that this runner keeps between jobs; nothing on a hosted one. See the
      # action.
      - uses: ./.github/actions/runner-target
      # The hosted macOS leg restores its build from the cache; the
      # self-hosted leg has its own directory and the machine's ~/.cargo, and
      # uploads neither.
      # Restored on every hosted run and saved, at the end of this job, from
      # main only: tests/ci_cache_policy_test.rs says why.
      - name: Restore the cargo cache
        id: cargo-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install the pinned rustfmt for the scripts' tests
        if: runner.os == 'Linux'
        # scripts/tests/test_prepare_commit.py runs scripts/prepare-commit.sh,
        # whose formatting fixer runs scripts/check-rustfmt.sh, which needs the
        # dated nightly rustfmt in .rustfmt-toolchain. The Format step below
        # installs it too, but only after this test has run.
        run: rustup toolchain install "$(cat .rustfmt-toolchain)" --profile minimal --component rustfmt

      - name: Test Python examples and documentation tooling
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .venv-client-tests
          . .venv-client-tests/bin/activate
          python3 -m pip install --require-hashes -r clients/python/requirements-test.txt
          python3 -m compileall -q clients/python
          python3 -m pytest clients/python/tests -q
          python3 -m pytest scripts/tests -q

      # The client programs the reference pages quote, each language held to
      # a bar. tests/client_snippets_test.rs holds every Go, JavaScript,
      # Python and TypeScript fence in docs/rest-api.md,
      # docs/prometheus-metrics.md and docs/mcp-deploy.md, and the Go, Rust
      # and TypeScript ones on website/content/docs/api-clients.md, to a
      # region of one of these programs; this is where the programs themselves
      # are held. Rust's bar is elsewhere: clients/rust is a workspace member,
      # so the Clippy step below compiles it with -D warnings and the audit
      # job's cargo-deny and cargo-audit read the lockfile that pins it.
      # Go: gofmt must have nothing to rewrite, then vet and build. JavaScript:
      # `node --check` parses each ES module. TypeScript: `npm ci` installs
      # exactly the tree clients/typescript/package-lock.json pins, each
      # package fixed by its integrity hash, and tsc type-checks the MCP
      # client against that SDK. Python's bar is the step above. The smoke
      # step after Build then runs every one of them.
      - name: Set up Go (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          # clients/go uses the standard library only, so there is no go.sum
          # to key a module cache on.
          cache: false

      - name: Set up Node.js (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Type stripping, which runs clients/typescript/sipnab-mcp.ts
          # directly, is on by default from Node.js 22.18.
          node-version: '24'

      - name: Check the Go, JavaScript and TypeScript clients
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd clients/go
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite: $unformatted"
            exit 1
          fi
          go vet ./...
          go build ./...
          cd ../javascript
          for program in *.mjs; do node --check "$program"; done
          cd ../typescript
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install tsc --noEmit

      # The examples too: scripts/smoke-clients.sh runs the one built from
      # examples/tls_plaintext_records.rs, from beside the binary.
      - name: Build
        run: cargo build --all-features --bins --examples

      # tshark and capinfos, for the operator task that exports one customer's
      # calls (cookbook recipe "Open the same evidence in Wireshark"): Wireshark's own engine, not sipnab, must
      # open the export and run the command sipnab printed for it. Ubuntu's
      # package, through the shared installer. The preseed answers the one
      # question wireshark-common asks (may non-root users capture: no)
      # before dpkg configures it, so nothing waits for a terminal this job
      # does not have. It is the action's `debconf` input, which the action
      # applies inside its install lock and only when it installs something,
      # so on the self-hosted machine, where tshark is installed, debconf's
      # lock is never taken for it.
      - name: Install tshark (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/system-deps
        with:
          packages: tshark
          debconf: wireshark-common wireshark-common/install-setuid boolean false

      # Compiling a client proves it is a program; this proves it does what
      # its page says. scripts/smoke-clients.sh replays two committed captures
      # behind the REST API, waits until the replay is finished, and runs every
      # Go, JavaScript and Python REST client (each must exit 0 and print the
      # lines the captures produce, then exit non-zero on a wrong token), the
      # Go, TypeScript and Rust clients the site's client page shows, and
      # both MCP stdio clients. Then the capability examples, all on loopback:
      # leg correlation across a proxy sipnab and a relay sipnab, vCon exports
      # checked against the working group's schema file, a HEP collector fed
      # by two sipnab agents, and the BPF record decode behind TLS without
      # keys. Next, the operator tasks, one program per multi-step cookbook
      # recipe, each checked for the exact lines its captures produce and a
      # failure case. Last, the AI tasks over MCP: triage over stdio and over
      # loopback HTTP with signed tokens, an evidence package and repro
      # scripts written twice and compared byte for byte, and an aggregate
      # cut to a model's byte budget. The MCP SDK comes from a hash-pinned
      # file, like every other Python install in this job.
      - name: Run every client program against a replayed capture
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python3 -m venv .venv-mcp
          .venv-mcp/bin/python -m pip install --require-hashes -r clients/python/requirements-mcp.txt
          # The site's Python client examples use requests and httpx. Shared
          # packages are pinned to the same versions in both files.
          .venv-mcp/bin/python -m pip install --require-hashes -r clients/python/requirements-examples.txt
          PYTHON="$PWD/.venv-mcp/bin/python" scripts/smoke-clients.sh "${CARGO_TARGET_DIR:-target}/debug/sipnab"

      # The sipnab-g729 crate's conformance tests and the sipnab tests that decode
      # G.729 read the fetched ITU-T package; a missing one fails them.
      - uses: ./.github/actions/g729-vectors

      # The sipnab-g729 crate's three examples (import_tables,
      # decode_bitstream, decode_rtp_payloads), built once with `cargo build
      # --examples` as a user builds them and run as programs, with their
      # output checked against the ITU-T test vectors.
      # The test job's Test step covers the root package only.
      - name: Run and check the G.729 examples
        run: cargo test -p sipnab-g729 --features std --test examples

      # The suite on macOS, whole, in this job. On Linux it runs split into
      # shards in the `test` job, which is what the required `CI success`
      # waits for; the macOS leg blocks no pull request (see `check-macos`),
      # so splitting it would shorten nothing a merge waits for. On main the
      # tag gate waits for every workflow of the commit, and Quality took
      # 28.6 minutes on run 41620629650 (2026-11-03) against this job's 22.2.
      # One job also keeps macOS to the one `cargo-check` cache entry it had,
      # 4.07 GB of the repository's 10 GB.
      # scripts/parallel-tests.py runs the suite under the cargo-nextest
      # version .config/nextest.toml pins, and refuses any other.
      - name: Install cargo-nextest (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/nextest

      - name: Test (macOS, every target)
        if: runner.os == 'macOS'
        run: python3 scripts/parallel-tests.py -- --all-features

      - name: Test the sipnab-bpf-types crate
        # The test job's Test step covers the sipnab package only, because
        # `cargo test` without `-p` or `--workspace` leaves the other members
        # out. This
        # crate is published, and the examples on its README, which is also
        # its docs.rs front page, are doctests that assert how a perf sample
        # is read. Its own step, so its tests stay out of test-output.txt and
        # the published count above stays sipnab's suite. The pre-commit hook
        # runs the same command.
        run: cargo test -p sipnab-bpf-types --no-fail-fast

      - name: Clippy
        # --all-targets so bench and test-target code is lint-gated too
        # (previously only the report-only SARIF job covered those).
        # `--workspace`, because without it these switches cover only THIS
        # package's targets and features. crates/sipnab-plugin-example escaped
        # the lint gate entirely that way and carried a denied lint while CI
        # stayed green.
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Clippy with no features
        # `--all-features` turns every feature-gated field and branch on, so a
        # lint that fires only with them off is invisible to the step above.
        # One went unread on main: `..Self::default()` on a struct whose
        # other fields are all feature-gated. The library only, to bound the
        # time; the features job compiles the rest of the matrix.
        # tests/clippy_scope_parity_test.rs requires this step and its
        # pre-push copy.
        run: cargo clippy --no-default-features --lib -- -D warnings

      - name: Clippy the fuzz targets
        # fuzz/ is its own workspace, so `--workspace` above never lints it,
        # and the fuzz-check job only compiles it. The pre-push hook runs the
        # same command.
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Clippy the BPF program
        # bpf/ is its own workspace on the dated nightly in
        # bpf/rust-toolchain.toml, so no other clippy run reads it. The binary
        # target only: a `no_std` program has no test harness. The pre-push
        # hook runs the same command.
        if: runner.os == 'Linux'
        working-directory: bpf
        run: |
          rustup toolchain install
          rustup component add clippy
          cargo clippy -- -D warnings

      - name: Format
        # The dated nightly rustfmt in .rustfmt-toolchain, the only rustfmt
        # that applies every option in rustfmt.toml, over every tracked `.rs`
        # file: `fuzz/` and `bpf/` are not workspace members, and bpf/src/main.rs
        # once sat unformatted with every fmt gate in the repository green.
        # Only rustfmt runs on the nightly; the build stays on stable. The
        # hooks run the same script.
        run: |
          rustup toolchain install "$(cat .rustfmt-toolchain)" --profile minimal --component rustfmt
          scripts/check-rustfmt.sh

      - name: Docs
        # rustdoc-only lints (broken intra-doc links, private-item links)
        # never fire under build/clippy; this is the only gate that sees them.
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -D warnings

      # These 11 tests drive the real TUI through a tmux PTY and are the only
      # coverage of it that exercises a terminal. They are #[ignore] by default
      # because they need tmux, so a plain `cargo test` skips them everywhere --
      # locally, in the pre-commit hook, in the test job's Test step, and under
      # coverage. This step is the ONLY place they run.
      #
      # It carried `continue-on-error: true  # PTY tests can be flaky in CI`,
      # which meant the one place they ran also threw away the answer.
      #
      # Removing it revealed what that had been hiding: `Install system deps` is
      # Linux-only, macOS runners have no tmux, and all 11 tests had been
      # failing there on EVERY run with `failed to run tmux (is it installed?)`.
      # The suite had never once executed on macOS. It looked green because
      # continue-on-error rewrites a step's `conclusion` to success and leaves
      # the true result in `outcome` — so even querying the API for step
      # conclusions reports success for a step that failed. The masking was
      # thorough enough to survive being checked.
      #
      # tmux is now installed on macOS, so the tests run on both platforms.
      # If this ever does turn flaky, stabilize the test. Do not re-mute the
      # suite: a gate that reports a safety it is not providing is worse than
      # no gate, because it stops anyone looking.
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: E2E TUI tests (PTY)
        if: runner.os != 'Windows'
        run: |
          tmux -V
          cargo test --features tui --test tui_e2e_test -- --ignored

      # The workspace's own executables are rebuilt by any change to the
      # sources, so they are removed before the save; see the script. It runs
      # on every run, not only before a save, so each run's log records the
      # size an entry would have and how much of it was object files.
      - name: Prune the cargo cache
        if: runner.environment == 'github-hosted'
        run: bash scripts/ci-cache-prune.sh "$GITHUB_WORKSPACE/target"
      - name: Save the cargo cache
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The macOS leg of Check: the same steps as `check`, through the YAML
  # alias, and on macOS they include the whole suite.
  #
  # `CI success`, the one required status check, does not need this job, so
  # a pull request neither waits for macOS nor turns red when GitHub cancels
  # the macOS leg for capacity. On 2026-11-02 GitHub canceled Check
  # (macos-latest) on both runs of pull request #601 (41510139494 and
  # 41514782896) with "The job was not acquired by Runner of type hosted
  # even after multiple attempts", and the rerun of the second took 27
  # minutes (20:22:04 to 20:49:15 UTC). The job still runs on
  # every pull request, so its result is shown there, and on every push
  # to main. A failed job fails the workflow run whether or not `CI success`
  # needs it, so a macOS failure on main is a red CI run on that commit, and
  # the pre-push hook's tag gate refuses to tag a commit whose CI run is not
  # green. the_macos_leg_blocks_main_and_no_pull_request in
  # tests/site_journey_test.rs holds both halves.
  check-macos:
    # Slowest run measured on GitHub's runners: 27.7 min
    timeout-minutes: 45
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps: *check-steps

  # The suite: `cargo test --all-features`, split into shards that run at
  # once. Compiling the test binaries is the larger half of the suite's time
  # (7 min 40 s of the 12.3-minute Test step on Linux, run 41620629642,
  # 2026-11-03), so each shard compiles only its own targets.
  # scripts/parallel-tests.py --shard-index I --shard-count N is the one rule
  # for which shard runs what: every integration-test target in exactly one
  # shard, and the library and binary unit tests and the doctests in the
  # first. The `shard:` list is the only place N is written; the step reads
  # its index and count from `strategy`. Linux only: macOS runs the suite
  # whole in `check-macos`.
  # scripts/tests/test_parallel_tests_shards.py holds the rule, on this
  # repository's real targets too, and the `test-results` job refuses a set
  # of outputs that is not every shard with every target exactly once.
  test:
    # Slowest run measured on GitHub's runners: 27.7 min
    timeout-minutes: 45
    name: Test (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04-arm' || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # site_advertises_only_a_released_version asks git for tags; see
          # the checkout in `check`.
          fetch-tags: true
          fetch-depth: 0
      - name: Free disk space (Linux)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk

      # The packages the suite ran with when it ran in `check`, so every
      # test sees the same machine: yanglint for the YANG tests, cmake for
      # libopus, tmux for the PTY tests' probes.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/system-deps
        with:
          packages: libpcap-dev libasound2-dev libyang2-tools tmux cmake

      - id: toolchain
        uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt
          # plugin_example_test builds the example plugin for wasm32.
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/runner-target
      # Every shard compiles the same dependencies, so one cache serves all
      # of them, and only the first shard saves it.
      - name: Restore the cargo cache
        id: cargo-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-

      # The tools `check` installs before the suite ran there: the pinned
      # rustfmt, Go, Node.js and tshark.
      - name: Install the pinned rustfmt (Linux)
        if: runner.os == 'Linux'
        run: rustup toolchain install "$(cat .rustfmt-toolchain)" --profile minimal --component rustfmt
      - name: Set up Go for the suite (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Set up Node.js for the suite (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install tshark for the suite (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/system-deps
        with:
          packages: tshark
          debconf: wireshark-common wireshark-common/install-setuid boolean false

      # The tests that decode G.729 read the fetched ITU-T package.
      - uses: ./.github/actions/g729-vectors

      # The suite runs under the cargo-nextest version .config/nextest.toml
      # pins; scripts/parallel-tests.py refuses any other.
      - name: Install cargo-nextest
        uses: ./.github/actions/nextest

      - name: Test
        env:
          # tests/yang_export_test.rs writes every RFC 7951 document it checks
          # here, and `test-results` hands each one to yanglint. Empty, and
          # therefore off, on macOS, where nothing reads them.
          SIPNAB_YANG_EXPORT_DIR: ${{ runner.os == 'Linux' && format('{0}/test-shard/yang-exports', runner.temp) || '' }}
        # The shard runs as the pre-commit hook runs the whole suite:
        # scripts/parallel-tests.py runs its targets under cargo-nextest's
        # `suite` profile, which stops any one test after three 60-second
        # periods, then (shard 0) the doctests with `cargo test --doc`. It
        # renders nextest's report as cargo test's text, one block per
        # binary, so `test-results` counts the shards' outputs together by
        # the rule it applied to one unsharded run, and the exit status is
        # non-zero if any test failed.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/test-shard"
          python3 scripts/parallel-tests.py --shard-index ${{ strategy.job-index }} --shard-count ${{ strategy.job-total }} \
            --manifest "$RUNNER_TEMP/test-shard/shard.json" -- --all-features 2>&1 \
            | tee "$RUNNER_TEMP/test-shard/test-output.txt"

      - name: Hand the shard's output to the total
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-shard
          if-no-files-found: error
          retention-days: 1

      # Every run, so the log records the size the entry would have.
      - name: Prune the cargo cache
        if: runner.environment == 'github-hosted' && strategy.job-index == 0
        run: bash scripts/ci-cache-prune.sh "$GITHUB_WORKSPACE/target"
      - name: Save the cargo cache
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' && strategy.job-index == 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The Linux shards' outputs, put back together and checked as one run.
  test-results:
    timeout-minutes: 15
    name: Test results (ubuntu-latest)
    needs: [test]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install yanglint
        uses: ./.github/actions/system-deps
        with:
          packages: libyang2-tools
      - name: Fetch the shards' outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: test-shard-ubuntu-latest-*
          path: ${{ runner.temp }}/shards

      # One output from all the shards, in shard order, refused unless every
      # shard reported exactly once and every target ran in exactly one of
      # them. The YANG exports come from whichever shard ran
      # tests/yang_export_test.rs; a file two shards wrote is refused.
      - name: Merge the shards' outputs
        run: |
          set -euo pipefail
          python3 scripts/parallel-tests.py merge --output test-output.txt "$RUNNER_TEMP"/shards/*
          mkdir -p "$RUNNER_TEMP/yang-exports"
          for f in "$RUNNER_TEMP"/shards/*/yang-exports/*.json; do
            [ -e "$f" ] || continue
            dest="$RUNNER_TEMP/yang-exports/$(basename "$f")"
            if [ -e "$dest" ]; then
              echo "::error::two shards wrote the YANG export $(basename "$f")"
              exit 1
            fi
            cp "$f" "$dest"
          done

      # The sipnab-diagnosis YANG module, and what every door really emits for
      # it, checked by two implementations that wrote neither: `pyang --lint`
      # and libyang's `yanglint` compile the module, `pyang
      # --check-update-from` holds each revision to the last (RFC 7950 section
      # 11), and `yanglint -t data` validates each RFC 7951 export the test
      # job's Test step wrote -- CLI, REST and MCP, per fixture. The Rust suite proves the
      # module is what the analysis's tables generate and that each document
      # decodes to the plain JSON of the same run; only a YANG tool can prove
      # either is valid YANG. Locally a missing tool is NOT CHECKED; here
      # SIPNAB_YANG_REQUIRED makes it a failure, because this is the one place
      # that must not be able to skip. See scripts/check-yang.py.
      - name: Validate the YANG module and the RFC 7951 exports
        env:
          SIPNAB_YANG_REQUIRED: '1'
        run: |
          python3 -m venv .venv-yang
          . .venv-yang/bin/activate
          python3 -m pip install --require-hashes -r scripts/requirements-yang.txt
          python3 scripts/check-yang.py --exports "$RUNNER_TEMP/yang-exports"

      # The homepage's automated-test count is derived from the suite's run, by the
      # one rule in scripts/published-test-count.py, and never committed.
      # This step applies the rule here so a run it cannot count (no result
      # line, a FAILED binary, a total of zero) fails CI on the pull request
      # rather than the deploy. On a push to main the next step hands the
      # output to pages.yml, which applies the same rule and writes the data
      # file the homepage template reads.
      #
      # The number used to be committed in website/templates/index.html and
      # compared with this run. Every pull request that added a test edited
      # that line, so any two such pull requests conflicted on it.
      #
      # This parses the shards' merged output rather than invoking cargo test
      # again; the count is the sum over every binary, so splitting the run
      # into shards does not change it. The
      # coverage job cannot host this: it runs with `--skip cli_goldens`, so
      # its total is short of the real one by design.
      #
      # Linux only, deliberately. The suite is not the same size on every
      # platform -- measured 3015 on ubuntu-latest against 3008 on
      # macos-latest -- so a single advertised number cannot be true of both.
      # The homepage figure describes the Linux suite.
      # .githooks/pre-commit runs the same script on its `cargo test
      # --features full` run; no_test_hides_behind_a_feature_outside_full in
      # tests/site_journey_test.rs keeps that run the same suite as this one.
      - name: Derive the published test count
        run: |
          set -euo pipefail
          if ! actual=$(python3 scripts/published-test-count.py test-output.txt); then
            echo "::error::the suite output cannot be counted, so the homepage would have no test count"
            exit 1
          fi
          echo "published_test_count=$actual"

      # pages.yml waits for this artifact from CI's run of the commit it
      # deploys (scripts/fetch-ci-suite-output.py). Pull requests upload it
      # too: a merge commit whose own push run has not finished takes the
      # count from its merged pull request's head when GitHub reports the
      # same tree (RELEASE-FAST C; the 0.5.238 deploy waited 39 minutes).
      - name: Hand the suite output to the site build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: suite-output
          path: test-output.txt
          if-no-files-found: error

  # Installer: unit tests for the platform/glibc detection and artifact
  # selection in website/static/install.sh (served at sipnab.com/install.sh).
  # Pure POSIX sh — no Rust toolchain needed.
  # The release splits each binary's debug symbols into a published .debug
  # (Linux) or .dSYM.zip (macOS) with scripts/split-debuginfo.sh. release.yml
  # runs only on a tag, so a split that breaks, above all the macOS half,
  # which no other job exercises, would first fail when a tag is already
  # public. This job builds the RELEASE profile with the same symbol flags
  # release.yml takes from `split-debuginfo.sh --rustflags`, on one Linux
  # x86_64 and one macOS runner, runs the split, and checks the pairing.
  # A minimal feature set keeps it cheap: the flags and the link are what
  # decide whether the symbols survive, not which features are compiled.
  symbol-split:
    # Bounds how long this job can hold the main-branch concurrency group.
    # A cold release build with LTO: not yet observed in CI, bounded like the
    # check job.
    timeout-minutes: 40
    name: Symbol split (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The macOS half is the job `symbol-split-macos` below, which runs these
    # same steps (the YAML alias `*symbol-split-steps`) and which `CI
    # success` does not need, for the reason check-macos gives.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps: &symbol-split-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it.
          persist-credentials: false
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/system-deps
        with:
          packages: libpcap-dev

      - id: toolchain
        uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: ${{ matrix.target }}
          # llvm-objcopy, which the split uses on Linux.
          components: llvm-tools

      # Restored on every run and saved, at the end of this job, from main
      # only: tests/ci_cache_policy_test.rs says why.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-symbol-split-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-symbol-split-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Build the release profile with the release's symbol flags
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        # Appended to the workflow's RUSTFLAGS (-Dwarnings), not passed as
        # --config: a set RUSTFLAGS replaces --config's build.rustflags, and
        # that is exactly how this job's first run built without the flags.
        run: |
          RUSTFLAGS="${RUSTFLAGS:-} $(bash scripts/split-debuginfo.sh --rustflags "$TARGET")" \
            cargo build --release --target "$TARGET" --no-default-features --features native --bin sipnab

      # The script verifies the pairing itself. This step checks the result
      # again with the platform's own tools, so a script that passed its own
      # checks by mistake still goes red here.
      - name: Prove the release symbol split
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/sipnab"
          stem="dist/sipnab-ci-${TARGET}"
          bash scripts/split-debuginfo.sh "$bin" "$stem"
          # The stripped binary must still run: on macOS an arm64 binary whose
          # signature the strip broke is killed on launch, and the release's
          # smoke test would first see that on a tag.
          "$bin" --version >/dev/null || { echo "::error::$bin does not run after the split"; exit 1; }
          case "$TARGET" in
            *-linux-*)
              dbg="${stem}.debug"
              # `|| true`: under pipefail a readelf that cannot read the file
              # would end the step silently here, before the error below
              # could name the mismatch.
              bid=$(readelf -n "$bin" 2>/dev/null | sed -n 's/.*Build ID: *\([0-9a-f]*\).*/\1/p' | sed -n 1p) || true
              did=$(readelf -n "$dbg" 2>/dev/null | sed -n 's/.*Build ID: *\([0-9a-f]*\).*/\1/p' | sed -n 1p) || true
              if [ -z "$bid" ] || [ "$bid" != "$did" ]; then
                echo "::error::build ID mismatch: $bin is '${bid}', $dbg is '${did}'"
                exit 1
              fi
              # Captured once, then searched: `readelf | grep -q` under
              # pipefail can report a match as failure when grep exits first.
              secs=$(readelf -S -W "$bin")
              if printf '%s\n' "$secs" | grep -E '\] \.symtab ' >/dev/null; then
                echo "::error::$bin still has a .symtab after the split"
                exit 1
              fi
              if ! printf '%s\n' "$secs" | grep -E '\] \.gnu_debuglink ' >/dev/null; then
                echo "::error::$bin has no .gnu_debuglink after the split"
                exit 1
              fi
              echo "Linux split OK: build ID $bid, $(wc -c < "$dbg" | tr -d ' ') byte .debug"
              ;;
            *-apple-darwin)
              zip="${stem}.dSYM.zip"
              if [ ! -s "$zip" ]; then
                echo "::error::no $zip after the split"
                exit 1
              fi
              bu=$(dwarfdump --uuid "$bin" | awk '/^UUID:/ && !f { print $2; f = 1 }')
              du=$(dwarfdump --uuid "$bin.dSYM" | awk '/^UUID:/ && !f { print $2; f = 1 }')
              if [ -z "$bu" ] || [ "$bu" != "$du" ]; then
                echo "::error::UUID mismatch: $bin is '${bu}', $bin.dSYM is '${du}'"
                exit 1
              fi
              echo "macOS split OK: UUID $bu, $(wc -c < "$zip" | tr -d ' ') byte .dSYM.zip"
              ;;
            *)
              echo "::error::no symbol-split check for $TARGET"
              exit 1
              ;;
          esac

      # The workspace's own executables are rebuilt by any change to the
      # sources, so they are removed before the save; see the script.
      # Every run, so the log records the size the entry would have.
      - name: Prune the cargo cache
        run: bash scripts/ci-cache-prune.sh "$GITHUB_WORKSPACE/target"
      - name: Save the cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The macOS half of the symbol split: the same steps as `symbol-split`,
  # through the YAML alias. Like check-macos, `CI success` does not need it,
  # so a pull request neither waits for it nor fails when GitHub cancels it
  # for capacity, as GitHub did on pull request #631 (run 41725010284,
  # 2026-11-03). It still runs on every pull request and every push to main,
  # and on main a failure fails the CI run, which the pre-push hook's tag
  # gate refuses to tag.
  symbol-split-macos:
    timeout-minutes: 40
    name: Symbol split (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
    steps: *symbol-split-steps

  install-sh:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed: 0.1 min.
    timeout-minutes: 15
    name: Installer (install.sh)
    runs-on: ubuntu-latest
    # GitHub-hosted on purpose: pure POSIX sh, no Rust toolchain.
    # The self-hosted runner is ONE machine and runs one job at a time, so every job
    # pinned there that does not need it delays every job that does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Run install.sh test suite
        run: sh tests/install-sh/run-tests.sh
      - name: Shellcheck
        run: shellcheck -s sh website/static/install.sh tests/install-sh/run-tests.sh

  # Deb packaging: build-deb.sh must produce correct control metadata and
  # payload for the full and noaudio variants (release.yml builds both).
  # Pure dpkg-deb over dummy binaries — no Rust toolchain needed.
  deb-package:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed: 0.1 min.
    timeout-minutes: 15
    name: Deb packaging (build-deb.sh)
    runs-on: ubuntu-latest
    # GitHub-hosted on purpose: packaging script, arch-independent.
    # The self-hosted runner is ONE machine and runs one job at a time, so every job
    # pinned there that does not need it delays every job that does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Test build-deb.sh (full + noaudio variants)
        run: bash packaging/deb/test-build-deb.sh

  # Rpm packaging: the .deb and the Homebrew formula have each had a CI job for
  # a while; build-rpm.sh had nothing, and ran for the first time on a release
  # tag. That is how sipnab shipped four .rpms requiring Debian's
  # libpcap.so.0.8, which no Fedora or RHEL host provides, and learned about it
  # from a user (issue #244). Same shape as the deb job: rpmbuild over stub
  # ELFs, no Rust toolchain, no root.
  rpm-packaging:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes.
    # 0.1 to 0.2 min on GitHub's runners; 0.5 min (29 s) on the x86_64
    # self-hosted runner (pull request #601, run 40735575581).
    # Slowest run measured on the self-hosted runners: 0.5 min
    timeout-minutes: 10
    name: RPM packaging (build-rpm.sh)
    # Self-hosted because: the x86_64 self-hosted runner was added on 2026-10-27 to add CI capacity beside the aarch64 ones, and this is the lightest job that runs there unchanged.
    # That runner is a four-core VM with 6 GB of memory, registered for this
    # repository only, and holds one Rust build at a time. This job builds no
    # Rust: rpmbuild over stub ELFs. Every package it names (rpm, patchelf,
    # gcc) and every tool its harness checks for is installed there, so
    # system-deps installs nothing and the job changes nothing on the machine.
    # It selects the runner by GitHub's architecture label `X64`, not by name:
    # tests/private_identity_test.rs B6 says why. Safe on pull_request for
    # the reason the feature matrix was: an external contributor's workflow
    # runs only after approval (fork-pr-contributor-approval =
    # all_external_contributors).
    runs-on: [self-hosted, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      # The runner is a virtual machine on a host that runs other virtual
      # machines, and a job that filled its disk would stop them as well.
      - name: Refuse to start with less than 25 GB free
        run: bash scripts/ci-disk-floor.sh 25
      - name: Install rpmbuild and patchelf
        # rpm and patchelf are what the release workflow installs before
        # calling the builder; ubuntu-latest ships neither. gcc builds the
        # harness's ELF fixtures — the runner has it, but naming it keeps the
        # job from depending on an image detail nothing here controls.
        uses: ./.github/actions/system-deps
        with:
          packages: rpm patchelf gcc
      - name: Test build-rpm.sh (full + noaudio variants)
        run: bash packaging/rpm/test-build-rpm.sh

  # Homebrew formula generation. update-formula.sh runs on every release to
  # produce sipnab.rb from SHA256SUMS.txt, and its test harness sat in the tree
  # unrun — no workflow referenced it, so the only thing that had ever executed
  # it was whoever wrote it. The deb builder next door has had a CI job all
  # along; this is the same contract with nothing watching.
  #
  # TWO checks, because "the harness passes" and "the generator works on real
  # input" are different claims. The harness feeds a fixture; the second step
  # fetches the real SHA256SUMS.txt from the latest published release and runs
  # the real generator against it, so a failure that depends on real input — a
  # new artifact name, a platform that did not build, a change in asset count
  # or ordering — surfaces here instead of on a tag that is already publishing.
  # That is the shape that shipped 0.5.113's .rpm broken.
  homebrew-formula:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed: 0.1 min.
    timeout-minutes: 15
    name: Homebrew formula (update-formula.sh)
    runs-on: ubuntu-latest
    # GitHub-hosted on purpose: formula text, arch-independent.
    # The self-hosted runner is ONE machine and runs one job at a time, so every job
    # pinned there that does not need it delays every job that does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Test update-formula.sh
        run: bash packaging/homebrew/test-update-formula.sh

      # Network-coupled on purpose, and it adds no failure surface this job did
      # not already have: actions/checkout above already needs GitHub to be up,
      # and `gh api` reads the same host. The alternative — a wider fixture —
      # cannot see the one class that matters, which is what the LAST release
      # actually published. The fixture stays too, and is wide enough to match
      # a real manifest's shape, so a contributor with no network still runs
      # every assertion offline.
      - name: Test update-formula.sh against a real release SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash packaging/homebrew/test-real-sums.sh

  # The ThreadSanitizer verdict. sanitizers.yml is weekly, so a bug in how it
  # reads its own logs would sit undetected for a week at a time — and one did:
  # the verdict used to fail the job when the tree was CLEAN (a bare grep found
  # nothing, pipefail promoted the 1, `bash -e` killed the step) and pass while a
  # thread leak was present. It went green on one commit for that reason. The
  # logic now lives in a script so it can be run against fixtures here, on every
  # push, instead of only on the weekly run it gates.
  # Pure bash over fixture logs — no Rust toolchain needed.
  tsan-verdict:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed: 0.1 min.
    timeout-minutes: 15
    name: Ops scripts (verdict.sh, platform-table.sh)
    runs-on: ubuntu-latest
    # GitHub-hosted on purpose: shell scripts, arch-independent.
    # The self-hosted runner is ONE machine and runs one job at a time, so every job
    # pinned there that does not need it delays every job that does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Test ops/tsan/verdict.sh
        run: bash ops/tsan/test-verdict.sh

      # The release-body download table. release.yml runs only on a tag, so
      # without this the first time anyone learns the table is broken is a
      # release — and a broken table either fails the release step or silently
      # omits a platform.
      - name: Test ops/release/platform-table.sh
        run: bash ops/release/test-platform-table.sh

  # bench/live-capture.sh measures the live capture path, so the run itself
  # needs root, CAP_NET_RAW and a network namespace and can never execute here.
  # Its `--self-test` deliberately can: the arithmetic, the argv construction,
  # the counter parsing and the verdict rules are pure functions over strings,
  # exercised against fixture text with no privileged call. Without this step
  # they would rot unobserved between the rare occasions an operator runs the
  # harness for real — the same failure mode as the corpus suite that CI has
  # never run.
  #
  # A separate job rather than a line appended to install-sh's shellcheck: that
  # step is pinned to `-s sh` for two `#!/bin/sh` files, and every bench script
  # is `#!/usr/bin/env bash`. Forcing bash through a POSIX parser reports arrays,
  # `local` and `[[ ]]` as errors, so the shell here is `-s bash`.
  #
  # scaling.sh and compare.sh are deliberately NOT in this list yet: scaling.sh
  # trips SC2046 at its `set -- $(awk ...)`, where the word splitting is the
  # point. Silencing that correctly is its own change, not a rider on this one.
  # Pure bash — no Rust toolchain needed.
  pre-push-scenarios:
    # The pre-push hook's own BDD suite, which nothing ran. From 2026-09-10 to
    # 2026-09-25 its throwaway fixture lacked the fuzz/ and bpf/ packages the
    # hook formats by name, so every scenario died at the fmt step: the
    # "allow" ones failed and every "gate blocks X" one passed without its
    # gate running. Nobody noticed because the suite was run by hand, or not
    # at all. Here it fails CI the moment the hook and its fixture drift apart
    # again (GATE-DUP1). Tools the hook treats as optional (tmux, zola, vale,
    # yanglint, extra rustup targets) stay absent: those gates report NOT
    # CHECKED, which is what the scenarios expect of a bare runner.
    # Observed locally: about 4 minutes.
    #
    # The pre-commit hook's suite runs here too, for the same reason: nothing
    # ran it, and on 2026-09-29 it was 33 passed, 5 failed on main -- its
    # sandbox copied a hand-kept list of the hook's Python gates, the list had
    # gone stale, and the hook died before the gates four scenarios test.
    # Observed locally: about 30 seconds.
    timeout-minutes: 30
    name: Git hook scenarios
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt
      - name: Install the pinned rustfmt
        # The pre-push scenarios run the real format gate, which needs the
        # dated nightly rustfmt; the stable one above ignores the Google style
        # options. Without it every scenario is blocked by the format step.
        run: rustup toolchain install "$(cat .rustfmt-toolchain)" --profile minimal --component rustfmt
      - name: Run the pre-push hook against its scenarios
        run: sh scripts/test-pre-push.sh
      - name: Run the pre-commit hook against its scenarios
        run: sh scripts/test-pre-commit.sh

  bench-scripts:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed: 0.1 min.
    timeout-minutes: 15
    name: Bench scripts (live-capture.sh)
    runs-on: ubuntu-latest
    # GitHub-hosted on purpose: shell script, arch-independent.
    # The self-hosted runner is ONE machine and runs one job at a time, so every job
    # pinned there that does not need it delays every job that does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Shellcheck (bash)
        run: shellcheck -s bash bench/live-capture.sh
      - name: Self-test (no root, no netns, no capture device)
        run: bash bench/live-capture.sh --self-test

  hook-shellcheck:
    # PRE-PUSH-958-PERCENT-B: .githooks/pre-push printed a literal `%b` and
    # never reset its color after the phase-one release note, a defect
    # shellcheck reports as SC2182 (error). Nothing ran shellcheck over the
    # git hooks. All three are clean at warning level, so any new warning
    # fails here. Observed: under 0.1 min.
    timeout-minutes: 15
    name: Shellcheck (git hooks)
    runs-on: ubuntu-latest
    # GitHub-hosted on purpose: shell scripts, arch-independent, and the
    # image ships shellcheck, as the bench-scripts job above relies on.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Shellcheck (bash)
        run: shellcheck -s bash -S warning .githooks/pre-push .githooks/pre-commit .githooks/commit-msg

  # Reduced feature combinations must keep compiling AND lint-clean (lib and
  # test code). --all-features alone let `#[cfg]`-gating rot: at one point 7
  # of 8 reduced combos failed to build. Compiling was not enough either: a
  # lint that fires only with some features off (a `return` left as the tail
  # once a `#[cfg(feature = "g729")]` block vanished) failed `cargo clippy`
  # with the default features while every gate here was green. So each leg
  # runs clippy, which checks everything `cargo check` does; the full test
  # suite still runs under `check`.
  features:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed: 13.4 min, the headless recipe
    # leg alone (its full test suite took 10.1 of them), on ubuntu-24.04-arm
    # with no cargo cache to restore (pull request #601, run 40815803913),
    # before the combinations were folded into groups and moved to the
    # overflow runners, where every run builds from nothing at the lowest
    # CPU priority. The timeout leaves room for that.
    # Slowest run measured on GitHub's runners: 13.4 min
    timeout-minutes: 45
    name: Features (group ${{ matrix.group }}, aarch64)
    # Self-hosted because: the 21 feature combinations queued for GitHub's 20 concurrent hosted jobs, and the aarch64 host's overflow runners take them from what its local gates leave idle.
    #
    # The combinations, the tests that run beside them, and what each needs
    # are listed in .github/feature-combos.txt. They ran as 21 hosted jobs,
    # one per combination, until 2026-11-03. A free account runs at most 20
    # hosted jobs at once, across every workflow, and on pull request #626's
    # runs those legs, two to four minutes each of which about 1.5 was setup,
    # queued for up to 29 minutes and held the runners the long jobs waited
    # for (runs 41640843394 and 41729921358). Now two groups build them one
    # after another, on the two aarch64 runners labeled `overflow`, whose
    # services run at CPUWeight=1, IOWeight=1 and Nice=19, so they use only
    # the CPU and I/O the host's local gates leave idle.
    # scripts/check-feature-matrix.py's `partition` decides which group runs
    # which, and scripts/tests/test_feature_matrix_groups.py holds it to every
    # combination. The script says why the x86_64 runner is not a third pool.
    #
    # Pull requests reach a self-hosted runner here. The repository's fork
    # pull request approval policy is `all_external_contributors` (checked
    # 2026-11-03), so no workflow from a fork runs until a maintainer
    # approves it, which is the condition the 2026-10-27 rule sets for a
    # `pull_request` job on a self-hosted runner.
    #
    # The runner's own toolchain, targets and packages are used as they are:
    # nothing is installed, and the script stops with the name of anything
    # missing. The build directory is the job's own, under the runner's
    # per-job temporary directory, and is removed however the job ends.
    runs-on: [self-hosted, overflow]
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
          # The headless recipe's suite includes
          # site_advertises_only_a_released_version, which asks git whether
          # published_version has a matching tag. actions/checkout fetches NO
          # tags by default, so that gate saw zero and refused to answer --
          # correctly, but it turned CI red on a release commit. Fetch them so
          # the gate is real here rather than skipped where it matters most.
          fetch-tags: true
          fetch-depth: 0

      # Each combination of this group, linted with its tests, then the
      # tests the file lists beside it. Every command runs even after one
      # fails, and the step fails if any did. The corpus variables are
      # removed so no test reads captures outside the checkout. The pre-push
      # hook leaves this to CI; the same script with no arguments runs every
      # lint locally.
      # A `suite` combination runs through scripts/parallel-tests.py, under
      # the cargo-nextest version .config/nextest.toml pins.
      - name: Install cargo-nextest
        uses: ./.github/actions/nextest

      # The build directory is set per step: the `runner` context exists in
      # a step's env, not in the job's.
      - name: Lint and test the feature combinations
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: env -u SIPNAB_CORPUS -u SIPNAB_VCON_DATASETS python3 scripts/check-feature-matrix.py --group ${{ matrix.group }} --pool overflow

      - name: Remove the build directory
        if: always()
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: rm -rf "$CARGO_TARGET_DIR"

  # What `cargo publish` would upload, built from its own files alone.
  # `tests/crate_package_test.rs` packages without compiling, so it catches a
  # missing dependency version, the size limit, an embedded file left out of
  # `include`, and a second binary. This job runs the VERIFYING package, which
  # unpacks each .crate and builds it with default features. So anything the
  # build reads that the allowlist does not ship fails here, not at
  # `cargo publish`. All three crates in one command, so sipnab's path
  # dependencies are resolved against the freshly packaged sipnab-bpf-types
  # and sipnab-g729 rather than crates.io, which may not have them yet.
  crate-package:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. A cold default-feature build.
    timeout-minutes: 40
    name: Crate package (cargo package, verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk

      - name: Install system deps
        uses: ./.github/actions/system-deps
        with:
          packages: libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - name: Package and verify the three crates
        run: cargo package --locked -p sipnab-bpf-types -p sipnab-g729 -p sipnab

  audit:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed: 0.6 min.
    timeout-minutes: 15
    name: Security audit
    runs-on: ubuntu-latest
    # GitHub-hosted on purpose: cargo audit reads Cargo.lock; also gets a FRESH advisory-db each run rather than this box's cache, which went stale and broke every audit on 2026-08-09.
    # The self-hosted runner is ONE machine and runs one job at a time, so every job
    # pinned there that does not need it delays every job that does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Install libpcap
        uses: ./.github/actions/system-deps
        with:
          packages: libpcap-dev

      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - name: Install cargo-audit
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-deny

      - name: Cargo audit
        # RUSTSEC-2023-0071 (rsa "Marvin" timing side channel; no fixed `rsa`
        # release). sipnab uses an `rsa` private key in src/capture/rsa_key.rs
        # (`--tls-key`, passive, answers nobody) and src/output/vcon_jose.rs
        # (opening an encrypted vCon with an RSA key). The REST vCon validate
        # and analyze routes and the MCP vCon tools open a caller's container,
        # so an authenticated client could time RSA decryptions there. Low
        # risk, not zero; the VEX statement says `affected` and what to do, and
        # deny.toml has the full reason.
        run: cargo audit --ignore RUSTSEC-2023-0071

      # The fuzz workspace has its own Cargo.lock, outside the root workspace,
      # so the scan above never saw it — `cargo audit` reads ./Cargo.lock in the
      # working directory. 194 packages went unscanned, and had drifted behind
      # the root on 39 shared crates. These are the targets that validate the
      # parsers against hostile input; leaving their own tree unaudited is the
      # security tooling going unmaintained.
      #
      # Same rsa exception as above, and for the same reason: the fuzz tree
      # includes sipnab itself, so it inherits that dependency.
      - name: Cargo audit (fuzz workspace)
        run: cargo audit --file fuzz/Cargo.lock --ignore RUSTSEC-2023-0071

      - name: Cargo deny
        run: cargo deny check

      # The fuzz targets build sipnab as a path dependency against their own
      # lockfile, and Dependabot updates the two lockfiles separately. Every
      # version of a shared crate in fuzz/Cargo.lock must be one Cargo.lock
      # holds, or the targets fuzz code the binary does not ship.
      - name: Fuzz lockfile matches Cargo.lock
        run: python3 scripts/check-lockfile-drift.py

  fuzz-check:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed: 3.8 min.
    timeout-minutes: 20
    name: Fuzz targets compile
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
      - name: Install libpcap
        uses: ./.github/actions/system-deps
        with:
          packages: libpcap-dev
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Check fuzz targets
        run: cd fuzz && cargo check

  # Single aggregate gate for branch protection: green only if every other
  # job succeeded. Require just this check so the protection rule survives
  # matrix changes without re-listing per-job contexts.
  code-scanning-clean:
    name: Code scanning has no open alerts
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # CodeQL runs in its own workflow beside this one, so wait for ITS
      # analysis of this commit before judging; a verdict about the previous
      # commit's analysis is not a verdict about this one.
      - name: Refuse open alerts on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/code-scanning-clean.py --repo "${{ github.repository }}" --ref "${{ github.ref }}" --sha "${{ github.sha }}" --category /language:rust --wait-secs 1500

  ci-success:
    # Bounds how long this job can hold the main-branch concurrency
    # group, which never supersedes. Observed: 0.0 min, but it waits on 16 needs.
    timeout-minutes: 10
    name: CI success
    if: always()
    # Every other job in this file but the macOS-only ones, enforced by
    # ci_success_gates_every_job in site_journey_test.rs. This list read
    # [check, features, audit, fuzz-check] while the comment above claimed
    # "every other job" — so install-sh and deb-package could both fail with
    # the one required check on main still green.
    #
    # The macOS-only job, check-macos, is left out on purpose, and this list
    # is the one place that rule lives: a pull request neither waits for
    # macOS nor fails when GitHub cancels a macOS job for capacity, and on
    # main a macOS failure still fails the CI run, which the tag gate
    # refuses. See the comment on check-macos;
    # the_macos_leg_blocks_main_and_no_pull_request in site_journey_test.rs
    # holds it.
    needs: [check, test, test-results, hook-shellcheck, install-sh, deb-package, rpm-packaging,
            homebrew-formula, tsan-verdict, bench-scripts, features,
            crate-package, audit, fuzz-check,
            code-scanning-clean, symbol-split, pre-push-scenarios]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required CI job did not succeed ($r)"
              exit 1
            fi
          done
