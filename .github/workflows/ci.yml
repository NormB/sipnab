name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        # GitHub-hosted runners ship ~20GB of preinstalled SDKs a Rust build
        # never touches (dotnet/android/ghc/CodeQL). A full --all-features
        # build has run the root partition out of space ("No space left on
        # device", failing a job before it compiled). Reclaim it up front —
        # plain directory removals, a few seconds; `|| true` so a missing
        # path can't fail the job.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        # --all-features pulls in `audio` -> alsa-sys, which needs the ALSA headers.
        # `|| true`: don't let a flaky preconfigured third-party apt repo
        # (e.g. packages.microsoft.com 403s) fail the job; the packages we
        # need are in the main Ubuntu archives, which still refresh.
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: |
          set -o pipefail
          cargo test --all-features 2>&1 | tee test-output.txt

      # The homepage advertises an automated-test count in two places.
      # .githooks/pre-commit already compares both to a real test run, but a
      # hook only fires for a clone that opted into core.hooksPath -- a web
      # edit, a fresh contributor or --no-verify all bypass it silently.
      #
      # This parses the run above rather than invoking cargo test again. The
      # coverage job cannot host this check: it runs with `--skip cli_goldens`,
      # so its total is short of the real one by design.
      #
      # Linux only, deliberately. The suite is not the same size on every
      # platform -- measured 3015 on ubuntu-latest against 3008 on
      # macos-latest -- so a single advertised number cannot be true of both.
      # The homepage figure describes the Linux suite; pinning it here and
      # skipping macOS is the honest version of that, rather than quietly
      # widening the check until both pass.
      - name: Enforce the published test count
        if: matrix.os == 'ubuntu-latest'
        run: |
          published=$(grep -oE '[0-9]{4,} automated tests' website/templates/index.html \
            | grep -oE '^[0-9]+' | sort -u)
          case "$published" in
            ''|*[!0-9]*) echo "no single published_test_count on the homepage: '$published'"; exit 1 ;;
          esac

          actual=$(awk -F'[ ;]+' '/^test result/ { p += $4 } END { print p }' test-output.txt)
          [ -n "$actual" ] && [ "$actual" -gt 0 ] || { echo "could not count tests"; exit 1; }

          echo "published_test_count=$published actual=$actual"
          if [ "$published" != "$actual" ]; then
            echo "::error::homepage advertises $published automated tests; the suite has $actual"
            exit 1
          fi

      - name: Clippy
        # --all-targets so bench and test-target code is lint-gated too
        # (previously only the report-only SARIF job covered those).
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Docs
        # rustdoc-only lints (broken intra-doc links, private-item links)
        # never fire under build/clippy; this is the only gate that sees them.
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -D warnings

      # These 11 tests drive the real TUI through a tmux PTY and are the only
      # coverage of it that exercises a terminal. They are #[ignore] by default
      # because they need tmux, so a plain `cargo test` skips them everywhere --
      # locally, in the pre-commit hook, in the Test step above, and under
      # coverage. This step is the ONLY place they run.
      #
      # It carried `continue-on-error: true  # PTY tests can be flaky in CI`,
      # which meant the one place they ran also threw away the answer: the whole
      # TUI E2E suite could fail indefinitely with every badge green. The
      # flakiness was not real -- 24 consecutive executions across both
      # platforms passed, and the logs show all 11 tests running and passing,
      # not silently skipping.
      #
      # If this does turn out to be flaky, stabilise the test. Do not re-mute
      # the suite: a gate that reports a safety it is not providing is worse
      # than no gate, because it stops anyone looking.
      - name: E2E TUI tests (PTY)
        if: runner.os != 'Windows'
        run: cargo test --features tui --test tui_e2e_test -- --ignored

  # Installer: unit tests for the platform/glibc detection and artifact
  # selection in website/static/install.sh (served at sipnab.com/install.sh).
  # Pure POSIX sh — no Rust toolchain needed.
  install-sh:
    name: Installer (install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run install.sh test suite
        run: sh tests/install-sh/run-tests.sh
      - name: Shellcheck
        run: shellcheck -s sh website/static/install.sh tests/install-sh/run-tests.sh

  # Deb packaging: build-deb.sh must produce correct control metadata and
  # payload for the full and noaudio variants (release.yml builds both).
  # Pure dpkg-deb over dummy binaries — no Rust toolchain needed.
  deb-package:
    name: Deb packaging (build-deb.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test build-deb.sh (full + noaudio variants)
        run: bash contrib/deb/test-build-deb.sh

  # Reduced feature combinations must keep compiling (lib AND test code).
  # --all-features alone let `#[cfg]`-gating rot: at one point 7 of 8
  # reduced combos failed to build. `cargo check --tests` is enough to
  # catch that class; the full test suite still runs under `check`.
  features:
    name: Features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - native
          - tls
          - api
          - mcp
          - hep
          # Standalone metrics server must build without the `api` feature.
          - metrics
          - "tls,api"
          - "native,tui,audio"
          - "native,tui,tls,hep,api"
          # The documented headless server build (README "Headless capture host").
          - "native,hep,api,mcp,mcp-http"
          - wasm
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # Reclaim ~20GB of preinstalled SDKs a Rust build never uses
        # (dotnet/android/ghc/CodeQL) — a full --all-features build across
        # this matrix has run the root partition out of space ("No space
        # left on device"). Plain removals, seconds; `|| true` tolerates a
        # missing path.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install system deps
        # `|| true`: don't let a flaky preconfigured third-party apt repo
        # (e.g. packages.microsoft.com 403s) fail the job; the packages we
        # need are in the main Ubuntu archives, which still refresh.
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cache keys must not contain commas, and matrix.features has them
          # (e.g. "native,tui,audio"); key on the lockfile only.
          key: ${{ runner.os }}-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-features-
            ${{ runner.os }}-cargo-

      # wasm is lib-only: its test/bin targets are meaningless.
      #
      # `--target wasm32-unknown-unknown` is the whole point of this job and was
      # missing. Without it the check compiled for the host, where the
      # `cfg(target_arch = "wasm32")` dependency block is inert and the
      # wasm32-only rustflags in .cargo/config.toml never apply — so it proved
      # the `wasm` feature compiles for Linux and nothing about wasm. A real
      # wasm32 build was broken on main (getrandom 0.3 missing `wasm_js`) while
      # this job was green.
      - name: Add wasm32 target
        if: matrix.features == 'wasm'
        run: rustup target add wasm32-unknown-unknown

      - name: Check (lib only, wasm32)
        if: matrix.features == 'wasm'
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm --lib

      - name: Check (with tests)
        if: matrix.features != 'wasm'
        run: cargo check --no-default-features --features "${{ matrix.features }}" --tests

      # The headless recipe is the documented server build (README:
      # "Headless capture host with HEP listener + REST API + MCP HTTP").
      # Run its full test suite, not just a compile check, so the exact
      # feature set users are told to ship stays green.
      - name: Test (headless recipe)
        if: matrix.features == 'native,hep,api,mcp,mcp-http'
        run: cargo test --no-default-features --features "${{ matrix.features }}"

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install libpcap
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev

      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cargo audit
        # RUSTSEC-2023-0071 (rsa "Marvin" timing sidechannel) is an ONLINE
        # chosen-ciphertext oracle attack against a service that decrypts
        # attacker-supplied RSA ciphertexts and leaks timing. sipnab only uses
        # the `rsa` crate for offline, passive decryption of a captured TLS
        # handshake's pre-master (`--tls-key`) — no decryption oracle exists, so
        # the advisory does not apply. No fixed `rsa` release is available.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Cargo deny
        run: cargo deny check

  fuzz-check:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install libpcap
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Check fuzz targets
        run: cd fuzz && cargo check

  # Single aggregate gate for branch protection: green only if every other
  # job succeeded. Require just this check so the protection rule survives
  # matrix changes without re-listing per-job contexts.
  ci-success:
    name: CI success
    if: always()
    needs: [check, features, audit, fuzz-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required CI job did not succeed ($r)"
              exit 1
            fi
          done
