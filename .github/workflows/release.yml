name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build artifacts without creating a release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag names the artifacts; Cargo.toml names the binary. Nothing checked
  # they agree.
  #
  # Every artifact filename, the .deb Version:, the .rpm version and the
  # Homebrew formula are all derived from ${GITHUB_REF_NAME#v}. The version the
  # binary reports comes from Cargo.toml. Tag v0.6.0 without bumping the crate
  # and the release ships packages labelled 0.6.0 containing a binary that says
  # 0.5.49 — into users' package managers, attested and checksummed, with every
  # badge green. The failure is silent precisely because both halves are
  # internally consistent.
  #
  # This is a real near-miss, not a hypothetical: a v0.5.48 tag was once
  # created while the release commit was still being rejected by a hook, and
  # pushing it would have produced exactly that mismatch.
  preflight:
    name: Tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag against Cargo.toml
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          case "${GITHUB_REF_NAME}" in
            v*) tag="${GITHUB_REF_NAME#v}" ;;
            *)  echo "not a version tag (${GITHUB_REF_NAME}); nothing to compare"; exit 0 ;;
          esac
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} would ship artifacts named $tag containing a binary that reports $crate"
            exit 1
          fi

  build:
    needs: preflight
    name: Build (${{ matrix.target }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }})
    runs-on: ${{ matrix.os }}
    # GitHub's default is six hours. A smoke test that hung once already held a
    # release for 37 minutes before it was cancelled by hand; this is the
    # backstop that does not depend on any shell utility being present.
    timeout-minutes: 45
    # gnu Linux targets build inside rust:1-bookworm so the binaries (and the
    # .debs made from them) need only glibc >= 2.36 — Debian 12+, Ubuntu 23.04+.
    # ubuntu-latest is 24.04 (glibc 2.39), and the cross-rs :main images are
    # also 24.04-based, so neither can produce a 2.36-floor binary. The
    # "Enforce glibc floor" step below fails the build if the floor regresses.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1-bookworm
            cross: false
          # noaudio variants: binary built without the `audio` feature, .deb
          # ships no plugin and no libasound Recommends — for headless servers
          # where apt would otherwise pull in the ALSA stack. Deb-only (no
          # tarball); static musl tarballs already cover the no-audio case.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1-bookworm
            cross: false
            variant: noaudio
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # aarch64 gnu cross-compiles inside bookworm via Debian multiarch
          # (gcc-aarch64-linux-gnu + :arm64 dev packages) instead of cross-rs,
          # for the same glibc-2.36 floor as x86_64.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1-bookworm
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1-bookworm
            cross: false
            variant: noaudio
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install build deps (bookworm container)
        if: matrix.container
        shell: bash
        run: |
          apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            dpkg --add-architecture arm64
            apt-get update
            apt-get install -y gcc-aarch64-linux-gnu libpcap-dev:arm64 libasound2-dev:arm64
          else
            apt-get install -y libpcap-dev libasound2-dev
          fi

      - name: Configure aarch64 multiarch cross-compile
        if: matrix.target == 'aarch64-unknown-linux-gnu' && matrix.container
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      - name: Compute feature set
        id: features
        shell: bash
        run: |
          # No-audio set = "full minus audio". musl is ALWAYS no-audio, and not
          # as a preference: the playback plugin is loaded with dlopen, and
          # static musl has no dynamic loader — dlopen returns NULL with
          # "Dynamic loading not supported". Compiling `audio` in would produce
          # a binary advertising a feature it cannot ever perform. (Measured;
          # the comment here previously said "impractical", which invited
          # someone to try.) A dynamically linked musl build *can* load the
          # plugin, but only runs on musl hosts, so it is not what these
          # portable tarballs are for. The gnu `variant: noaudio` matrix entries
          # build the no-audio set with a "-noaudio" artifact suffix.
          noaudio_set="native,tui,tls,hep,api,mcp,mcp-http,metrics"

          case "${{ matrix.target }}" in
            *-linux-musl)
              features="$noaudio_set"
              suffix=""
              ;;
            *)
              if [ "${{ matrix.variant }}" = "noaudio" ]; then
                features="$noaudio_set"
                suffix="-noaudio"
              else
                features="full"
                suffix=""
              fi
              ;;
          esac

          # The audio plugin (libsipnab_audio cdylib) ships only on dynamic
          # builds that include audio: gnu + macOS with audio == "full".
          # musl (static, no-audio) and -noaudio builds skip the plugin.
          audio_plugin="no"
          case "${{ matrix.target }}" in
            *-linux-musl) audio_plugin="no" ;;
            *) [ "$features" = "full" ] && audio_plugin="yes" ;;
          esac

          echo "features=$features" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "audio_plugin=$audio_plugin" >> "$GITHUB_OUTPUT"
          echo "Target ${{ matrix.target }} -> features=$features suffix='$suffix' audio_plugin=$audio_plugin"

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --no-default-features --features ${{ steps.features.outputs.features }} --bin sipnab

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features ${{ steps.features.outputs.features }} --bin sipnab

      - name: Build audio plugin (cross)
        if: matrix.cross && steps.features.outputs.audio_plugin == 'yes'
        run: cross build --release --target ${{ matrix.target }} -p sipnab-audio

      - name: Build audio plugin (native)
        if: '!matrix.cross && steps.features.outputs.audio_plugin == ''yes'''
        run: cargo build --release --target ${{ matrix.target }} -p sipnab-audio

      - name: Strip binary
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) strip_bin=aarch64-linux-gnu-strip ;;
            *) strip_bin=strip ;;
          esac
          "$strip_bin" "target/${{ matrix.target }}/release/sipnab" || true

      # Execute what we are about to ship.
      #
      # Until now this workflow built eight targets, gated their glibc floor and
      # their size, attested their provenance and published them — without ever
      # running one. Six of the nine artifacts had no test of any kind against
      # them, because ci.yml only tests the runner's own arch and libc. Those
      # gates check things *about* a binary; none of them check that it works.
      #
      # aarch64 Linux runs under qemu-user. macOS x86_64 on an arm64 runner is
      # the one case that cannot run here, and it says so loudly rather than
      # passing quietly — a skip nobody sees is how this hole stayed open.
      - name: Smoke test the built binary
        shell: bash
        run: |
          set -uo pipefail
          bin="target/${{ matrix.target }}/release/sipnab"
          runner_arch="$(uname -m)"
          run=""

          case "${{ matrix.target }}" in
            x86_64-*-linux-*)
              [ "$runner_arch" = "x86_64" ] && run="" || run="SKIP:arch"
              ;;
            aarch64-*-linux-*)
              if [ "$runner_arch" = "aarch64" ]; then
                run=""
              elif command -v qemu-aarch64-static >/dev/null 2>&1; then
                run="qemu-aarch64-static"
              elif command -v apt-get >/dev/null 2>&1; then
                # sudo when not root. The gnu targets build inside a container
                # and are root, so a bare apt-get worked there; the musl targets
                # run straight on ubuntu-latest as a normal user, where it fails
                # and this fell through to SKIP:no-qemu — so aarch64 musl shipped
                # completely un-executed while its job showed green, and I read
                # that tick as proof it had run.
                SUDO=""
                [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1 && SUDO="sudo"
                $SUDO apt-get update -qq && $SUDO apt-get install -y -qq qemu-user-static \
                  && run="qemu-aarch64-static" || run="SKIP:no-qemu"
              else
                run="SKIP:no-qemu"
              fi
              ;;
            aarch64-apple-darwin)
              [ "$runner_arch" = "arm64" ] && run="" || run="SKIP:arch"
              ;;
            x86_64-apple-darwin)
              # macos-latest is arm64; Rosetta is not guaranteed on runners.
              if [ "$runner_arch" = "x86_64" ]; then run=""; else run="SKIP:rosetta"; fi
              ;;
          esac

          if [ "${run#SKIP:}" != "$run" ]; then
            echo "::warning::NOT smoke-tested on this runner (${run#SKIP:}): ${{ matrix.target }} ships without having been executed"
            exit 0
          fi

          # gnu aarch64 under qemu needs the arm64 loader and libs, which the
          # multiarch build deps already installed.
          if [ "$run" = "qemu-aarch64-static" ] && [ -d /usr/aarch64-linux-gnu ]; then
            export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          fi

          # Bound each invocation where the platform can. `timeout` is GNU
          # coreutils and macOS does not ship it — the first attempt at bounding
          # these calls used it unconditionally and failed every macOS target
          # with "timeout: command not found". Homebrew installs it as
          # `gtimeout`. Where neither exists the commands run unbounded and the
          # job-level timeout-minutes above is the backstop.
          tmo_bin=""
          if command -v timeout >/dev/null 2>&1; then tmo_bin=timeout
          elif command -v gtimeout >/dev/null 2>&1; then tmo_bin=gtimeout
          else echo "no timeout utility on this runner; relying on job timeout-minutes"
          fi

          # No arrays. macOS ships bash 3.2, where expanding an EMPTY array as
          # "${arr[@]}" under `set -u` is an unbound-variable error — the array
          # version of this helper failed aarch64-apple-darwin instantly at
          # --version while every Linux target (bash 5) ran it happily. Four
          # explicit cases are duller and work on both.
          bounded() { # bounded <seconds> <args...>
            secs="$1"; shift
            if [ -n "$tmo_bin" ] && [ -n "$run" ]; then "$tmo_bin" "$secs" "$run" "$@"
            elif [ -n "$tmo_bin" ]; then "$tmo_bin" "$secs" "$@"
            elif [ -n "$run" ]; then "$run" "$@"
            else "$@"
            fi
          }

          echo "::group::--version"
          bounded 60 "$bin" --version || { echo "::error::$bin failed to run (or timed out)"; exit 1; }
          echo "::endgroup::"

          echo "::group::--help"
          bounded 60 "$bin" --help > /dev/null || { echo "::error::$bin --help failed (or timed out)"; exit 1; }
          echo "::endgroup::"

          # The capture parse is skipped for gnu binaries under emulation, and
          # the reason is specific rather than defensive. Reading a capture
          # drops privileges, which calls getpwnam(); glibc answers that through
          # NSS, which dlopen()s libnss_files.so; and dlopen under qemu-user
          # deadlocks. --version and --help above run fine under the same
          # emulator, and the static musl aarch64 binary completes this parse
          # under qemu without trouble precisely because it resolves users
          # without NSS. So this is a limitation of emulating glibc, not a
          # property of the binary being shipped.
          if [ -n "$run" ] && case "${{ matrix.target }}" in *-linux-gnu) true ;; *) false ;; esac; then
            echo "::warning::${{ matrix.target }}: capture parse not exercised — glibc NSS dlopen deadlocks under qemu-user. Loading and CLI verified; the packet path was not."
            echo "smoke test passed (load + CLI only) for ${{ matrix.target }}"
            exit 0
          fi

          echo "::group::parse a fixture capture"
          out=$(bounded 120 "$bin" -N -I tests/pcap-samples/codec-negotiation.pcap 2>&1) || {
            echo "$out"
            echo "::error::$bin failed or timed out parsing the fixture capture"
            exit 1
          }
          echo "$out"
          echo "::endgroup::"
          if ! printf '%s' "$out" | grep -q "packets captured"; then
            echo "::error::$bin ran but did not parse the fixture capture"
            exit 1
          fi
          echo "smoke test passed for ${{ matrix.target }}"

      # Regression gate for the glibc floor: a binary that links symbols newer
      # than 2.36 would fail on Debian 12 with "GLIBC_x.yz not found".
      - name: Enforce glibc floor (gnu Linux targets)
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          floor="2.36"
          check() {
            local max
            max=$(readelf -V "$1" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | cut -d_ -f2)
            echo "$1 needs glibc >= $max (floor $floor)"
            if [ "$(printf '%s\n%s\n' "$max" "$floor" | sort -V | tail -1)" != "$floor" ]; then
              echo "::error::$1 requires GLIBC_$max > $floor — breaks Debian 12; the build environment has drifted"
              return 1
            fi
          }
          check "target/${{ matrix.target }}/release/sipnab"
          if [ "${{ steps.features.outputs.audio_plugin }}" = "yes" ]; then
            check "target/${{ matrix.target }}/release/libsipnab_audio.so"
          fi

      # The homepage stat tile and the build docs both quote a size ceiling for
      # the stripped static binary. Nothing measured it: the tile said 5 MB
      # while the shipped musl binary was 9.34 MB, and the only gate compared
      # the tile's number to its own fallback text. This compares the claim to
      # the artifact, which is the only place the truth exists.
      - name: Enforce published binary size (musl targets)
        if: contains(matrix.target, '-linux-musl')
        shell: bash
        run: |
          ceiling=$(grep -m1 '^binary_size_ceiling_mb = ' website/config.toml | sed -E 's/.*"([0-9]+)".*/\1/')
          [ -n "$ceiling" ] || { echo "::error::binary_size_ceiling_mb missing from website/config.toml"; exit 1; }
          bin="target/${{ matrix.target }}/release/sipnab"
          bytes=$(stat -c%s "$bin" 2>/dev/null || stat -f%z "$bin")
          limit=$((ceiling * 1024 * 1024))
          # Integer arithmetic only: `bc` is not guaranteed on a runner, and a
          # gate that runs solely at release time must not fail on its own tools.
          printf '%s is %s bytes (%s.%02d MB), ceiling %s MB\n' \
            "$bin" "$bytes" "$((bytes / 1048576))" "$((bytes % 1048576 * 100 / 1048576))" "$ceiling"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::$bin is $bytes bytes, over the ${ceiling} MB published on the homepage and in the build docs — shrink it or raise binary_size_ceiling_mb in website/config.toml (and the claims it feeds)"
            exit 1
          fi

      # noaudio variants are deb-only: static musl tarballs already cover the
      # no-audio tarball case, so skip the redundant gnu-noaudio tar.gz.
      - name: Package (tar.gz + checksum)
        if: matrix.variant != 'noaudio'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "${GITHUB_REF_NAME}" ] && version="dev"
          stage="sipnab-${version}-${{ matrix.target }}${{ steps.features.outputs.suffix }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/sipnab" "dist/${stage}/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md "dist/${stage}/"
          [ -f man/sipnab.1 ] && cp man/sipnab.1 "dist/${stage}/"
          # Stage the audio plugin alongside the binary when it was built.
          if [ "${{ steps.features.outputs.audio_plugin }}" = "yes" ]; then
            case "${{ matrix.target }}" in
              *-apple-darwin) plugin="target/${{ matrix.target }}/release/libsipnab_audio.dylib" ;;
              *)              plugin="target/${{ matrix.target }}/release/libsipnab_audio.so" ;;
            esac
            if [ -f "$plugin" ]; then
              cp "$plugin" "dist/${stage}/"
            else
              echo "WARNING: audio plugin expected but not found at $plugin" >&2
            fi
          fi
          ( cd dist && tar -czf "${stage}.tar.gz" "${stage}" && rm -rf "${stage}" )
          if command -v sha256sum >/dev/null; then
            ( cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256" )
          fi

      - name: Build .deb (gnu Linux targets)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "${GITHUB_REF_NAME}" ] && version="dev"
          # Debian versions must start with a digit; for non-tag (dev) builds,
          # base it on the crate version so dpkg-deb accepts it (e.g. 0.4.1~dev).
          case "$version" in
            [0-9]*) deb_version="$version" ;;
            *) deb_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)~$version" ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  deb_arch=amd64 ;;
            aarch64-unknown-linux-gnu) deb_arch=arm64 ;;
            *) echo "unexpected target ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          # Pass the prebuilt audio plugin to the deb builder when present so it
          # ships at /usr/lib/sipnab/ and adds the libasound Recommends. The
          # noaudio variant builds a plugin-free, Recommends-free package and
          # the builder itself appends the "-noaudio" filename suffix.
          plugin_arg=""
          if [ "${{ steps.features.outputs.audio_plugin }}" = "yes" ] \
             && [ -f "target/${{ matrix.target }}/release/libsipnab_audio.so" ]; then
            plugin_arg="target/${{ matrix.target }}/release/libsipnab_audio.so"
          fi
          SIPNAB_BIN="target/${{ matrix.target }}/release/sipnab" \
          SIPNAB_AUDIO_PLUGIN="$plugin_arg" \
            bash contrib/deb/build-deb.sh "$deb_version" "$deb_arch" "${{ matrix.variant }}"
          mkdir -p dist
          suffix="${{ steps.features.outputs.suffix }}"
          mv "sipnab_${deb_version}_${deb_arch}${suffix}.deb" dist/

      - name: Build .rpm (gnu Linux targets)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          # rpmbuild is preinstalled nowhere: the gnu jobs run as root in a
          # rust:1-bookworm container (no sudo binary), host runners need sudo.
          SUDO=""; command -v sudo >/dev/null && SUDO=sudo
          $SUDO apt-get update || true
          $SUDO apt-get install -y rpm
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "${GITHUB_REF_NAME}" ] && version="dev"
          # RPM versions must start with a digit too; mirror the .deb scheme
          # for non-tag (dev) builds (~ sorts before release in rpm as well).
          case "$version" in
            [0-9]*) rpm_version="$version" ;;
            *) rpm_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)~$version" ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  rpm_arch=x86_64 ;;
            aarch64-unknown-linux-gnu) rpm_arch=aarch64 ;;
            *) echo "unexpected target ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          # Same prebuilt-binary/plugin contract as the .deb step; the
          # builder appends the "-noaudio" filename suffix itself.
          plugin_arg=""
          if [ "${{ steps.features.outputs.audio_plugin }}" = "yes" ] \
             && [ -f "target/${{ matrix.target }}/release/libsipnab_audio.so" ]; then
            plugin_arg="target/${{ matrix.target }}/release/libsipnab_audio.so"
          fi
          SIPNAB_BIN="target/${{ matrix.target }}/release/sipnab" \
          SIPNAB_AUDIO_PLUGIN="$plugin_arg" \
            bash contrib/rpm/build-rpm.sh "$rpm_version" "$rpm_arch" "${{ matrix.variant }}"
          mkdir -p dist
          suffix="${{ steps.features.outputs.suffix }}"
          mv "sipnab-${rpm_version}-1.${rpm_arch}${suffix}.rpm" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sipnab-${{ matrix.target }}${{ steps.features.outputs.suffix }}
          path: dist/

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # id-token + attestations power the sigstore provenance step below;
    # contents must be restated because a job-level block replaces the
    # workflow-level grant.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.deb *.rpm > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Sigstore build provenance for every artifact: cryptographic proof it
      # was built by THIS workflow from THIS commit, so a rehosted or tampered
      # copy is detectable. Anyone can check a download with
      #   gh attestation verify <file> --repo NormB/sipnab
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt

      # Run the exact command the docs tell downloaders to run.
      #
      # Attestation was "gated" only by a test asserting the string
      # `actions/attest-build-provenance@` appears in this file, which stays
      # true whether or not the attestation is usable -- the same shape as the
      # wiki gate that grepped its generator instead of running it. A subject
      # path that stops matching, a digest mismatch, or a permissions change
      # would all leave that grep passing and every download unverifiable.
      #
      # This verifies a real artifact against the real attestation before the
      # release is created, so a broken chain fails the release instead of
      # being discovered by a user.
      - name: Verify the attestation we just created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject=$(ls artifacts/*-x86_64-unknown-linux-musl.tar.gz | head -1)
          echo "verifying $subject"

          # `gh attestation verify` prints its human summary only on a TTY, so
          # on a runner a passing run left NO output at all -- the log showed
          # the command and then the next step. An exit code alone is the same
          # "trust the tick" evidence this workflow exists to stop accepting.
          #
          # The exit code IS the gate: verify fails if the artifact does not
          # match a signed attestation for this repo. Everything below only
          # renders what was checked into the log, and is deliberately unable
          # to fail the release -- a wrong jq path must not turn a good release
          # red, which would teach the next person to stop trusting this step.
          out=$(gh attestation verify "$subject" --repo "${{ github.repository }}" \
                  --format json 2>&1) || { echo "$out"; exit 1; }

          echo "--- what was verified ---"
          # Shape-agnostic: find whichever object carries the provenance fields
          # rather than assuming gh's nesting, which is not a stable contract.
          printf '%s' "$out" | jq -r '
            [.. | objects | select(has("sourceRepositoryURI") or has("issuer"))] as $c
            | if ($c | length) == 0 then "（no provenance fields found; raw output below）"
              else ($c[0] | "issuer: \(.issuer // "?")\nrepo:   \(.sourceRepositoryURI // "?")\nsha:    \(.sourceRepositoryDigest // "?")")
              end' 2>/dev/null \
            || printf '%s\n' "$out" | head -20
          echo "-------------------------"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt

  tap:
    name: Bump Homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pull the SHA256SUMS.txt that the release job just attached to the GitHub
      # release; it is the single source of truth for every artifact checksum.
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS.txt --dir .

      - name: Render formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash contrib/homebrew/update-formula.sh "$version" SHA256SUMS.txt > sipnab.rb
          echo "----- generated Formula/sipnab.rb -----"
          cat sipnab.rb

      # Push the rendered formula to NormB/homebrew-tap so that
      # `brew reinstall normb/tap/sipnab` serves the just-released version.
      # Requires a HOMEBREW_TAP_TOKEN secret: a PAT (classic: `repo`, or
      # fine-grained: Contents read+write on NormB/homebrew-tap) — the default
      # GITHUB_TOKEN cannot push to a different repository. If the secret is
      # absent the release still succeeds; only the auto-bump is skipped.
      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning title=Homebrew tap not bumped::HOMEBREW_TAP_TOKEN secret is not set; skipping auto-bump. Set a PAT with contents:write on NormB/homebrew-tap to enable it."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/NormB/homebrew-tap.git" tap
          install -m 0644 sipnab.rb tap/Formula/sipnab.rb
          cd tap
          if git diff --quiet -- Formula/sipnab.rb; then
            echo "homebrew-tap already at ${version}; nothing to push."
            exit 0
          fi
          git config user.name  "sipnab-release"
          git config user.email "n.brandinger@gmail.com"
          git add Formula/sipnab.rb
          git commit -m "sipnab: bump to ${version}"
          git push origin HEAD:main
          echo "homebrew-tap bumped to ${version}."
