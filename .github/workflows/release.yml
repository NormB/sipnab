name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build artifacts without creating a release'
        required: false
        default: 'true'
        type: boolean

# Read by default. Only the `release` job publishes, and it restates what it
# needs in its own block. `preflight` and `build` just check out and upload
# artifacts, and `tap` reads the release with github.token but pushes to
# NormB/homebrew-tap with a separate secret — GITHUB_TOKEN cannot write to
# another repository, so none of the three needs write here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag names the artifacts; Cargo.toml names the binary. Nothing checked
  # they agree.
  #
  # Every artifact filename, the .deb Version:, the .rpm version and the
  # Homebrew formula are all derived from ${GITHUB_REF_NAME#v}. The version the
  # binary reports comes from Cargo.toml. Tag v0.6.0 without bumping the crate
  # and the release ships packages labeled 0.6.0 containing a binary that says
  # 0.5.49 — into users' package managers, attested and checksummed, with every
  # badge green. The failure is silent precisely because both halves are
  # internally consistent.
  #
  # This is a real near-miss, not a hypothetical: a v0.5.48 tag was once
  # created while the release commit was still being rejected by a hook, and
  # pushing it would have produced exactly that mismatch.
  preflight:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 16.7 min slowest (aarch64-apple-darwin build).
    timeout-minutes: 45
    name: Tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Compare the tag against Cargo.toml
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          case "${GITHUB_REF_NAME}" in
            v*) tag="${GITHUB_REF_NAME#v}" ;;
            *)  echo "not a version tag (${GITHUB_REF_NAME}); nothing to compare"; exit 0 ;;
          esac
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} would ship artifacts named $tag containing a binary that reports $crate"
            exit 1
          fi

  build:
    needs: preflight
    name: Build (${{ matrix.target }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }})
    runs-on: ${{ matrix.os }}
    # GitHub's default is six hours. A smoke test that hung once already held a
    # release for 37 minutes before it was canceled by hand; this is the
    # backstop that does not depend on any shell utility being present.
    timeout-minutes: 45
    # gnu Linux targets build inside rust:1-bookworm so the binaries (and the
    # .debs made from them) need only glibc >= 2.36 — Debian 12+, Ubuntu 23.04+.
    # ubuntu-latest is 24.04 (glibc 2.39), and the cross-rs :main images are
    # also 24.04-based, so neither can produce a 2.36-floor binary. The
    # "Enforce glibc floor" step below fails the build if the floor regresses.
    # The image is pinned by digest in the matrix below. `rust:1-bookworm` is a
    # floating tag: it is republished, and it compiles the gnu binaries and the
    # .debs this release ships — so an unpinned one means the artifacts users
    # install came from an image nothing in the repo names. Dependabot's
    # github-actions ecosystem updates `container:` digests, so this stays fresh.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1-bookworm@sha256:77fac8b98f9f46062bb680b6d25d5bcaabfc400143952ebc572e924bcbedc3fa
            cross: false
          # noaudio variants: binary built without the `audio` feature. Both
          # the .deb and the .rpm ship no plugin and no ALSA weak dependency
          # (libasound Recommends / alsa-lib Recommends) — for headless servers
          # where apt or dnf would otherwise pull in the ALSA stack. Packages
          # only, no tarball; static musl tarballs already cover the no-audio
          # tarball case.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1-bookworm@sha256:77fac8b98f9f46062bb680b6d25d5bcaabfc400143952ebc572e924bcbedc3fa
            cross: false
            variant: noaudio
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # aarch64 gnu cross-compiles inside bookworm via Debian multiarch
          # (gcc-aarch64-linux-gnu + :arm64 dev packages) instead of cross-rs,
          # for the same glibc-2.36 floor as x86_64.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1-bookworm@sha256:77fac8b98f9f46062bb680b6d25d5bcaabfc400143952ebc572e924bcbedc3fa
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            container: rust:1-bookworm@sha256:77fac8b98f9f46062bb680b6d25d5bcaabfc400143952ebc572e924bcbedc3fa
            cross: false
            variant: noaudio
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # ci.yml gets these from .deb files in actions/cache and reaches no
      # network at all (.github/actions/system-deps). This job cannot: it runs
      # as root inside a pinned bookworm container where the package set is
      # multiarch and actions/cache has no meaning. That exclusion still holds.
      #
      # What it did not account for is that a fetch failing HERE is strictly
      # worse than a fetch failing in CI, because the tag is already public.
      # `Create Release` and the Homebrew bump are `needs: build`, so one
      # unresponsive archive publishes a tag with no artefacts behind it —
      # measured on 0.5.120. Bounding and retrying are available even where
      # caching is not, so the fetch stays and is made to fail fast and to
      # NAME ITSELF: an unbounded apt-get that hung for fifteen minutes is
      # what canceled the 0.5.118 CI run, and the log said nothing useful.
      - name: Install build deps (bookworm container)
        if: matrix.container
        shell: bash
        # TARGET through env rather than interpolated into the script body:
        # `${{ }}` is substituted as TEXT before bash sees it, so a value
        # carrying `;` or `$(...)` would be code. A matrix literal cannot, but
        # the habit is what keeps the next step safe.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          apt_bounded() { # apt_bounded <seconds> <apt args...>
            local secs="$1"; shift
            local what="$1"
            # apt neither retries nor gives up on its own. Acquire::Retries
            # covers a dropped connection; the Timeouts cover a stalled read;
            # `timeout` covers the case neither does, a host that keeps the
            # socket alive and sends nothing.
            if ! timeout "$secs" apt-get \
                 -o Acquire::Retries=5 \
                 -o Acquire::http::Timeout=30 \
                 -o Acquire::https::Timeout=30 "$@"; then
              echo "::error::FETCH failure, not a build failure: apt-get $what did not complete within ${secs}s against the Debian archives. No sipnab source was compiled and nothing in this repository is broken — re-run the job."
              exit 1
            fi
          }
          apt_bounded 300 update
          if [ "$TARGET" = "aarch64-unknown-linux-gnu" ]; then
            dpkg --add-architecture arm64
            apt_bounded 300 update
            apt_bounded 600 install -y gcc-aarch64-linux-gnu libpcap-dev:arm64 libasound2-dev:arm64
          else
            apt_bounded 600 install -y libpcap-dev libasound2-dev
          fi

      - name: Configure aarch64 multiarch cross-compile
        if: matrix.target == 'aarch64-unknown-linux-gnu' && matrix.container
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      # Pin the macOS floor instead of inheriting it.
      #
      # Nothing set MACOSX_DEPLOYMENT_TARGET, so the floor of each darwin tarball
      # was whatever the pinned rustc happened to default to for that target --
      # a real value that no file in this repo named. /download stated "macOS
      # 12+" for both, which was wrong for both and hid that the two differ.
      #
      # These are deliberately the current rustc defaults, so declaring them
      # changes no binary. The point is that a toolchain bump can no longer move
      # the published floor silently: it is set here, `published_macos_floors`
      # asserts website/config.toml matches these two lines, and the same gate
      # asserts neither is below what the compiler would produce -- a floor lower
      # than the compiler's is a claim the binary cannot honor.
      #
      # To change real support, change these and let the gate walk the published
      # numbers to match.
      - name: Pin macOS deployment target
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        # TARGET through env rather than interpolated into the script. This one is
        # a matrix literal and cannot carry attacker input, but the habit is what
        # keeps the next step that reads a branch name or a commit message safe.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            aarch64-apple-darwin) floor="11.0" ;;
            x86_64-apple-darwin)  floor="10.12" ;;
            *) echo "unhandled darwin target $TARGET" >&2; exit 1 ;;
          esac
          echo "MACOSX_DEPLOYMENT_TARGET=$floor" >> "$GITHUB_ENV"
          echo "pinned $TARGET to macOS $floor"

      - name: Compute feature set
        id: features
        shell: bash
        run: |
          # No-audio set = "full minus audio". musl is ALWAYS no-audio, and not
          # as a preference: the playback plugin is loaded with dlopen, and
          # static musl has no dynamic loader — dlopen returns NULL with
          # "Dynamic loading not supported". Compiling `audio` in would produce
          # a binary advertising a feature it cannot ever perform. (Measured;
          # the comment here previously said "impractical", which invited
          # someone to try.) A dynamically linked musl build *can* load the
          # plugin, but only runs on musl hosts, so it is not what these
          # portable tarballs are for. The gnu `variant: noaudio` matrix entries
          # build the no-audio set with a "-noaudio" artifact suffix.
          noaudio_set="native,tui,tls,hep,api,mcp,mcp-http,metrics"

          case "${{ matrix.target }}" in
            *-linux-musl)
              features="$noaudio_set"
              suffix=""
              ;;
            *)
              if [ "${{ matrix.variant }}" = "noaudio" ]; then
                features="$noaudio_set"
                suffix="-noaudio"
              else
                features="full"
                suffix=""
              fi
              ;;
          esac

          # The eBPF uprobe backend, on the gnu targets ONLY.
          #
          # `--uprobe-tls` has two backends and they are not equivalent. The
          # default, `tracefs`, sees no socket, so its dialogs name a PROCESS
          # rather than a peer; `bpf` pairs each write with its `tcp_sendmsg`
          # and recovers the real addresses. Every published binary used to be
          # built with `full`, which excludes `bpf`, so `--uprobe-backend bpf`
          # refused on all of them and the capable path was invisible to
          # everyone who installs a release.
          #
          # Both variants of both gnu targets, because `bpf` is orthogonal to
          # `audio` and the `noaudio` .deb/.rpm are the headless-server
          # packages most likely to be pointed at a TLS-terminating proxy.
          #
          # NOT musl, and the reason is measured rather than assumed: `bpf`
          # costs +589,952 bytes, and the published 0.5.117 x86_64 musl binary
          # is 12,252,424 bytes against the 12 MB ceiling the size gate below
          # enforces — 330,488 bytes of headroom. It does not fit, and a static
          # tarball that fails its own size gate is not a release.
          #
          # NOT macOS: `aya` is declared under
          # `[target.'cfg(target_os = "linux")'.dependencies]`, so the feature
          # would compile to nothing there while `--version` advertised it.
          #
          # bpf_required drives SIPNAB_BPF_REQUIRED on the build steps: with it
          # set, a runner missing bpf-linker or nightly FAILS instead of
          # embedding the empty placeholder object that makes a binary
          # advertise `bpf` and refuse at runtime.
          bpf_required="0"
          case "${{ matrix.target }}" in
            *-linux-gnu)
              features="${features},bpf"
              bpf_required="1"
              ;;
          esac

          # The audio plugin (libsipnab_audio cdylib) ships only on dynamic
          # builds that include audio: gnu + macOS with audio == "full".
          # musl (static, no-audio) and -noaudio builds skip the plugin.
          audio_plugin="no"
          case "${{ matrix.target }}" in
            *-linux-musl) audio_plugin="no" ;;
            *) [ "$features" = "full" ] && audio_plugin="yes" ;;
          esac

          echo "features=$features" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "audio_plugin=$audio_plugin" >> "$GITHUB_OUTPUT"
          echo "bpf_required=$bpf_required" >> "$GITHUB_OUTPUT"
          echo "Target ${{ matrix.target }} -> features=$features suffix='$suffix' audio_plugin=$audio_plugin bpf_required=$bpf_required"

      # The eBPF kernel half needs a nightly toolchain (for `-Z build-std=core`)
      # and bpf-linker. Installed only where `bpf` ships, so the musl and macOS
      # legs pay nothing.
      #
      # The prebuilt tarball, NOT `cargo install bpf-linker`: the published
      # binary is statically linked against its own LLVM, so it needs no
      # llvm-dev in the container and takes seconds instead of a source build.
      # Measured locally on the aarch64 equivalent: the kernel object builds in
      # ~11 s once the linker is on PATH, and comes out at 126,248 bytes.
      #
      # x86_64 only, and that is not an assumption: BOTH gnu matrix entries run
      # on ubuntu-latest, with the aarch64 binary cross-compiled inside
      # rust:1-bookworm, so the host executing bpf-linker is x86_64 either way.
      # The check below fails loudly if that ever stops being true rather than
      # installing a binary for the wrong architecture.
      - name: Install the eBPF build toolchain
        if: steps.features.outputs.bpf_required == '1'
        shell: bash
        env:
          BPF_LINKER_VERSION: '0.11.0'
          # Recorded 2026-08-20 from
          # aya-rs/bpf-linker v0.11.0, bpf-linker-x86_64-unknown-linux-musl.tar.zst
          BPF_LINKER_SHA256: '10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450'
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "::error::the eBPF toolchain install only carries an x86_64 bpf-linker, but this runner is $arch"
            exit 1
          fi

          rustup toolchain install nightly --profile minimal --component rust-src
          rustup component add rust-src --toolchain nightly

          # zstd is how the upstream tarball is compressed; bookworm's tar needs
          # the binary present for `--zstd`.
          if ! command -v zstd >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              (timeout 300 apt-get -o Acquire::Retries=5 update && timeout 300 apt-get -o Acquire::Retries=5 install -y zstd) \
                || (sudo timeout 300 apt-get -o Acquire::Retries=5 update && sudo timeout 300 apt-get -o Acquire::Retries=5 install -y zstd)
            fi
          fi

          # The sha256 check below was already here and stays: it is what turns
          # a substituted or truncated tarball into "this download is wrong"
          # rather than a linker that misbehaves later. What it lacked was a
          # retry — one dropped connection to github.com failed a job that
          # produces every gnu artifact and both packages — and a bound, so a
          # stalled transfer costs 5 minutes instead of the job's 45.
          tarball="bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o "$tarball" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/${tarball}" \
            || { echo "::error::FETCH failure, not a build failure: curl could not download $tarball from github.com after 5 attempts. No sipnab source was compiled — re-run the job."; exit 1; }
          echo "${BPF_LINKER_SHA256}  ${tarball}" | sha256sum -c - \
            || { echo "::error::FETCH corrupt, not a build failure: $tarball does not match BPF_LINKER_SHA256. Do NOT re-run — github.com served bytes other than the pinned ones."; exit 1; }
          tar --zstd -xf "$tarball"
          install -m 0755 bpf-linker /usr/local/bin/bpf-linker \
            || sudo install -m 0755 bpf-linker /usr/local/bin/bpf-linker
          rm -f "$tarball" bpf-linker
          bpf-linker --version

      - name: Build (cross)
        if: matrix.cross
        env:
          SIPNAB_BPF_REQUIRED: ${{ steps.features.outputs.bpf_required }}
        run: cross build --release --target ${{ matrix.target }} --no-default-features --features ${{ steps.features.outputs.features }} --bin sipnab

      # SIPNAB_BPF_REQUIRED=1 turns build.rs's degrading default into a hard
      # error. Without it, a runner missing bpf-linker or nightly would embed an
      # EMPTY placeholder object and publish a binary that advertises `bpf` in
      # --version and refuses on every host that runs it. The degrade is right
      # for a contributor and wrong for an artefact people install.
      - name: Build (native)
        if: '!matrix.cross'
        env:
          SIPNAB_BPF_REQUIRED: ${{ steps.features.outputs.bpf_required }}
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features ${{ steps.features.outputs.features }} --bin sipnab

      - name: Build audio plugin (cross)
        if: matrix.cross && steps.features.outputs.audio_plugin == 'yes'
        run: cross build --release --target ${{ matrix.target }} -p sipnab-audio

      - name: Build audio plugin (native)
        if: '!matrix.cross && steps.features.outputs.audio_plugin == ''yes'''
        run: cargo build --release --target ${{ matrix.target }} -p sipnab-audio

      # There is no strip step, deliberately. `[profile.release] strip = true`
      # in Cargo.toml strips at link time, for every target, as part of the
      # build that just ran.
      #
      # A separate `strip` invocation used to run here under `|| true`. On the
      # cross-compiled targets the host's GNU strip cannot even read the output
      # ("Unable to recognize the format of the input file") and had been
      # failing on every single release for the project's history; on native
      # targets it was a no-op against an already-stripped binary. `|| true`
      # meant neither outcome was visible, so it looked like the thing doing the
      # stripping while doing nothing at all.
      #
      # Removing the guesswork and asserting the property is the useful half.
      # readelf reads cross-architecture ELF happily, which is why it can check
      # what strip could not even open. Linux only: macOS artifacts are Mach-O
      # and readelf does not apply.
      - name: Verify the binary is stripped
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/sipnab"
          size=$(stat -c%s "$bin" 2>/dev/null || stat -f%z "$bin")
          if readelf -S "$bin" | grep -qE '\.symtab'; then
            echo "::error::$bin still has a .symtab — [profile.release] strip = true is no longer taking effect, and this artifact would ship with its symbol table"
            exit 1
          fi
          echo "$bin: no .symtab, $size bytes"

      # Execute what we are about to ship.
      #
      # Until now this workflow built eight targets, gated their glibc floor and
      # their size, attested their provenance and published them — without ever
      # running one. Six of the nine artifacts had no test of any kind against
      # them, because ci.yml only tests the runner's own arch and libc. Those
      # gates check things *about* a binary; none of them check that it works.
      #
      # aarch64 Linux runs under qemu-user. macOS x86_64 on an arm64 runner is
      # the one case that cannot run here, and it says so loudly rather than
      # passing quietly — a skip nobody sees is how this hole stayed open.
      - name: Smoke test the built binary
        shell: bash
        run: |
          set -uo pipefail
          bin="target/${{ matrix.target }}/release/sipnab"
          runner_arch="$(uname -m)"
          run=""

          case "${{ matrix.target }}" in
            x86_64-*-linux-*)
              [ "$runner_arch" = "x86_64" ] && run="" || run="SKIP:arch"
              ;;
            aarch64-*-linux-*)
              if [ "$runner_arch" = "aarch64" ]; then
                run=""
              elif command -v qemu-aarch64-static >/dev/null 2>&1; then
                run="qemu-aarch64-static"
              elif command -v apt-get >/dev/null 2>&1; then
                # sudo when not root. The gnu targets build inside a container
                # and are root, so a bare apt-get worked there; the musl targets
                # run straight on ubuntu-latest as a normal user, where it fails
                # and this fell through to SKIP:no-qemu — so aarch64 musl shipped
                # completely un-executed while its job showed green, and I read
                # that tick as proof it had run.
                SUDO=""
                [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1 && SUDO="sudo"
                # Bounded: this branch already degrades to SKIP:no-qemu on
                # failure, so an unbounded apt would not fail the job — it
                # would sit there until timeout-minutes killed a release build
                # that was one step from passing.
                $SUDO timeout 300 apt-get -o Acquire::Retries=5 update -qq && $SUDO timeout 300 apt-get -o Acquire::Retries=5 install -y -qq qemu-user-static \
                  && run="qemu-aarch64-static" || run="SKIP:no-qemu"
              else
                run="SKIP:no-qemu"
              fi
              ;;
            aarch64-apple-darwin)
              [ "$runner_arch" = "arm64" ] && run="" || run="SKIP:arch"
              ;;
            x86_64-apple-darwin)
              # macos-latest is arm64; Rosetta is not guaranteed on runners.
              if [ "$runner_arch" = "x86_64" ]; then run=""; else run="SKIP:rosetta"; fi
              ;;
          esac

          if [ "${run#SKIP:}" != "$run" ]; then
            echo "::warning::NOT smoke-tested on this runner (${run#SKIP:}): ${{ matrix.target }} ships without having been executed"
            exit 0
          fi

          # gnu aarch64 under qemu needs the arm64 loader and libs, which the
          # multiarch build deps already installed.
          if [ "$run" = "qemu-aarch64-static" ] && [ -d /usr/aarch64-linux-gnu ]; then
            export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          fi

          # Bound each invocation where the platform can. `timeout` is GNU
          # coreutils and macOS does not ship it — the first attempt at bounding
          # these calls used it unconditionally and failed every macOS target
          # with "timeout: command not found". Homebrew installs it as
          # `gtimeout`. Where neither exists the commands run unbounded and the
          # job-level timeout-minutes above is the backstop.
          tmo_bin=""
          if command -v timeout >/dev/null 2>&1; then tmo_bin=timeout
          elif command -v gtimeout >/dev/null 2>&1; then tmo_bin=gtimeout
          else echo "no timeout utility on this runner; relying on job timeout-minutes"
          fi

          # No arrays. macOS ships bash 3.2, where expanding an EMPTY array as
          # "${arr[@]}" under `set -u` is an unbound-variable error — the array
          # version of this helper failed aarch64-apple-darwin instantly at
          # --version while every Linux target (bash 5) ran it happily. Four
          # explicit cases are duller and work on both.
          bounded() { # bounded <seconds> <args...>
            secs="$1"; shift
            if [ -n "$tmo_bin" ] && [ -n "$run" ]; then "$tmo_bin" "$secs" "$run" "$@"
            elif [ -n "$tmo_bin" ]; then "$tmo_bin" "$secs" "$@"
            elif [ -n "$run" ]; then "$run" "$@"
            else "$@"
            fi
          }

          echo "::group::--version"
          bounded 60 "$bin" --version || { echo "::error::$bin failed to run (or timed out)"; exit 1; }
          echo "::endgroup::"

          echo "::group::--help"
          bounded 60 "$bin" --help > /dev/null || { echo "::error::$bin --help failed (or timed out)"; exit 1; }
          echo "::endgroup::"

          # The capture parse is skipped for gnu binaries under emulation, and
          # the reason is specific rather than defensive. Reading a capture
          # drops privileges, which calls getpwnam(); glibc answers that through
          # NSS, which dlopen()s libnss_files.so; and dlopen under qemu-user
          # deadlocks. --version and --help above run fine under the same
          # emulator, and the static musl aarch64 binary completes this parse
          # under qemu without trouble precisely because it resolves users
          # without NSS. So this is a limitation of emulating glibc, not a
          # property of the binary being shipped.
          if [ -n "$run" ] && case "${{ matrix.target }}" in *-linux-gnu) true ;; *) false ;; esac; then
            echo "::warning::${{ matrix.target }}: capture parse not exercised — glibc NSS dlopen deadlocks under qemu-user. Loading and CLI verified; the packet path was not."
            echo "smoke test passed (load + CLI only) for ${{ matrix.target }}"
            exit 0
          fi

          echo "::group::parse a fixture capture"
          out=$(bounded 120 "$bin" -N -I tests/pcap-samples/codec-negotiation.pcap 2>&1) || {
            echo "$out"
            echo "::error::$bin failed or timed out parsing the fixture capture"
            exit 1
          }
          echo "$out"
          echo "::endgroup::"
          if ! printf '%s' "$out" | grep -q "packets captured"; then
            echo "::error::$bin ran but did not parse the fixture capture"
            exit 1
          fi
          echo "smoke test passed for ${{ matrix.target }}"

      # Regression gate for the glibc floor: a binary that links symbols newer
      # than 2.36 would fail on Debian 12 with "GLIBC_x.yz not found".
      - name: Enforce glibc floor (gnu Linux targets)
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          floor="2.36"
          check() {
            local max
            max=$(readelf -V "$1" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | cut -d_ -f2)
            echo "$1 needs glibc >= $max (floor $floor)"
            if [ "$(printf '%s\n%s\n' "$max" "$floor" | sort -V | tail -1)" != "$floor" ]; then
              echo "::error::$1 requires GLIBC_$max > $floor — breaks Debian 12; the build environment has drifted"
              return 1
            fi
          }
          check "target/${{ matrix.target }}/release/sipnab"
          if [ "${{ steps.features.outputs.audio_plugin }}" = "yes" ]; then
            check "target/${{ matrix.target }}/release/libsipnab_audio.so"
          fi

      # The homepage stat tile and the build docs both quote a size ceiling for
      # the stripped static binary. Nothing measured it: the tile said 5 MB
      # while the shipped musl binary was 9.34 MB, and the only gate compared
      # the tile's number to its own fallback text. This compares the claim to
      # the artifact, which is the only place the truth exists.
      - name: Enforce published binary size (musl targets)
        if: contains(matrix.target, '-linux-musl')
        shell: bash
        run: |
          ceiling=$(grep -m1 '^binary_size_ceiling_mb = ' website/config.toml | sed -E 's/.*"([0-9]+)".*/\1/')
          [ -n "$ceiling" ] || { echo "::error::binary_size_ceiling_mb missing from website/config.toml"; exit 1; }
          bin="target/${{ matrix.target }}/release/sipnab"
          bytes=$(stat -c%s "$bin" 2>/dev/null || stat -f%z "$bin")
          limit=$((ceiling * 1024 * 1024))
          # Integer arithmetic only: `bc` is not guaranteed on a runner, and a
          # gate that runs solely at release time must not fail on its own tools.
          printf '%s is %s bytes (%s.%02d MB), ceiling %s MB\n' \
            "$bin" "$bytes" "$((bytes / 1048576))" "$((bytes % 1048576 * 100 / 1048576))" "$ceiling"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::$bin is $bytes bytes, over the ${ceiling} MB published on the homepage and in the build docs — shrink it or raise binary_size_ceiling_mb in website/config.toml (and the claims it feeds)"
            exit 1
          fi

      # noaudio variants ship as packages only — a .deb and an .rpm, built by
      # the two steps after this one. Static musl tarballs already cover the
      # no-audio tarball case, so skip the redundant gnu-noaudio tar.gz.
      - name: Package (tar.gz + checksum)
        if: matrix.variant != 'noaudio'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "${GITHUB_REF_NAME}" ] && version="dev"
          stage="sipnab-${version}-${{ matrix.target }}${{ steps.features.outputs.suffix }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/sipnab" "dist/${stage}/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md "dist/${stage}/"
          [ -f man/sipnab.1 ] && cp man/sipnab.1 "dist/${stage}/"
          # Stage the audio plugin alongside the binary when it was built.
          if [ "${{ steps.features.outputs.audio_plugin }}" = "yes" ]; then
            case "${{ matrix.target }}" in
              *-apple-darwin) plugin="target/${{ matrix.target }}/release/libsipnab_audio.dylib" ;;
              *)              plugin="target/${{ matrix.target }}/release/libsipnab_audio.so" ;;
            esac
            if [ -f "$plugin" ]; then
              cp "$plugin" "dist/${stage}/"
            else
              echo "WARNING: audio plugin expected but not found at $plugin" >&2
            fi
          fi
          ( cd dist && tar -czf "${stage}.tar.gz" "${stage}" && rm -rf "${stage}" )
          if command -v sha256sum >/dev/null; then
            ( cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256" )
          fi

      - name: Build .deb (gnu Linux targets)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "${GITHUB_REF_NAME}" ] && version="dev"
          # Debian versions must start with a digit; for non-tag (dev) builds,
          # base it on the crate version so dpkg-deb accepts it (e.g. 0.4.1~dev).
          case "$version" in
            [0-9]*) deb_version="$version" ;;
            *) deb_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)~$version" ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  deb_arch=amd64 ;;
            aarch64-unknown-linux-gnu) deb_arch=arm64 ;;
            *) echo "unexpected target ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          # Pass the prebuilt audio plugin to the deb builder when present so it
          # ships at /usr/lib/sipnab/ and adds the libasound Recommends. The
          # noaudio variant builds a plugin-free, Recommends-free package and
          # the builder itself appends the "-noaudio" filename suffix.
          plugin_arg=""
          if [ "${{ steps.features.outputs.audio_plugin }}" = "yes" ] \
             && [ -f "target/${{ matrix.target }}/release/libsipnab_audio.so" ]; then
            plugin_arg="target/${{ matrix.target }}/release/libsipnab_audio.so"
          fi
          SIPNAB_BIN="target/${{ matrix.target }}/release/sipnab" \
          SIPNAB_AUDIO_PLUGIN="$plugin_arg" \
            bash packaging/deb/build-deb.sh "$deb_version" "$deb_arch" "${{ matrix.variant }}"
          mkdir -p dist
          suffix="${{ steps.features.outputs.suffix }}"
          mv "sipnab_${deb_version}_${deb_arch}${suffix}.deb" dist/

      - name: Build .rpm (gnu Linux targets)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          # rpmbuild is preinstalled nowhere: the gnu jobs run as root in a
          # rust:1-bookworm container (no sudo binary), host runners need sudo.
          #
          # patchelf is what lets build-rpm.sh rewrite the packaged binary's
          # DT_NEEDED from Debian's libpcap.so.0.8 to the libpcap.so.1 every
          # RPM distribution ships. Without it the builder refuses to produce a
          # package at all, rather than publishing one dnf cannot install
          # (issue #244), so it belongs on the same line as rpm.
          SUDO=""; command -v sudo >/dev/null && SUDO=sudo
          # `|| true` on update only: a flaky third-party repo must not fail
          # the job when rpm and patchelf are in the main archives. The install
          # itself is load-bearing and says so when it fails.
          $SUDO timeout 300 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update || true
          $SUDO timeout 600 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y rpm patchelf \
            || { echo "::error::FETCH failure, not a build failure: apt-get install rpm patchelf did not complete within 600s. The binary is already built and gated; only the .rpm packaging step needs these. Re-run the job."; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "${GITHUB_REF_NAME}" ] && version="dev"
          # RPM versions must start with a digit too; mirror the .deb scheme
          # for non-tag (dev) builds (~ sorts before release in rpm as well).
          case "$version" in
            [0-9]*) rpm_version="$version" ;;
            *) rpm_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)~$version" ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  rpm_arch=x86_64 ;;
            aarch64-unknown-linux-gnu) rpm_arch=aarch64 ;;
            *) echo "unexpected target ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          # Same prebuilt-binary/plugin contract as the .deb step; the
          # builder appends the "-noaudio" filename suffix itself.
          plugin_arg=""
          if [ "${{ steps.features.outputs.audio_plugin }}" = "yes" ] \
             && [ -f "target/${{ matrix.target }}/release/libsipnab_audio.so" ]; then
            plugin_arg="target/${{ matrix.target }}/release/libsipnab_audio.so"
          fi
          SIPNAB_BIN="target/${{ matrix.target }}/release/sipnab" \
          SIPNAB_AUDIO_PLUGIN="$plugin_arg" \
            bash packaging/rpm/build-rpm.sh "$rpm_version" "$rpm_arch" "${{ matrix.variant }}"
          mkdir -p dist
          suffix="${{ steps.features.outputs.suffix }}"
          mv "sipnab-${rpm_version}-1.${rpm_arch}${suffix}.rpm" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sipnab-${{ matrix.target }}${{ steps.features.outputs.suffix }}
          path: dist/

  release:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 16.7 min slowest (aarch64-apple-darwin build).
    timeout-minutes: 45
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # id-token + attestations power the sigstore provenance step below;
    # contents must be restated because a job-level block replaces the
    # workflow-level grant.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          merge-multiple: true

      # ---------------------------------------------------------------------
      # CycloneDX SBOMs. Two, because sipnab ships as two binaries.
      #
      # The audio plugin is a separate workspace crate the binary dlopen()s at
      # runtime, and it pulls in seven dependencies that appear nowhere in the
      # main crate's graph: alsa, alsa-sys, cpal, dasp_sample, num-bigint,
      # num-rational, rodio. An SBOM of the main crate alone would omit exactly
      # the C-library-adjacent dependencies a vulnerability scan cares about,
      # while looking complete. libsipnab_audio.so ships inside the full .deb,
      # the full .rpm, and every audio-enabled tarball, so it needs its own.
      #
      # The main SBOM is generated with --features full,bpf deliberately: the
      # UNION of every feature set the build matrix compiles, so it over-covers
      # rather than under-covers every sipnab binary published here. The musl
      # and noaudio artifacts build a strict SUBSET of that graph (measured on
      # 0.5.54, full and noaudio differ by exactly one component, libloading,
      # the dlopen wrapper), and the gnu artifacts add `bpf`.
      #
      # `bpf` is not decoration here: it pulls in aya, aya-obj, object and
      # assert_matches, none of which appear under `full`. A `--features full`
      # SBOM would describe four fewer crates than the gnu binaries beside it
      # actually contain, while claiming to over-cover them. The feature set is
      # DERIVED rather than trusted by
      # `the_notices_and_sbom_cover_every_released_feature_set`, which runs the
      # feature-computing step above for every matrix entry and fails if this
      # flag stops covering the union.
      # ---------------------------------------------------------------------
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOMs
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # ONE invocation. cargo-cyclonedx has no -p/--package flag; it walks
          # the workspace and writes one SBOM per member into that member's
          # own directory, both under the --override-filename name. So the two
          # outputs collide by name and are separated on the way out.
          cargo cyclonedx --format json --features full,bpf --override-filename sbom

          mv sbom.json "artifacts/sipnab-${version}.cdx.json"
          mv crates/sipnab-audio/sbom.json "artifacts/sipnab-audio-${version}.cdx.json"

          # A CycloneDX document with no components is still valid JSON and
          # still uploads cleanly, so check the content rather than the exit
          # code. The plugin graph is small (21 on 0.5.54); the floors below
          # are set well under the real figures to catch collapse, not drift.
          for f in artifacts/sipnab-"${version}".cdx.json:100 \
                   artifacts/sipnab-audio-"${version}".cdx.json:10; do
            path="${f%:*}"; floor="${f##*:}"
            n=$(jq '.components | length' "$path")
            echo "$path: $n components (floor $floor)"
            if [ "$n" -lt "$floor" ]; then
              echo "::error::$path has $n components, expected at least $floor"
              exit 1
            fi
          done

      # After the SBOMs, so they are covered by the same checksum file.
      # Bare globs, not ./*: sha256sum echoes each operand verbatim into the
      # file, and packaging/homebrew/update-formula.sh parses those names.
      - name: Generate combined checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.deb *.rpm *.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Sigstore build provenance for every artifact: cryptographic proof it
      # was built by THIS workflow from THIS commit, so a rehosted or tampered
      # copy is detectable. Anyone can check a download with
      #   gh attestation verify <file> --repo NormB/sipnab
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.cdx.json
            artifacts/SHA256SUMS.txt

      # Run the exact command the docs tell downloaders to run.
      #
      # Attestation was "gated" only by a test asserting the string
      # `actions/attest-build-provenance@` appears in this file, which stays
      # true whether or not the attestation is usable -- the same shape as the
      # wiki gate that grepped its generator instead of running it. A subject
      # path that stops matching, a digest mismatch, or a permissions change
      # would all leave that grep passing and every download unverifiable.
      #
      # This verifies a real artifact against the real attestation before the
      # release is created, so a broken chain fails the release instead of
      # being discovered by a user.
      - name: Verify the attestation we just created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject=$(ls artifacts/*-x86_64-unknown-linux-musl.tar.gz | head -1)
          echo "verifying $subject"

          # `gh attestation verify` prints its human summary only on a TTY, so
          # on a runner a passing run left NO output at all -- the log showed
          # the command and then the next step. An exit code alone is the same
          # "trust the tick" evidence this workflow exists to stop accepting.
          #
          # The exit code IS the gate: verify fails if the artifact does not
          # match a signed attestation for this repo. Everything below only
          # renders what was checked into the log, and is deliberately unable
          # to fail the release -- a wrong jq path must not turn a good release
          # red, which would teach the next person to stop trusting this step.
          out=$(gh attestation verify "$subject" --repo "${{ github.repository }}" \
                  --format json 2>&1) || { echo "$out"; exit 1; }

          echo "--- what was verified ---"
          # Shape-agnostic: find whichever object carries the provenance fields
          # rather than assuming gh's nesting, which is not a stable contract.
          printf '%s' "$out" | jq -r '
            [.. | objects | select(has("sourceRepositoryURI") or has("issuer"))] as $c
            | if ($c | length) == 0 then "（no provenance fields found; raw output below）"
              else ($c[0] | "issuer: \(.issuer // "?")\nrepo:   \(.sourceRepositoryURI // "?")\nsha:    \(.sourceRepositoryDigest // "?")")
              end' 2>/dev/null \
            || printf '%s\n' "$out" | head -20
          echo "-------------------------"

      # The download table, derived from the artifacts that actually built. A
      # release page lists twenty-odd files whose Linux names carry
      # `unknown-linux-gnu` — the vendor field of the Rust target triple, not a
      # failed detection — and nothing on that page said which one to take. The
      # rows come from the directory rather than a hand-kept list, and an
      # unmapped target fails the step instead of quietly dropping a platform.
      - name: Render the platform table
        run: bash ops/release/platform-table.sh artifacts > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.cdx.json
            artifacts/SHA256SUMS.txt

  tap:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 16.7 min slowest (aarch64-apple-darwin build).
    timeout-minutes: 45
    name: Bump Homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      # Pull the SHA256SUMS.txt that the release job just attached to the GitHub
      # release; it is the single source of truth for every artifact checksum.
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS.txt --dir .

      - name: Render formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash packaging/homebrew/update-formula.sh "$version" SHA256SUMS.txt > sipnab.rb
          echo "----- generated Formula/sipnab.rb -----"
          cat sipnab.rb

      # Push the rendered formula to NormB/homebrew-tap so that
      # `brew reinstall normb/tap/sipnab` serves the just-released version.
      # Requires a HOMEBREW_TAP_TOKEN secret: a PAT (classic: `repo`, or
      # fine-grained: Contents read+write on NormB/homebrew-tap) — the default
      # GITHUB_TOKEN cannot push to a different repository. If the secret is
      # absent the release still succeeds; only the auto-bump is skipped.
      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning title=Homebrew tap not bumped::HOMEBREW_TAP_TOKEN secret is not set; skipping auto-bump. Set a PAT with contents:write on NormB/homebrew-tap to enable it."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/NormB/homebrew-tap.git" tap
          install -m 0644 sipnab.rb tap/Formula/sipnab.rb
          cd tap
          if git diff --quiet -- Formula/sipnab.rb; then
            echo "homebrew-tap already at ${version}; nothing to push."
            exit 0
          fi
          git config user.name  "sipnab-release"
          git config user.email "n.brandinger@gmail.com"
          git add Formula/sipnab.rb
          git commit -m "sipnab: bump to ${version}"
          git push origin HEAD:main
          echo "homebrew-tap bumped to ${version}."
