name: OpenSSF Scorecard

# Scorecard grades the repository's supply-chain posture against the OpenSSF
# checks (branch protection, pinned dependencies, token permissions, signed
# releases, dangerous workflow patterns, ...) and publishes the findings to the
# Security tab as code scanning alerts.
#
# Report-only, deliberately. Scorecard measures practices rather than the code,
# and several of its checks are opinions this project has already answered
# differently on purpose (see docs/internals/build-ci-release.md). Failing the
# build on a score would make a policy disagreement look like a broken commit.
# What it is here for is the opposite of a gate: a standing, external, second
# opinion that notices posture drift nobody in-repo thought to write a test for.
#
# The weekly schedule is not redundant with the push trigger. Several checks
# read state that lives outside the tree — branch protection rules, repository
# settings, whether the latest release is signed — and none of that changes the
# tree, so nothing would ever re-run these checks without a clock.

on:
  branch_protection_rule:
  schedule:
    # Mondays 07:20 UTC. Off the hour: GitHub drops scheduled runs during the
    # load spike at :00, and a skipped run here is silent.
    - cron: '20 7 * * 1'
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 0.7 min.
    timeout-minutes: 20
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Needed by the publish step below to mint an OIDC token.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to the public OpenSSF API, which is what backs
          # the score badge and lets downstream consumers check this project
          # without running Scorecard themselves. Requires a public repo and
          # the id-token permission above.
          publish_results: true

      # Kept for the 90-day window: SARIF uploaded to code scanning is subject
      # to alert retention, so the raw result is preserved independently of it.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90
          if-no-files-found: error

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: results.sarif
          category: scorecard
