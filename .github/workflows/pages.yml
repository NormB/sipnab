name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      # Build inputs that live outside website/. The filter decides whether the
      # site rebuilds, so anything this workflow READS belongs here or a change
      # to it never reaches the published site.
      #
      # Cargo.toml: the "Sync site version" step below rewrites
      # website/config.toml's `version` from the crate version, so a Cargo.toml
      # change alters the built site and has to trigger a build — the committed
      # website/config.toml is not the source, that step overwrites it.
      #
      # It does NOT derive the homepage badge or the download links. Those read
      # `published_version`, which moves in its own commit after a release
      # publishes. This comment claimed otherwise; see website/config.toml.
      - 'Cargo.toml'
      # ops/cloudflare/refresh_csp_hashes.py: the csp job runs it against the
      # deployed artifact, so a change to the checker must re-run the check.
      - 'ops/cloudflare/**'
      # src/ and Cargo.lock: this workflow now BUILDS the browser analyzer from
      # them. Without these the analysis code could change without the site
      # rebuilding — which is exactly what happened: the published WASM sat at
      # 0.5.80 for eleven releases while dialog_store.rs alone gained 918 lines.
      - 'src/**'
      - 'Cargo.lock'
      # scripts/check-wasm-exports.py: the analyzer build below runs it, so a
      # change to the check must re-run the check.
      - 'scripts/check-wasm-exports.py'
      # scripts/ci-cache-prune.sh: the analyzer build's cache save runs it.
      - 'scripts/ci-cache-prune.sh'
      # yang/: the YANG module is copied into the site below, so a new
      # revision has to reach sipnab.com/yang/ when it lands.
      - 'yang/**'
      # tests/ and the two scripts: the homepage's automated-test count is
      # derived at deploy time (see the steps before "Build site"), and adding
      # a test changes it. Without tests/ here, a pull request that only adds
      # tests would leave the published count behind until something else
      # rebuilt the site.
      - 'tests/**'
      - 'scripts/published-test-count.py'
      - 'scripts/github-stars.py'
      # scripts/doc-history.py: writes the "Last changed" line under every docs
      # page (see the step before "Build site").
      - 'scripts/doc-history.py'
      - 'scripts/fetch-ci-suite-output.py'
      # The "Advertise the newest complete release" step runs these, and
      # build-site-pages.py regenerates the mirrors after the markers move.
      - 'scripts/advertise-release.py'
      - 'scripts/download-markers.txt'
      - 'docs/install.md'
      - 'CHANGELOG.md'
      - 'scripts/build-site-pages.py'
      # The `live` job's check, and the stamp the build writes for it.
      - 'scripts/pages-live.py'
      - 'scripts/verify-site-advertises.sh'
  # release.yml's `advertise` job dispatches this on main once a release's
  # assets are published, with `expect` set to that release, and waits for
  # the run (RELEASE-FAST C: no phase-two pull request).
  workflow_dispatch:
    inputs:
      expect:
        description: 'The release this deploy must advertise (x.y.z); empty resolves the newest complete one'
        required: false
        default: ''
        type: string

# Read-only for every job. The write scopes live on the one job that deploys
# (OpenSSF Baseline AC-04.02), and actions:read on the csp job that downloads
# the deployed pages artifact.
permissions:
  contents: read

# One concurrent deploy; let an in-progress run finish to avoid half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 0.2 min, but it holds the non-superseding `pages` group.
    # Raised 20 -> 30: this job now compiles the crate for wasm32 on a cold
    # cache. A warm cache is ~1 minute; the ceiling is for the cold case.
    # Raised 30 -> 90: the job now waits for CI's run of the same commit to
    # upload its suite output (fetch-ci-suite-output.py gives up at 60
    # minutes; CI's test jobs are bounded at 45 and test-results at 15, and
    # the run can queue first).
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    # A job-level block replaces the workflow-level one, so contents:read is
    # restated. actions:read lets the job list CI's run for this commit and
    # download its suite-output artifact.
    permissions:
      contents: read
      actions: read
    env:
      ZOLA_VERSION: '0.19.2'
      # Pinned like ZOLA_VERSION. Installed with `cargo install --locked`, so
      # the version plus Cargo.lock fixes what gets built.
      WASM_PACK_VERSION: '0.15.0'
      # A version tag names a release; it does not fix the bytes behind it, and a
      # release asset can be replaced after publication. Every action in this repo
      # is pinned by commit SHA for that reason, so the two binaries fetched by
      # hand are pinned by content hash for the same one. Zola publishes no
      # checksum manifest, so this hash is recorded from the artifact served at
      # v0.19.2 -- it detects a later swap, it does not attest the first download.
      ZOLA_SHA256: '0798e69b86c628ddcb264ebd86c8cc8dce7670b9049060bf94faa73f6857cd9c'
      # Pagefind builds the documentation search index from the rendered
      # site. Pinned by version AND by content hash for the same reason as
      # Zola directly above: a tag names a release, it does not fix the bytes
      # behind it, and a release asset can be replaced after publication.
      # Recorded from the artifact served at v1.5.2.
      PAGEFIND_VERSION: '1.5.2'
      PAGEFIND_SHA256: 'afb824a9e7f64905a934900481cea5be679c03975e527329e0e5e6cc70f5feda'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The full history and every tag: scripts/doc-history.py reads the
          # last commit to each docs page's source and the release tags that
          # contain it. A shallow clone holds one commit and no tags.
          fetch-depth: 0
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      # From the actions cache, keyed on ZOLA_VERSION and ZOLA_SHA256, and from
      # GitHub releases only on a miss, with the sha256 checked either way and
      # an outage retried for up to five minutes: .github/actions/pinned-download
      # (CI-TOOL-DOWNLOAD-RESILIENCE). On 2026-11-08 this step failed on a run
      # of HTTP 504s from github.com, one live download with 25 s of retries.
      - name: Fetch Zola (pinned, cached)
        id: zola
        uses: ./.github/actions/pinned-download
        with:
          name: zola
          version: ${{ env.ZOLA_VERSION }}
          sha256: ${{ env.ZOLA_SHA256 }}
          url: https://github.com/getzola/zola/releases/download/v${{ env.ZOLA_VERSION }}/zola-v${{ env.ZOLA_VERSION }}-x86_64-unknown-linux-gnu.tar.gz
          file: zola.tar.gz
      - name: Install Zola
        env:
          ZOLA_TARBALL: ${{ steps.zola.outputs.path }}
        run: |
          set -euo pipefail
          tar xzf "$ZOLA_TARBALL" zola
          sudo install -m 0755 zola /usr/local/bin/zola
          rm -f zola
          zola --version

      # Single source of truth: derive the site version (homepage badge +
      # download links) from the crate version in Cargo.toml so the published
      # site always matches the released binary, with no second value to bump.
      - name: Sync site version from Cargo.toml
        run: |
          V=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          sed -i -E "s/^version = \".*\"/version = \"$V\"/" website/config.toml
          echo "Site version set to $V"
          grep -E '^version = ' website/config.toml

      # The site advertises the newest COMPLETE GitHub release, whatever the
      # committed `published_version` says: scripts/advertise-release.py
      # (the rule is in its docstring) moves published_version, release_date
      # and the download markers of docs/install.md in this checkout, then
      # regenerates the site mirrors. Before RELEASE-FAST C a pull request
      # ("phase two") did that after every release, and on 0.5.238 it cost
      # about 70 minutes. The committed tree catches up in the next release
      # pull request's advertisement commit, made by the same writer.
      #
      # Every deploy runs it, so a push to main after a release cannot put the
      # site back on the previous one. With `expect` (release.yml's dispatch)
      # the resolved release must be that one, or the deploy fails. A failed
      # read of GitHub's releases fails the deploy: guessing would mean
      # advertising either a release nobody can download or a stale one.
      - name: Advertise the newest complete release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set -euo pipefail
          if [ -n "${EXPECT:-}" ]; then
            python3 scripts/advertise-release.py site --repo "$GITHUB_REPOSITORY" --expect "$EXPECT"
          else
            python3 scripts/advertise-release.py site --repo "$GITHUB_REPOSITORY"
          fi
          grep -E '^(published_version|release_date) = ' website/config.toml

      # THE COMMITTED BUNDLE IS NO LONGER WHAT SHIPS.
      #
      # `zola build` copies static/ verbatim, so before this step the published
      # analyzer was whatever binary happened to be committed. It was last
      # rebuilt for 0.5.80 and served eleven releases of stale analysis while
      # the page badge — synced from Cargo.toml two steps above — read current.
      #
      # The two pre-commit guards could not catch it. One refuses a commit that
      # stages src/wasm.rs without a rebuilt bundle; the other checks the JS
      # exports. Both stayed green because src/wasm.rs had no commits and the
      # export list never changed: the interface held still while the
      # implementation behind it moved. Building here removes the class of bug
      # rather than the instance — a build product that is generated cannot go
      # stale.
      - id: toolchain
        uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      # Restored on every run and saved, at the end of this job, from main
      # only: tests/ci_cache_policy_test.rs says why.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            target
          key: cargo-pages-wasm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-pages-wasm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: Install wasm-pack
        run: |
          set -euo pipefail
          # Pinned and installed from source rather than curl|sh: the version
          # is reproducible and there is no unpinned script to trust.
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack ${WASM_PACK_VERSION}" ]; then
            cargo install wasm-pack --locked --version "${WASM_PACK_VERSION}"
          fi
          wasm-pack --version
      - name: Build the browser analyzer
        run: |
          set -euo pipefail
          wasm-pack build --target web --out-dir website/static/wasm \
            --no-typescript -- --no-default-features --features wasm
          # The exports the site calls must still exist; the same check the
          # pre-commit hook runs, applied to the artifact actually deployed.
          python3 scripts/check-wasm-exports.py
          ls -l website/static/wasm/sipnab_bg.wasm

      # The YANG module the RFC 7951 export validates against, served at
      # https://sipnab.com/yang/<module>@<revision>.yang. Copied here rather
      # than committed a second time under website/static/: yang/ holds the one
      # copy, generated from the analysis's tables and held to them by the YANG
      # module test. A second committed copy would be a second thing to keep
      # equal, and the analyzer bundle above is the record of what a committed
      # build product does over time.
      - name: Publish the YANG module
        run: |
          set -euo pipefail
          mkdir -p website/static/yang
          cp yang/*.yang website/static/yang/
          ls -l website/static/yang

      # The homepage's automated-test count, generated rather than committed.
      # It used to be a number in website/templates/index.html that every
      # pull request adding a test had to edit, so any two such pull requests
      # conflicted on it. Now ci.yml runs the suite on Linux (the `test`
      # job's shards, merged by `test-results`), derives the count with
      # scripts/published-test-count.py (failing CI if it cannot) and uploads
      # the run's output as `suite-output`. This step
      # waits for that artifact from CI's run of the commit being deployed;
      # the next applies the same script to it and writes the data file the
      # template reads. Both run before `zola build`, which reads the file
      # once. tests/site_journey_test.rs holds the order.
      - name: Fetch the suite output of CI's run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! python3 scripts/fetch-ci-suite-output.py \
              --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --dest suite-output; then
            echo "::error::no suite output from CI's run of $GITHUB_SHA, so no test count to publish"
            exit 1
          fi

      - name: Derive the homepage test count
        run: |
          set -euo pipefail
          if ! python3 scripts/published-test-count.py suite-output/test-output.txt --write website/data/test-count.toml; then
            echo "::error::CI's suite output cannot be counted"
            exit 1
          fi
          cat website/data/test-count.toml

      # The homepage's GitHub star count, fetched at deploy time and never
      # committed. A failed fetch publishes the homepage without a count, which
      # the template renders as the plain "View on GitHub" button, rather than
      # blocking the deploy over that figure; the step says so as a warning.
      # Before `zola build`, which reads the file once.
      - name: Fetch the GitHub star count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh api "repos/$GITHUB_REPOSITORY" > github-repo.json \
            && python3 scripts/github-stars.py github-repo.json --repo "$GITHUB_REPOSITORY" --write website/data/github.toml; then
            cat website/data/github.toml
          else
            echo "::warning::no GitHub star count; the homepage is published without one"
            rm -f website/data/github.toml
          fi

      # The "Last changed" line under every docs page, derived from git at
      # deploy time and never committed. It names the earliest release tag
      # that holds the last change to the page's source file, or says the
      # change is in no release yet. Before `zola build`, which reads the file
      # once. A failure stops the deploy: a page footer that cannot be derived
      # means the checkout lacks the history or a source path is wrong.
      - name: Write the docs pages' change history
        run: |
          set -euo pipefail
          python3 scripts/doc-history.py --write website/data/doc-history.toml > /dev/null
          grep -c '^\[pages\.' website/data/doc-history.toml

      # What the `live` job reads back from the published site: this commit,
      # this run and this attempt. A deploy that reports success and leaves
      # the previous artifact in place serves the previous stamp
      # (PAGES-SAME-SHA-REDEPLOY-NOT-LIVE).
      - name: Write the deploy stamp
        run: python3 scripts/pages-live.py stamp --write website/static/deploy-stamp.txt

      - name: Build site
        working-directory: website
        run: zola build

      # Without the data file the template renders a sentence with no number,
      # which is right for a local build and wrong for the published site.
      # Fail here rather than publish it.
      - name: Check the built homepage states the test count
        run: |
          set -euo pipefail
          n=$(sed -n 's/^automated_tests = \([0-9][0-9]*\)$/\1/p' website/data/test-count.toml)
          if [ -z "$n" ] \
            || ! grep -qF "data-count=\"$n\"" website/public/index.html \
            || ! grep -qF "$n automated tests" website/public/index.html; then
            echo "::error::the built homepage does not state the generated test count '${n:-<none>}'"
            exit 1
          fi
          echo "The built homepage states $n automated tests"

      - name: Check the built homepage states the star count it was given
        run: |
          set -euo pipefail
          if [ -f website/data/github.toml ]; then
            n=$(sed -n 's/^stars = \([0-9][0-9]*\)$/\1/p' website/data/github.toml)
            if [ -z "$n" ] || ! grep -qF "data-stars=\"$n\"" website/public/index.html; then
              echo "::error::the built homepage does not state the generated star count '${n:-<none>}'"
              exit 1
            fi
            echo "The built homepage states $n stars"
          else
            echo "No star count was fetched; the homepage states none"
          fi

      # AFTER the Zola build, and that ordering is a constraint rather than a
      # style choice: `zola build` recreates its output directory from
      # scratch, so an index written before it is deleted by it. It runs
      # BEFORE the artifact upload below for the matching reason -- the
      # index has to be inside the tree that gets published, not beside it.
      #
      # The index is generated here rather than committed, on the same
      # argument the analyzer build above makes: an index OF a site is a
      # build product, and a committed one goes stale silently while the
      # pages it claims to describe move underneath it. That is precisely how
      # the WASM bundle served eleven releases of stale analysis.
      #
      # No CDN is involved and none may be: the site's Content-Security-Policy
      # is `script-src 'self'` with no 'unsafe-inline', so the search runtime,
      # its wasm and its index chunks have to be same-origin. This step is what
      # makes them so -- it writes them into the deployed tree.
      #
      # The binary comes from the actions cache, keyed on PAGEFIND_VERSION and
      # PAGEFIND_SHA256, and from GitHub releases only on a miss; the sha256 is
      # checked either way. quality.yml installs it through the same action.
      - name: Install Pagefind (pinned, cached)
        uses: ./.github/actions/pagefind
        with:
          version: ${{ env.PAGEFIND_VERSION }}
          sha256: ${{ env.PAGEFIND_SHA256 }}

      - name: Index the site for search (Pagefind)
        run: |
          set -euo pipefail
          pagefind --site website/public
          # A missing index is invisible from the outside: the page still
          # returns 200, the search box simply never appears. Fail the build
          # here instead of shipping a site whose search is silently absent.
          test -s website/public/pagefind/pagefind.js
          test -s website/public/pagefind/pagefind-entry.json

      # What the built download page advertises, as a static file beside the
      # stamp: the stamp, the release and the page's sha256
      # (CDN-REFUSED-RELEASE-CHECK-FROM-RUNNER). The CDN answers a hosted
      # runner's read of an HTML page with a browser challenge and its read
      # of a .txt file with the file, so the `live` job and the daily check
      # (cert-expiry.yml) judge the release from this file and the stamp.
      # The page is judged by the rule the live page is judged by
      # (scripts/verify-site-advertises.sh --classify), for the
      # published_version the step above wrote; a built page that does not
      # name it fails the build here. The last step before the upload:
      # `zola build` recreates the tree, and the sha256 is of the page as it
      # is uploaded.
      - name: Record what the built download page advertises
        run: python3 scripts/pages-live.py advertised --site website/public --config website/config.toml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/public

      # The workspace's own executables are rebuilt by any change to the
      # sources, so they are removed before the save; see the script.
      - name: Prune the cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-cache-prune.sh "$GITHUB_WORKSPACE/target"
      - name: Save the cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  deploy:
    # Bounds a wedged job: an unbounded one holds its concurrency group
    # indefinitely. Two 10-minute attempts plus overhead fit inside 25.
    timeout-minutes: 25
    needs: build
    runs-on: ubuntu-24.04
    # Deploy to Pages and prove the deployment origin with an OIDC token.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      # Whichever attempt promoted carries the URL; the first is empty when it
      # timed out and the retry is what succeeded.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # GitHub Pages promotion stalls in `deployment_queued` and times out a
      # healthy build: four consecutive deploys failed that way on 2026-08-06,
      # each at exactly 10 minutes, with Pages reporting "operational", no
      # protection rule on the environment, and the build job green every time.
      # The site sat on the previous commit until a deploy was re-run by hand.
      #
      # A longer timeout cannot fix it: `actions/deploy-pages` caps the input at
      # 600000 ms and clamps anything larger back to 10 minutes, warning as it
      # does so ("timeout value is greater than the allowed maximum"). A first
      # attempt at 1800000 was therefore inert. Retrying is the only lever the
      # action leaves, and the stall clears on a later attempt.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Deploy to GitHub Pages (retry after a stalled promotion)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  # PAGES-SAME-SHA-REDEPLOY-NOT-LIVE. On 0.5.242 two workflow_dispatch runs
  # of this workflow on main commit 1ef3e74a0 (42714372409 and 42717859462)
  # built artifacts naming 0.5.242, the deploy job reported success for both,
  # and the site kept serving the push deploy of the same commit.
  # actions/deploy-pages sends `pages_build_version = GITHUB_SHA`, and GitHub
  # names the Pages deployment by that string, so a second deploy of one
  # commit reads the status of a deployment that already says `succeed`. Its
  # success says nothing about the new artifact.
  #
  # So this job judges the deploy by the live site. scripts/pages-live.py
  # reads the stamp the build wrote. When the live stamp is not this run's
  # within 5 minutes, it deploys the same artifact again under a build
  # version GitHub has not seen, prints a warning that says so, and reads the
  # stamp again.
  #
  # The release is then judged from this run's own artifact
  # (CDN-REFUSED-RELEASE-CHECK-FROM-RUNNER): on 2026-11-14 the 0.5.254
  # release run ended red twice because the CDN answered this job's read of
  # the download page with a browser challenge while the site was right. The
  # job downloads the `github-pages` artifact, as the csp job below does in
  # every run with the same action and `actions: read`. The script requires
  # the artifact's stamp and its advertised-release.txt to be this run's,
  # judges the artifact's download page by the rule a live page is judged by
  # (scripts/verify-site-advertises.sh --classify), and requires the live
  # advertised-release.txt to be the artifact's. The live read of the
  # download page stays as evidence: a page that answers and does not name
  # the release fails the run; a read the edge refused is a warning with the
  # edge's answer. An artifact that cannot be read is exit 4, never a pass.
  #
  # A workflow_dispatch run enforces the verdict: a release advertises itself
  # through one, and a withdrawal redeploys through one. A push run prints
  # the same annotations and passes, because the pre-push tag gate refuses a
  # release tag while a run on its merge commit is red.
  #
  # The job is inside the `pages` concurrency group with the rest of the run,
  # so no later deploy can replace the site while it reads.
  live:
    # 300 s for the stamp, 600 s for a second deploy's status, 300 s for the
    # stamp again, 300 s for the live advertised-release.txt and 300 s for
    # the release: 30 minutes at the worst.
    timeout-minutes: 35
    name: The live site is this deploy
    needs: deploy
    runs-on: ubuntu-24.04
    # What a second deploy needs, as the deploy job has it: the Pages API
    # takes an OIDC token from a job in the github-pages environment.
    # actions:read lists this run's artifact.
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      # A failed download does not end the job: the script below ends 4 on
      # an artifact it cannot read, which a dispatch enforces and a push
      # prints as an error annotation.
      - name: Download this run's site artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages
          path: site-artifact

      - name: Read the stamp back from the live site
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: ${{ inputs.expect }}
          ENFORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$ENFORCE" = true ]; then
            python3 scripts/pages-live.py verify --expect "$EXPECT" --enforce --artifact site-artifact/artifact.tar
          else
            python3 scripts/pages-live.py verify --expect "${EXPECT:-}" --artifact site-artifact/artifact.tar
          fi

  # The production CSP is a Cloudflare transform rule pinning inline-script
  # hashes (GitHub Pages cannot set response headers). A deploy that changes
  # an inline <script> without refreshing the rule ships pages whose scripts
  # browsers silently block — the homepage demos and feature tabs died this
  # way on 2026-07-22. Hash the exact artifact that was deployed, not the
  # live CDN, which can serve stale (even version-mixed) pages for ~10
  # minutes after a deploy.
  csp:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 0.2 min, but it holds the non-superseding `pages` group.
    timeout-minutes: 20
    needs: deploy
    runs-on: ubuntu-24.04
    # Downloads the deployed pages artifact.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
          sparse-checkout: ops/cloudflare

      - name: Download deployed site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages

      - name: Refresh Cloudflare CSP hashes from the deployed HTML
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir site && tar -xf artifact.tar -C site
          python3 ops/cloudflare/refresh_csp_hashes.py --site-dir site
