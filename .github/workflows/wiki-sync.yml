name: Sync docs to Wiki

# `docs/` is the single source of truth. On every change to it, regenerate the
# wiki tree (scripts/build-wiki.py) and force-push it to the wiki repo, so the
# GitHub Wiki never drifts from the in-repo docs.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-wiki.py'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

# Read by default; only the job that pushes gets write. A workflow-level
# `contents: write` hands every job — including any added later — a token that
# can rewrite the repository, when exactly one step needs it.
permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 0.1 min.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The wiki lives at <repo>.wiki.git and is pushed with GITHUB_TOKEN, so
    # this job genuinely needs write. It is the only one that does.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build wiki tree from docs/
        run: python3 scripts/build-wiki.py build/wiki

      - name: Push to wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/wiki
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "docs: sync wiki from docs/ @ ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            HEAD:master
