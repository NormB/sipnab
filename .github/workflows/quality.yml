name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. All three jobs below declare their own
# `permissions:` block, which REPLACES this one rather than adding to it — so
# this grants the floor for any job added later that forgets to, instead of
# handing it the repository default.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Benchmarks: four criterion suites live in benches/ (parser, store, pipeline,
  # tui_derived) and until now NOTHING ran them. The only reference to them in
  # any workflow was clippy's --all-targets lint pass, so a benchmark that
  # panicked, or stopped compiling against a changed API, would sit broken
  # indefinitely — and the project would have no way to notice a performance
  # change at all.
  #
  # This runs each benchmark once in criterion's --test mode: no timing, no
  # statistics, just execution. It is deliberately the weaker of the two things
  # worth having, because it is the one that works without persisted state.
  # Detecting an actual regression needs baselines carried between runs, which
  # criterion keeps in target/criterion and does not survive a cache miss; the
  # durable record is benches/BASELINES.md and it is hand-maintained. Treat this
  # as "the benchmarks still run", not "performance has not regressed".
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmarks (execute)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install system deps
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-
            ${{ runner.os }}-cargo-

      # --profile profiling is what CONTRIBUTING mandates for benchmarks:
      # release codegen with full symbols and no stripping.
      - name: Run every benchmark once
        run: cargo bench --profile profiling --all-features -- --test

  # ---------------------------------------------------------------------------
  # Test coverage via cargo-llvm-cov.
  # Self-contained: prints a summary to the job summary and uploads an HTML
  # report artifact (no account needed). Also uploads to Codecov *if* a
  # CODECOV_TOKEN secret is configured (free for public/OSS repos) — the step
  # is skipped cleanly when the secret is absent, so the job stays green.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The suite includes site_advertises_only_a_released_version, which
          # asks git whether published_version has a matching tag. actions/
          # checkout fetches NO tags by default, so that gate saw zero and
          # refused to answer -- correctly, but it turned CI red on a release
          # commit. Fetch them so the gate is real here rather than skipped
          # where it matters most. depth 0 rather than fetch-tags alone: a full
          # history unambiguously includes every tag, and after shipping a gate
          # whose own message predicted this failure and still hit it, the few
          # seconds of clone are worth not guessing at checkout semantics.
          fetch-tags: true
          fetch-depth: 0
      # ubuntu-latest ships ~25-30 GB of preinstalled SDKs (dotnet, Android,
      # GHC, Swift, CodeQL bundle) we never use. A full --all-features
      # --all-targets build plus the cargo cache and llvm-cov instrumentation
      # can exhaust the runner disk ("No space left on device"); reclaim it up
      # front so the build has headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install system deps
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: llvm-tools-preview

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage
        # Skip the trycmd CLI-golden test under coverage: it spawns the
        # instrumented binary as 13 parallel subprocesses, which collide on the
        # llvm-cov merge-pool .profraw file ("LLVM Profile Error: ... File
        # exists") and fail the run. The goldens are still validated by the CI
        # workflow's plain `cargo test`; only their coverage contribution is
        # dropped here.
        run: cargo llvm-cov --all-features --workspace --no-report -- --skip cli_goldens

      - name: Coverage summary
        # Exclude the dev-only src/bin/gen_fixture.rs [[bin]] from every report
        # (mirrors codecov.yml `ignore:`); it is not shipped product code.
        run: |
          {
            echo '### Test coverage'
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex 'gen_fixture\.rs'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Coverage was measured, summarised, uploaded to Codecov with
      # fail_ci_if_error: false — and gated by nothing. It could decline release
      # after release with every run staying green: measured, reported,
      # unenforced, the same shape as the glibc floor and the binary-size claim.
      #
      # 92 is not a round number picked for comfort: line coverage measured
      # 92.85% (53407/57518) on the aaeb06e report, with functions at 94.29% and
      # regions at 93.15%. The floor sits just under the real figure so it
      # ratchets against decline without failing on ordinary noise. Raise it
      # when the real number rises; never lower it to make a build pass.
      - name: Enforce coverage floor
        run: |
          cargo llvm-cov report --fail-under-lines 92 \
            --ignore-filename-regex 'gen_fixture\.rs'

      - name: Generate lcov + HTML report
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'gen_fixture\.rs'
          cargo llvm-cov report --html --ignore-filename-regex 'gen_fixture\.rs'

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: error

      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Surface Clippy lints as GitHub Code Scanning alerts (SARIF).
  # CI already gates on `clippy -Dwarnings`; this makes the findings visible
  # inline on PRs and in the Security tab. Lints here are reported, not gated,
  # so this job does not fail the build.
  # ---------------------------------------------------------------------------
  clippy-sarif:
    name: Clippy → Code Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ubuntu-latest ships ~25-30 GB of preinstalled SDKs (dotnet, Android,
      # GHC, Swift, CodeQL bundle) we never use. A full --all-features
      # --all-targets build plus the cargo cache and llvm-cov instrumentation
      # can exhaust the runner disk ("No space left on device"); reclaim it up
      # front so the build has headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install system deps
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-sarif-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-sarif-
            ${{ runner.os }}-cargo-

      - name: Install clippy-sarif tooling
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Run Clippy (SARIF)
        # Report-only: collect lints as JSON->SARIF without -Dwarnings so a lint
        # does not fail this job (CI's `check` job already enforces the gate).
        run: |
          cargo clippy --all-features --all-targets --message-format=json \
            | clippy-sarif | tee clippy.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: clippy.sarif
          category: clippy
