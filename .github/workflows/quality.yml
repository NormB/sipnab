name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. All three jobs below declare their own
# `permissions:` block, which REPLACES this one rather than adding to it — so
# this grants the floor for any job added later that forgets to, instead of
# handing it the repository default.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Benchmarks: four criterion suites live in benches/ (parser, store, pipeline,
  # tui_derived) and until now NOTHING ran them. The only reference to them in
  # any workflow was clippy's --all-targets lint pass, so a benchmark that
  # panicked, or stopped compiling against a changed API, would sit broken
  # indefinitely — and the project would have no way to notice a performance
  # change at all.
  #
  # This runs each benchmark once in criterion's --test mode: no timing, no
  # statistics, just execution. It is deliberately the weaker of the two things
  # worth having, because it is the one that works without persisted state.
  # Detecting an actual regression needs baselines carried between runs, which
  # criterion keeps in target/criterion and does not survive a cache miss; the
  # durable record is benches/BASELINES.md and it is hand-maintained. Treat this
  # as "the benchmarks still run", not "performance has not regressed".
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmarks (execute)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install system deps
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-
            ${{ runner.os }}-cargo-

      # --profile profiling is what CONTRIBUTING mandates for benchmarks:
      # release codegen with full symbols and no stripping.
      - name: Run every benchmark once
        run: cargo bench --profile profiling --all-features -- --test

  # ---------------------------------------------------------------------------
  # Test coverage via cargo-llvm-cov.
  # Self-contained: prints a summary to the job summary and uploads an HTML
  # report artifact (no account needed). Also uploads to Codecov *if* a
  # CODECOV_TOKEN secret is configured (free for public/OSS repos) — the step
  # is skipped cleanly when the secret is absent, so the job stays green.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The suite includes site_advertises_only_a_released_version, which
          # asks git whether published_version has a matching tag. actions/
          # checkout fetches NO tags by default, so that gate saw zero and
          # refused to answer -- correctly, but it turned CI red on a release
          # commit. Fetch them so the gate is real here rather than skipped
          # where it matters most. depth 0 rather than fetch-tags alone: a full
          # history unambiguously includes every tag, and after shipping a gate
          # whose own message predicted this failure and still hit it, the few
          # seconds of clone are worth not guessing at checkout semantics.
          fetch-tags: true
          fetch-depth: 0
      # ubuntu-latest ships ~25-30 GB of preinstalled SDKs (dotnet, Android,
      # GHC, Swift, CodeQL bundle) we never use. A full --all-features
      # --all-targets build plus the cargo cache and llvm-cov instrumentation
      # can exhaust the runner disk ("No space left on device"); reclaim it up
      # front so the build has headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install system deps
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: llvm-tools-preview
          # Coverage runs the full suite, which includes plugin_example_test —
          # it builds crates/sipnab-plugin-example for wasm32 exactly as the
          # docs instruct. Without the target it fails with "can't find crate
          # for `std`".
          targets: wasm32-unknown-unknown

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage
        # Skip the trycmd CLI-golden test under coverage: it spawns the
        # instrumented binary as 13 parallel subprocesses, which collide on the
        # llvm-cov merge-pool .profraw file ("LLVM Profile Error: ... File
        # exists") and fail the run. The goldens are still validated by the CI
        # workflow's plain `cargo test`; only their coverage contribution is
        # dropped here.
        #
        # Skip the wasm_plugin_* tests for a related reason: they shell out to
        # `cargo build --target wasm32-unknown-unknown`, and that nested build
        # cannot carry this harness's instrumentation — wasm32 ships no
        # `profiler_builtins`, so it fails with E0463. Scrubbing the coverage
        # variables from the child environment was not enough, which is why
        # this is a skip rather than more env plumbing. They run in full in the
        # CI workflow's plain `cargo test`; only their coverage contribution is
        # dropped, and the wasm artifact was never instrumented anyway.
        run: cargo llvm-cov --all-features --workspace --no-report -- --skip cli_goldens --skip wasm_plugin_

      - name: Coverage summary
        # Exclude the dev-only src/bin/gen_fixture.rs [[bin]] from every report
        # (mirrors codecov.yml `ignore:`); it is not shipped product code.
        run: |
          {
            echo '### Test coverage'
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex 'gen_fixture\.rs'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Coverage was measured, summarised, uploaded to Codecov with
      # fail_ci_if_error: false — and gated by nothing. It could decline release
      # after release with every run staying green: measured, reported,
      # unenforced, the same shape as the glibc floor and the binary-size claim.
      #
      # 92 is not a round number picked for comfort: line coverage measured
      # 92.85% (53407/57518) on the aaeb06e report, with functions at 94.29% and
      # regions at 93.15%. The floor sits just under the real figure so it
      # ratchets against decline without failing on ordinary noise. Raise it
      # when the real number rises; never lower it to make a build pass.
      - name: Enforce coverage floor
        run: |
          cargo llvm-cov report --fail-under-lines 92 \
            --ignore-filename-regex 'gen_fixture\.rs'

      - name: Generate lcov + HTML report
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'gen_fixture\.rs'
          cargo llvm-cov report --html --ignore-filename-regex 'gen_fixture\.rs'

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: error

      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Surface Clippy lints as GitHub Code Scanning alerts (SARIF).
  # CI already gates on `clippy -Dwarnings`; this makes the findings visible
  # inline on PRs and in the Security tab. Lints here are reported, not gated,
  # so this job does not fail the build.
  # ---------------------------------------------------------------------------
  clippy-sarif:
    name: Clippy → Code Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ubuntu-latest ships ~25-30 GB of preinstalled SDKs (dotnet, Android,
      # GHC, Swift, CodeQL bundle) we never use. A full --all-features
      # --all-targets build plus the cargo cache and llvm-cov instrumentation
      # can exhaust the runner disk ("No space left on device"); reclaim it up
      # front so the build has headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install system deps
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-sarif-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-sarif-
            ${{ runner.os }}-cargo-

      - name: Install clippy-sarif tooling
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Run Clippy (SARIF)
        # Report-only: collect lints as JSON->SARIF without -Dwarnings so a lint
        # does not fail this job (CI's `check` job already enforces the gate).
        run: |
          cargo clippy --all-features --all-targets --message-format=json \
            | clippy-sarif | tee clippy.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: clippy.sarif
          category: clippy

  # ---------------------------------------------------------------------------
  # Documentation gates: prose style, spelling, and dead links.
  #
  # These check the things the Rust suite structurally cannot. tests/ compares
  # documented values against the code that produces them -- versions, floors,
  # flag names -- and it is thorough at that. It says nothing about whether a
  # sentence is readable, whether a word is misspelled, or whether a URL still
  # resolves, and a download page full of correct-but-dead links fails a reader
  # exactly as hard as a wrong version number.
  #
  # Pinned by digest like every other action here. Each tool's configuration
  # lives at the repo root (.vale.ini, lychee.toml, .codespellrc) with the
  # reasoning for every exclusion recorded next to it, including the alert count
  # it produced on first run.
  # ---------------------------------------------------------------------------
  docs:
    name: Docs (prose, spelling, links)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Vale's Google package is not vendored here; it is fetched below. The
      # project's own rules and vocabulary ARE committed, under
      # .vale/styles/sipnab and .vale/styles/config.
      - name: Install Vale
        env:
          VALE_VERSION: '3.16.0'
          # Pinned by content, not just by tag: a release asset can be replaced
          # after publication. This hash is the one in Vale's own published
          # manifest (vale_3.16.0_checksums.txt), so it is upstream's record of
          # what it shipped rather than a note of whatever we happened to fetch.
          VALE_SHA256: '1049f4a585ccd1af96dcf4bdc16800cb3ce426b432da2b27893def42dcfe0ccb'
        run: |
          set -euo pipefail
          curl -fsSL -o vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          tar xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale
          vale --version

      # `vale sync` reads the `Packages =` URL from .vale.ini and unpacks whatever
      # it gets, with no integrity check available anywhere in that path. Doing the
      # fetch here instead buys the checksum. The stakes are lower than for the
      # binaries above -- the package is 36 YAML rule files, so a substitution
      # changes which prose passes lint rather than executing anything -- but it is
      # the same unpinned-fetch shape, and it is the last one in CI.
      #
      # Keep VALE_GOOGLE_URL identical to `Packages =` in .vale.ini. A test holds
      # the two together, because a drifting pair would lint against one package
      # locally and a different one here.
      - name: Install Vale styles
        env:
          VALE_GOOGLE_URL: 'https://github.com/errata-ai/Google/releases/download/v0.7.0/Google.zip'
          VALE_GOOGLE_SHA256: 'dddb3dca035a067fe9ab13a1d8d8f89cb63e8b83ab4cf1934a935d60cd91d697'
        run: |
          set -euo pipefail
          curl -fsSL -o Google.zip "${VALE_GOOGLE_URL}"
          echo "${VALE_GOOGLE_SHA256}  Google.zip" | sha256sum -c -
          # No post-condition check on the extracted directory, deliberately. The
          # checksum already fixes the archive, so its layout is not in question,
          # and the next step cannot pass without the styles present. Naming the
          # extracted path here would also assert a gitignored directory exists,
          # which is true on a machine that has synced and false in a fresh
          # checkout -- a test that passes locally and fails in CI.
          unzip -q -o Google.zip -d .vale/styles/

      # Published docs only; docs/design, docs/research and docs/superpowers are
      # exempted by glob sections in .vale.ini because they are working
      # documents. Curation brought this from 13,892 alerts to zero.
      - name: Prose style (Vale + Google)
        run: vale docs/ website/content/ README.md SUPPORT.md MAINTAINERS.md

      - name: Spelling (codespell)
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          # Reads .codespellrc for skips and the ignore list. The action needs
          # the paths passed explicitly rather than inheriting them from config.
          path: src tests docs website benches harness scripts README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md SUPPORT.md MAINTAINERS.md

      # Pass one: Markdown that resolves on the filesystem. 257 unique links.
      #
      # Deliberately WITHOUT --include-fragments. Anchors are already gated, and
      # better: link_integrity_test carries generated_site_anchors_resolve_under_zola,
      # website_intra_docs_links_resolve and wiki_intra_docs_links_resolve, which
      # slugify headings the way Zola and the GitHub wiki actually do.
      #
      # lychee's slugger disagrees with Zola's on headings containing a slash --
      # for `### GET /v1/dialogs` it wants `get-v1dialogs` where Zola resolves
      # `get-v1-dialogs`. Turning fragments on here reported the repo's correct,
      # Zola-shaped anchor as dead; "fixing" it to satisfy lychee broke all three
      # of the gates above, which are the ones describing where these documents
      # are actually published.
      - name: Dead links (docs Markdown)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --config lychee.toml
            'docs/**/*.md' 'README.md' 'CONTRIBUTING.md' 'SECURITY.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pass two: the built site, where site-absolute links like /docs/install/
      # can actually be resolved. lychee reports those as unresolvable during
      # link resolution rather than as a URI, so no exclude pattern can silence
      # them in a Markdown pass -- the built output is the only place the check
      # is real. This is also the pass that covers the download page's own links,
      # since it is a template rather than Markdown and nothing else reads it.
      - name: Install Zola
        env:
          ZOLA_VERSION: '0.19.2'
          # Same pin as the Pages workflow installs; see the comment there for why
          # a tag alone is not enough. Zola publishes no checksum manifest, so the
          # hash is recorded from the artifact served at v0.19.2.
          ZOLA_SHA256: '0798e69b86c628ddcb264ebd86c8cc8dce7670b9049060bf94faa73f6857cd9c'
        run: |
          set -euo pipefail
          curl -fsSL -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar xzf zola.tar.gz
          sudo install -m 0755 zola /usr/local/bin/zola
          zola --version

      - name: Build site
        working-directory: website
        run: zola build

      - name: Dead links (built site)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --config lychee.toml
            --root-dir "$GITHUB_WORKSPACE/website/public"
            'website/public/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
