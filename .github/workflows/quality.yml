name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. All three jobs below declare their own
# `permissions:` block, which REPLACES this one rather than adding to it — so
# this grants the floor for any job added later that forgets to, instead of
# handing it the repository default.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Benchmarks: four criterion suites live in benches/ (parser, store, pipeline,
  # tui_derived) and until now NOTHING ran them. The only reference to them in
  # any workflow was clippy's --all-targets lint pass, so a benchmark that
  # panicked, or stopped compiling against a changed API, would sit broken
  # indefinitely — and the project would have no way to notice a performance
  # change at all.
  #
  # This runs each benchmark once in criterion's --test mode: no timing, no
  # statistics, just execution. It is deliberately the weaker of the two things
  # worth having, because it is the one that works without persisted state.
  # Detecting an actual regression needs baselines carried between runs, which
  # criterion keeps in target/criterion and does not survive a cache miss; the
  # durable record is benches/BASELINES.md and it is hand-maintained. Treat this
  # as "the benchmarks still run", not "performance has not regressed".
  # ---------------------------------------------------------------------------
  bench:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 12.9 min slowest (Coverage / Benchmarks).
    timeout-minutes: 40
    name: Benchmarks (execute)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false

      - name: Install system deps
        uses: ./.github/actions/system-deps
        with:
          packages: libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-
            ${{ runner.os }}-cargo-

      # --profile profiling is what CONTRIBUTING mandates for benchmarks:
      # release codegen with full symbols and no stripping.
      # `debug = line-tables-only` for CI only. The profiling profile carries
      # `debug = true` and `strip = false` because callgrind needs full
      # symbols, and that is right for a local profiling run. This step only
      # asks "does every benchmark still build and execute once", and on
      # 0.5.131 the full-symbol build stopped fitting: the step was SIGTERMed
      # at ~6 minutes while still compiling, on a job whose own timeout is 40
      # minutes, and it passed on the commit before this batch and failed on
      # every one after.
      #
      # Disk was measured and ruled out -- 113 GB free at the point of failure.
      # The profile override cuts rustc's peak memory and the artifact size
      # without changing which benchmarks run.
      - name: Run every benchmark once
        env:
          CARGO_PROFILE_PROFILING_DEBUG: line-tables-only
        run: cargo bench --profile profiling --all-features -- --test

  # ---------------------------------------------------------------------------
  # Test coverage via cargo-llvm-cov.
  # Self-contained: prints a summary to the job summary and uploads an HTML
  # report artifact (no account needed). Also uploads to Codecov *if* a
  # CODECOV_TOKEN secret is configured (free for public/OSS repos) — the step
  # is skipped cleanly when the secret is absent, so the job stays green.
  # ---------------------------------------------------------------------------
  coverage:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 12.9 min slowest (Coverage / Benchmarks).
    timeout-minutes: 40
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
          # The suite includes site_advertises_only_a_released_version, which
          # asks git whether published_version has a matching tag. actions/
          # checkout fetches NO tags by default, so that gate saw zero and
          # refused to answer -- correctly, but it turned CI red on a release
          # commit. Fetch them so the gate is real here rather than skipped
          # where it matters most. depth 0 rather than fetch-tags alone: a full
          # history unambiguously includes every tag, and after shipping a gate
          # whose own message predicted this failure and still hit it, the few
          # seconds of clone are worth not guessing at checkout semantics.
          fetch-tags: true
          fetch-depth: 0
      # ubuntu-latest ships ~25-30 GB of preinstalled SDKs (dotnet, Android,
      # GHC, Swift, CodeQL bundle) we never use. A full --all-features
      # --all-targets build plus the cargo cache and llvm-cov instrumentation
      # can exhaust the runner disk ("No space left on device"); reclaim it up
      # front so the build has headroom.
      - name: Free disk space
        uses: ./.github/actions/free-disk

      - name: Install system deps
        uses: ./.github/actions/system-deps
        with:
          packages: libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: llvm-tools-preview
          # Coverage runs the full suite, which includes plugin_example_test —
          # it builds crates/sipnab-plugin-example for wasm32 exactly as the
          # docs instruct. Without the target it fails with "can't find crate
          # for `std`".
          targets: wasm32-unknown-unknown

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage
        # Skip the trycmd CLI-golden test under coverage: it spawns the
        # instrumented binary as 13 parallel subprocesses, which collide on the
        # llvm-cov merge-pool .profraw file ("LLVM Profile Error: ... File
        # exists") and fail the run. The goldens are still validated by the CI
        # workflow's plain `cargo test`; only their coverage contribution is
        # dropped here.
        #
        # Skip the wasm_plugin_* tests for a related reason: they shell out to
        # `cargo build --target wasm32-unknown-unknown`, and that nested build
        # cannot carry this harness's instrumentation — wasm32 ships no
        # `profiler_builtins`, so it fails with E0463. Scrubbing the coverage
        # variables from the child environment was not enough, which is why
        # this is a skip rather than more env plumbing. They run in full in the
        # CI workflow's plain `cargo test`; only their coverage contribution is
        # dropped, and the wasm artifact was never instrumented anyway.
        run: cargo llvm-cov --all-features --workspace --no-report -- --skip cli_goldens --skip wasm_plugin_

      - name: Coverage summary
        # Exclude the dev-only src/bin/gen_fixture.rs [[bin]] from every report
        # (mirrors codecov.yml `ignore:`); it is not shipped product code.
        run: |
          {
            echo '### Test coverage'
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex 'gen_fixture\.rs'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Coverage was measured, summarized, uploaded to Codecov with
      # fail_ci_if_error: false — and gated by nothing. It could decline release
      # after release with every run staying green: measured, reported,
      # unenforced, the same shape as the glibc floor and the binary-size claim.
      #
      # 92 is not a round number picked for comfort: line coverage measured
      # 92.85% (53407/57518) on the aaeb06e report, with functions at 94.29% and
      # regions at 93.15%. The floor sits just under the real figure so it
      # ratchets against decline without failing on ordinary noise. Raise it
      # when the real number rises; never lower it to make a build pass.
      - name: Enforce coverage floor
        run: |
          cargo llvm-cov report --fail-under-lines 92 \
            --ignore-filename-regex 'gen_fixture\.rs'

      - name: Generate lcov + HTML report
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'gen_fixture\.rs'
          cargo llvm-cov report --html --ignore-filename-regex 'gen_fixture\.rs'

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: error

      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Surface Clippy lints as GitHub Code Scanning alerts (SARIF).
  # CI already gates on `clippy -Dwarnings`; this makes the findings visible
  # inline on PRs and in the Security tab. Lints here are reported, not gated,
  # so this job does not fail the build.
  # ---------------------------------------------------------------------------
  clippy-sarif:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 12.9 min slowest (Coverage / Benchmarks).
    timeout-minutes: 40
    name: Clippy → Code Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false
      # ubuntu-latest ships ~25-30 GB of preinstalled SDKs (dotnet, Android,
      # GHC, Swift, CodeQL bundle) we never use. A full --all-features
      # --all-targets build plus the cargo cache and llvm-cov instrumentation
      # can exhaust the runner disk ("No space left on device"); reclaim it up
      # front so the build has headroom.
      - name: Free disk space
        uses: ./.github/actions/free-disk

      - name: Install system deps
        uses: ./.github/actions/system-deps
        with:
          packages: libpcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-sarif-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-sarif-
            ${{ runner.os }}-cargo-

      - name: Install clippy-sarif tooling
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Run Clippy (SARIF)
        # Report-only: collect lints as JSON->SARIF without -Dwarnings so a lint
        # does not fail this job (CI's `check` job already enforces the gate).
        run: |
          cargo clippy --workspace --all-features --all-targets --message-format=json \
            | clippy-sarif | tee clippy.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: clippy.sarif
          category: clippy

  # ---------------------------------------------------------------------------
  # Documentation gates: prose style, spelling, and dead links.
  #
  # These check the things the Rust suite structurally cannot. tests/ compares
  # documented values against the code that produces them -- versions, floors,
  # flag names -- and it is thorough at that. It says nothing about whether a
  # sentence is readable, whether a word is misspelled, or whether a URL still
  # resolves, and a download page full of correct-but-dead links fails a reader
  # exactly as hard as a wrong version number.
  #
  # Pinned by digest like every other action here. Each tool's configuration
  # lives at the repo root (.vale.ini, lychee.toml, .codespellrc) with the
  # reasoning for every exclusion recorded next to it, including the alert count
  # it produced on first run.
  # ---------------------------------------------------------------------------
  docs:
    # Bounds a wedged job: an unbounded one holds its
    # concurrency group indefinitely. Observed: 12.9 min slowest (Coverage / Benchmarks).
    timeout-minutes: 40
    name: Docs (prose, spelling, links)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false

      # Vale's Google package is not vendored here; it is fetched below. The
      # project's own rules and vocabulary ARE committed, under
      # .vale/styles/sipnab and .vale/styles/config.
      - name: Install Vale
        env:
          VALE_VERSION: '3.16.0'
          # Pinned by content, not just by tag: a release asset can be replaced
          # after publication. This hash is the one in Vale's own published
          # manifest (vale_3.16.0_checksums.txt), so it is upstream's record of
          # what it shipped rather than a note of whatever we happened to fetch.
          VALE_SHA256: '1049f4a585ccd1af96dcf4bdc16800cb3ce426b432da2b27893def42dcfe0ccb'
        run: |
          set -euo pipefail
          curl -fsSL -o vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          tar xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale
          vale --version

      # `vale sync` reads the `Packages =` URL from .vale.ini and unpacks whatever
      # it gets, with no integrity check available anywhere in that path. Doing the
      # fetch here instead buys the checksum. The stakes are lower than for the
      # binaries above -- the package is 36 YAML rule files, so a substitution
      # changes which prose passes lint rather than executing anything -- but it is
      # the same unpinned-fetch shape, and it is the last one in CI.
      #
      # Keep VALE_GOOGLE_URL identical to `Packages =` in .vale.ini. A test holds
      # the two together, because a drifting pair would lint against one package
      # locally and a different one here.
      - name: Install Vale styles
        env:
          VALE_GOOGLE_URL: 'https://github.com/errata-ai/Google/releases/download/v0.7.0/Google.zip'
          VALE_GOOGLE_SHA256: 'dddb3dca035a067fe9ab13a1d8d8f89cb63e8b83ab4cf1934a935d60cd91d697'
        run: |
          set -euo pipefail
          curl -fsSL -o Google.zip "${VALE_GOOGLE_URL}"
          echo "${VALE_GOOGLE_SHA256}  Google.zip" | sha256sum -c -
          # No post-condition check on the extracted directory, deliberately. The
          # checksum already fixes the archive, so its layout is not in question,
          # and the next step cannot pass without the styles present. Naming the
          # extracted path here would also assert a gitignored directory exists,
          # which is true on a machine that has synced and false in a fresh
          # checkout -- a test that passes locally and fails in CI.
          unzip -q -o Google.zip -d .vale/styles/

      # Published docs only; docs/design, docs/research and docs/superpowers are
      # exempted by glob sections in .vale.ini because they are working
      # documents. Curation brought this from 13,892 alerts to zero.
      - name: Prose style (Vale + Google)
        # Paths from the shared list -- see .config/vale-paths.txt.
        run: vale $(sed 's/#.*//' .config/vale-paths.txt | tr '\n' ' ')

      # The path list lives in .config/codespell-paths.txt, which this hook,
      # scripts/preflight.sh and .githooks/pre-push all read. It was three
      # copies before, and they had already drifted -- the hook omitted
      # `bench`, so a misspelling in the operator harness passed locally and
      # failed here. The action needs the paths as an input rather than from
      # config, so the file is read into one here instead of pasted.
      - name: Codespell paths
        id: codespell_paths
        run: echo "paths=$(sed 's/#.*//' .config/codespell-paths.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Spelling (codespell)
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          # Reads .codespellrc for skips and the ignore list.
          path: ${{ steps.codespell_paths.outputs.paths }}

      # Pass one: Markdown that resolves on the filesystem. 257 unique links.
      #
      # Deliberately WITHOUT --include-fragments. Anchors are already gated, and
      # better: link_integrity_test carries generated_site_anchors_resolve_under_zola,
      # website_intra_docs_links_resolve and wiki_intra_docs_links_resolve, which
      # slugify headings the way Zola and the GitHub wiki actually do.
      #
      # lychee's slugger disagrees with Zola's on headings containing a slash --
      # for `### GET /v1/dialogs` it wants `get-v1dialogs` where Zola resolves
      # `get-v1-dialogs`. Turning fragments on here reported the repo's correct,
      # Zola-shaped anchor as dead; "fixing" it to satisfy lychee broke all three
      # of the gates above, which are the ones describing where these documents
      # are actually published.
      # `--exclude` this repository's own blob/raw URLs, for the reason the
      # built-site pass below already excludes them: a file added on a BRANCH
      # 404s on `main` until the branch merges, which is after this gate has to
      # pass. `repo_paths_in_docs_are_clickable` DEMANDS that a tracked file
      # mentioned in prose be linked, so without this exclusion the two gates
      # contradict each other on every new file -- one insists on the link, the
      # other rejects it, and no edit satisfies both.
      #
      # `dev_docs_drift_test::linked_code_targets_exist` and
      # `doc_link_hygiene_test` resolve these against the working tree, which
      # is the stronger check: it cannot be satisfied by a stale copy on main.
      # External links, including other repositories on github.com, still run.
      - name: Dead links (docs Markdown)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --config lychee.toml
            --exclude '^https://github\.com/NormB/sipnab/(blob|raw)/'
            'docs/**/*.md' 'README.md' 'CONTRIBUTING.md' 'SECURITY.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pass two: the built site, where site-absolute links like /docs/install/
      # can actually be resolved. lychee reports those as unresolvable during
      # link resolution rather than as a URI, so no exclude pattern can silence
      # them in a Markdown pass -- the built output is the only place the check
      # is real. This is also the pass that covers the download page's own links,
      # since it is a template rather than Markdown and nothing else reads it.
      - name: Install Zola
        env:
          ZOLA_VERSION: '0.19.2'
          # Same pin as the Pages workflow installs; see the comment there for why
          # a tag alone is not enough. Zola publishes no checksum manifest, so the
          # hash is recorded from the artifact served at v0.19.2.
          ZOLA_SHA256: '0798e69b86c628ddcb264ebd86c8cc8dce7670b9049060bf94faa73f6857cd9c'
        run: |
          set -euo pipefail
          curl -fsSL -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar xzf zola.tar.gz
          sudo install -m 0755 zola /usr/local/bin/zola
          zola --version

      - name: Build site
        working-directory: website
        run: zola build

      # The same search index pages.yml publishes, built on the same pinned
      # binary, for one reason: pages.yml runs on push to main, so without this
      # a change that makes the index unbuildable is discovered by the deploy
      # rather than by the pull request. This job already renders the site; it
      # costs one download to also prove the index still builds from it.
      #
      # AFTER `zola build`, which recreates its output directory from scratch
      # and would delete an index written before it.
      - name: Index the site for search (Pagefind)
        env:
          # Identical pin to .github/workflows/pages.yml, and held there by
          # `a_tool_installed_by_more_than_one_workflow_is_pinned_identically`
          # -- checking the site with one build of a tool while publishing it
          # with another is the drift that test exists to catch.
          PAGEFIND_VERSION: '1.5.2'
          PAGEFIND_SHA256: 'afb824a9e7f64905a934900481cea5be679c03975e527329e0e5e6cc70f5feda'
        run: |
          set -euo pipefail
          curl -fsSL -o pagefind.tar.gz \
            "https://github.com/CloudCannon/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${PAGEFIND_SHA256}  pagefind.tar.gz" | sha256sum -c -
          tar xzf pagefind.tar.gz
          sudo install -m 0755 pagefind /usr/local/bin/pagefind
          rm -f pagefind pagefind.tar.gz
          pagefind --version
          pagefind --site website/public
          # An index that did not land is invisible from the outside: the page
          # returns 200 and the search box simply never appears.
          test -s website/public/pagefind/pagefind.js
          test -s website/public/pagefind/pagefind-entry.json

      # `--exclude` the site's OWN absolute URLs, in this pass only.
      #
      # Zola renders internal links as absolute https://sipnab.com/... URLs, so
      # lychee fetches them over the network -- checking the PREVIOUS deploy
      # rather than the build under test. Any page added in this commit
      # therefore 404s on exactly the commit that adds it, and if the page is
      # in the global nav, EVERY page fails: that is how 0.5.102 and 0.5.103
      # both went red, once for a docs page and once for a nav entry.
      #
      # Nothing is lost by excluding them here. Zola FAILS ITS OWN BUILD on a
      # broken internal link and reports the count it verified ("Successfully
      # checked N internal link(s) with anchors"), so these are already gated
      # by the tool that resolves them -- the same argument lychee.toml already
      # makes for `@/`-style links. Pass one still checks sipnab.com URLs that
      # appear in Markdown, so install.sh and friends stay covered.
      #
      # `--exclude` this repository's own blob/main URLs for the same reason,
      # one layer down. The site generator rewrites a developer page's relative
      # link to `src/foo.rs` into an absolute blob/main URL, so a SOURCE FILE
      # added on a branch 404s on exactly the commit that documents it -- and
      # only stops 404ing once the branch merges, which is after this gate has
      # to pass. That made `src/rtpengine/control.rs` and `reconcile.rs` red on
      # the commit that introduced them.
      #
      # Nothing is lost. `dev_docs_drift_test::linked_code_targets_exist`
      # resolves every one of those links against the working tree and fails if
      # the file is missing, which is a stronger check than a network 404: it
      # cannot be satisfied by a stale copy on main, and it cannot be fooled by
      # branch timing. External github.com links are still checked.
      - name: Dead links (built site)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --config lychee.toml
            --exclude '^https://sipnab\.com/'
            --exclude '^https://github\.com/NormB/sipnab/blob/'
            --root-dir "$GITHUB_WORKSPACE/website/public"
            'website/public/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Accessibility: axe-core against the RENDERED site, WCAG 2 Level A and AA.
  #
  # The Rust suite already reads website/templates/*.html by regular expression
  # and asserts on individual attributes. That is the strongest check available
  # to static analysis and it is structurally unable to make the two findings
  # this job made on its first real run: a color contrast ratio between a link
  # and the prose around it (1.79:1, needs 3:1), and a `<code>` block that CSS
  # turns into a horizontally scrollable region with no way to focus it. Both
  # are properties of the computed style of a composed document, so a browser
  # computes them.
  #
  # The gate blocks on `serious` and `critical`, over the wcag2a + wcag2aa tag
  # sets, and on axe's `incomplete` bucket for every rule except color-contrast.
  # e2e/tests/accessibility.spec.js carries the reasoning for each of those
  # three choices next to the constant that implements it.
  # ---------------------------------------------------------------------------
  accessibility:
    # Bounds a wedged job: an unbounded one holds its concurrency group
    # indefinitely. Observed locally: 12s for the nine specs, so this is
    # bounding a hang rather than the work.
    timeout-minutes: 20
    name: Accessibility (axe-core, WCAG 2 A/AA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. This job only reads the tree.
          persist-credentials: false

      - name: Install Zola (accessibility)
        env:
          ZOLA_VERSION: '0.19.2'
          # Same pin as the Pages workflow and the Docs job install; see the
          # comment in pages.yml for why a tag alone is not enough.
          # `a_tool_installed_by_more_than_one_workflow_is_pinned_identically`
          # holds all three copies together.
          ZOLA_SHA256: '0798e69b86c628ddcb264ebd86c8cc8dce7670b9049060bf94faa73f6857cd9c'
        run: |
          set -euo pipefail
          curl -fsSL -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar xzf zola.tar.gz
          sudo install -m 0755 zola /usr/local/bin/zola
          rm -f zola zola.tar.gz
          zola --version

      # `--base-url` is not cosmetic here, it is what makes the run mean
      # anything. Zola renders every internal URL as an absolute config.base_url
      # URL, and base_url is https://sipnab.com. Served on 127.0.0.1 that page
      # asks the production site for its own stylesheet, script and images, and
      # base.html's `default-src 'self'` blocks every one of them as
      # cross-origin -- so the page renders with NO CSS, and axe reports zero
      # violations because there are no computed colors to fail a contrast
      # check and no `overflow-x: auto` to make a region scrollable. That is
      # exactly what the first run of this gate did, on all five pages, before
      # anyone looked at why it was so clean.
      - name: Build the site at the origin it is served from (accessibility)
        working-directory: website
        run: zola build --base-url http://127.0.0.1:1111

      # The same trap, asserted rather than trusted. If the built HTML still
      # points at sipnab.com the scan below is measuring an unstyled page, and
      # it would pass. The spec carries its own runtime version of this check
      # ("the site under test serves its own assets"); this one fails a minute
      # earlier and names the cause.
      - name: The built site references its own origin, not production
        run: |
          set -euo pipefail
          if grep -q 'https://sipnab\.com/style\.css' website/public/index.html; then
            echo "::error::website/public was built with the production base_url."
            echo "Its own CSP blocks every cross-origin asset, so the page renders"
            echo "unstyled and every accessibility check passes vacuously."
            exit 1
          fi
          if ! grep -q 'http://127\.0\.0\.1:1111/style\.css' website/public/index.html; then
            echo "Either the build did not take the --base-url, or the template"
            echo "stopped linking style.css. Either way the page under test is"
            echo "unstyled, and an unstyled page passes every check below."
            echo "::error::website/public/index.html links no stylesheet at the origin this job serves it from."
            exit 1
          fi

      # `npm ci`, not `npm install`: it installs exactly the tree in
      # e2e/package-lock.json and fails if package.json disagrees with it. Every
      # package is fixed by an `integrity` sha512 in that lockfile, which is the
      # same guarantee the `sha256sum -c` above gives the Zola tarball.
      - name: Install browser-test dependencies
        working-directory: e2e
        run: npm ci

      # Prefer the Chrome already on the runner image over downloading
      # Playwright's own build. It is the local-first argument
      # .github/actions/system-deps makes for apt packages: the fetch we do not
      # make cannot hang, cannot be substituted, and cannot go down. The
      # fallback is explicit rather than silent, so the log says which one ran.
      - name: Resolve a Chrome for axe-core
        working-directory: e2e
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if path="$(command -v "$candidate" 2>/dev/null)"; then
              echo "Using the runner's $candidate at $path"
              echo "SIPNAB_E2E_CHROME=$path" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Chrome on the runner image; falling back to Playwright's own build"
          npx playwright install chromium
          resolved="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          test -x "$resolved"
          echo "SIPNAB_E2E_CHROME=$resolved" >> "$GITHUB_ENV"

      # No SIPNAB_E2E_BASE_URL: playwright.config.js then starts its own
      # `python3 -m http.server 1111 --directory ../website/public`, which is
      # the origin the site was just built for.
      - name: axe-core (WCAG 2 A/AA, serious + critical)
        working-directory: e2e
        # `./tests/...`, not `tests/...`. The path is relative to this step's
        # working-directory, and site_journey_test's packaging path scan reads a
        # bare `tests/` prefix in a workflow file as a repository-root path --
        # correctly, because that is what it looks like, and the spec lives under
        # e2e/ rather than at the root. The `./` says which tree it means.
        run: npx playwright test ./tests/accessibility.spec.js

      # A failed accessibility run should say WHICH element on WHICH page, and
      # the trace is how that is read without reproducing the run locally.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: axe-playwright-traces
          path: e2e/test-results
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Lighthouse CI: performance budgets over the built site.
  #
  # Scoped to what the Rust suite does NOT already cover. Hero LCP and the
  # hero-swap layout shift are gated by
  # site_journey_test::hero_swap_keeps_the_static_frame_as_the_lcp_element,
  # which reads the template and is a stronger check than a timing measurement:
  # it fails on the attribute that would cause the shift rather than on the
  # shift showing up in one sampled run. What no existing gate covers is total
  # page weight, script weight on ordinary documentation pages, and whether the
  # analyzer's WebAssembly stays deferred until someone opens the analyzer.
  #
  # Every threshold in e2e/lighthouserc.json was MEASURED, not chosen. The file
  # records the date, the commit and the observed value beside each one.
  # ---------------------------------------------------------------------------
  lighthouse:
    # Bounds a wedged job. Observed locally: five URLs x 3 runs at roughly
    # 20-25s each, so ~6 min of work.
    timeout-minutes: 25
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. This job only reads the tree.
          persist-credentials: false

      - name: Install Zola (lighthouse)
        env:
          ZOLA_VERSION: '0.19.2'
          # Same pin as the Pages workflow and the Docs job install; see the
          # comment in pages.yml for why a tag alone is not enough.
          ZOLA_SHA256: '0798e69b86c628ddcb264ebd86c8cc8dce7670b9049060bf94faa73f6857cd9c'
        run: |
          set -euo pipefail
          curl -fsSL -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar xzf zola.tar.gz
          sudo install -m 0755 zola /usr/local/bin/zola
          rm -f zola zola.tar.gz
          zola --version

      # The port matches `collect.url` in e2e/lighthouserc.json, and it has to:
      # see the long note on the accessibility job's build step for what a
      # mismatched base_url does to a measurement. A page whose CSS, JS and
      # images are all blocked scores 100.
      - name: Build the site at the origin it is served from (lighthouse)
        working-directory: website
        run: zola build --base-url http://127.0.0.1:1111

      - name: The built site references its own origin, not production (lighthouse)
        run: |
          set -euo pipefail
          if grep -q 'https://sipnab\.com/style\.css' website/public/index.html; then
            echo "::error::website/public was built with the production base_url."
            echo "Its own CSP blocks every cross-origin asset, so Lighthouse would"
            echo "measure a page with no CSS, no script and no images -- and score it 100."
            exit 1
          fi
          if ! grep -q 'http://127\.0\.0\.1:1111/style\.css' website/public/index.html; then
            echo "Either the build did not take the --base-url, or the template"
            echo "stopped linking style.css. Either way the page under test is"
            echo "unstyled, and an unstyled page passes every check below."
            echo "::error::website/public/index.html links no stylesheet at the origin this job serves it from."
            exit 1
          fi

      - name: Install browser-test dependencies
        working-directory: e2e
        run: npm ci

      - name: Resolve a Chrome for Lighthouse
        working-directory: e2e
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if path="$(command -v "$candidate" 2>/dev/null)"; then
              echo "Using the runner's $candidate at $path"
              echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Chrome on the runner image; falling back to Playwright's own build"
          npx playwright install chromium
          resolved="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          test -x "$resolved"
          echo "CHROME_PATH=$resolved" >> "$GITHUB_ENV"

      # `autorun` = collect + assert. It exits non-zero when a budget is
      # exceeded, which is the whole point; `--config` names the file so a
      # renamed or deleted config fails loudly instead of falling back to
      # lhci's own defaults, which assert nothing.
      - name: Lighthouse budgets
        working-directory: e2e
        run: npx lhci autorun --config=lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-reports
          path: e2e/.lighthouseci
          if-no-files-found: ignore
