name: Throughput

# Offline reconstruction throughput against a committed baseline.
#
# Why this exists. A 40% `--cores` regression landed in 0.5.84 and shipped in
# four consecutive releases. Every test passed the whole time -- the change was
# correct, it just moved a per-packet hash onto the one serial stage the
# parallel design waits on. Nothing in this repository measured speed, so the
# only thing that could have caught it was docs/benchmarks.md, which is
# re-measured by hand and had gone 41 releases stale. It was found by re-running
# that page and bisecting across release artifacts, weeks late.
#
# Why nightly and not per-push. The reference host is one self-hosted runner
# that also serves CI. Two jobs on it measure their own contention rather than
# the tool, so a per-PR wall-clock gate would be flaky in the direction that
# gets a gate muted -- and a muted gate catches nothing. Nightly, on a wide
# band, catches the class of regression that actually shipped.
#
# What it will NOT catch: slow erosion. A 5% drift stays inside the floor. That
# is a deliberate trade, argued in bench/baseline.json.
on:
  schedule:
    # 03:29 UTC daily. Offset from fuzz.yml (Mondays 05:17) and sanitizers.yml
    # (Tuesdays 06:11) so the long jobs never contend on the one runner.
    - cron: '29 3 * * *'
  workflow_dispatch:
  # Deliberately NOT on push. See the header: a per-push gate on this host
  # measures queue contention, and would have to be so loose it caught nothing.

permissions:
  contents: read

concurrency:
  # Never two of these at once: the second would measure the first.
  group: throughput
  cancel-in-progress: false

jobs:
  throughput:
    name: Offline reconstruction (4 cores)
    # Self-hosted because: the throughput baseline was measured on this hardware.
    # The baseline is a property of THIS machine. Running elsewhere would
    # compare one host's number against another's, which is not a regression
    # signal at all.
    runs-on: [self-hosted, jetson]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps or
          # third-party actions to read. Nothing here pushes with it:
          # wiki-sync and release pass the token explicitly via GH_TOKEN.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0

      # Keep the build outside the workspace, per runner, so the release build
      # is incremental across nights instead of starting from nothing after
      # checkout's clean. See the action for the location and the size cap.
      - uses: ./.github/actions/runner-target

      - name: Build the release binary
        # Release, not debug: a debug build measures the absence of
        # optimization, and the baseline was recorded from a release build.
        run: cargo build --features full --release

      # The reference: the latest release's aarch64 binary, measured in the
      # same run, alternately with the candidate. This host is shared with
      # three other runners and the local gates, and measured alone the gate
      # read their load as a regression (30.7% of baseline on 2026-10-15,
      # 34.7% on 10-28, 54.5% on 11-04, each for a commit an interleaved A/B
      # measured level with its predecessor). Load slows both binaries of a
      # round; a regression slows only the candidate. The artifact is
      # checksum-verified before it runs.
      - name: Fetch the reference binary (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          name="sipnab-${tag#v}-aarch64-unknown-linux-gnu"
          dir="$RUNNER_TEMP/bench-reference"
          rm -rf "$dir" && mkdir -p "$dir" && cd "$dir"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" \
            -p "$name.tar.gz" -p "$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "SIPNAB_BENCH_REFERENCE=$dir/$name/sipnab" >> "$GITHUB_ENV"

      - name: Measure against the reference and the committed baseline
        run: >-
          bench/regression-gate.sh --reference "$SIPNAB_BENCH_REFERENCE"
          "${CARGO_TARGET_DIR:-target}/release/sipnab"

      - name: Record what was measured
        if: always()
        run: |
          {
            echo "Baseline and rationale: bench/baseline.json"
            echo '```json'
            cat bench/baseline.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
