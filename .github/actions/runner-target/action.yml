# SPDX-License-Identifier: MIT OR Apache-2.0
name: Persistent per-runner target directory
description: >-
  On a self-hosted runner, point CARGO_TARGET_DIR at a directory outside the
  workspace that belongs to this runner alone, after bounding its size. Does
  nothing on a GitHub-hosted runner.

# WHY THIS EXISTS
#
# The self-hosted runners are persistent: the same runner processes take job
# after job on one machine. Their builds were not. actions/checkout's default
# `clean: true` runs `git clean -ffdx`, and target/ is untracked, so every job
# began with `Removing target/` and rebuilt from nothing. Measured on
# 2026-10-08 over one push's feature matrix: 279 to 701 crates compiled per
# leg, one to three minutes of cargo per leg, eighteen legs.
#
# The clean stays: a job must not read untracked leftovers from another
# branch, because several gates read the disk rather than git. The build
# directory moves out of the workspace instead.
#
# WHERE: $HOME/.cache/sipnab-ci/<runner name>/<dir>, where <dir> is the
# `dir` input, `target` unless a job names another.
# - Outside the workspace, so the checkout clean does not reach it.
# - Outside the runner's own installation directory, so it does not depend on
#   where a runner is installed and survives re-registering a runner.
# - Under ~/.cache, the conventional place for data that can be regenerated:
#   deleting it costs one cold build and nothing else.
# - One directory per runner name. Cargo locks its build directory, so the
#   runners sharing one directory would run their builds one at a time.
# - One directory per kind of build. Coverage (quality.yml) passes
#   `dir: coverage-target`: cargo llvm-cov compiles every crate with
#   `-C instrument-coverage`, and in the plain builds' directory each kind
#   would invalidate the other's artifacts and the two together would reach
#   the cap sooner and lose both. tests/ci_runner_target_test.rs requires a
#   separate directory for a job that runs cargo llvm-cov and the default for
#   every other job.
#
# THE CAP: 64 GiB per runner, checked before every build by
# scripts/ci-target-cap.sh, which removes the directory when it is over.
# Measured 2026-10-08, the in-workspace target directory each runner held
# after one feature-matrix leg: 13.96 GiB (the leg that runs the full test
# suite), 1.61, 1.19 and 0.65 GiB (check-only legs). A runner that holds all
# eighteen legs at once is bounded above by 13.96 + 17 x 1.61 = 41.3 GiB; the
# remaining 22.7 GiB under the cap is for bench.yml's release build, which
# was not measured here, and for dependency rebuilds after a Cargo.lock
# change. The check runs before the build, so a directory can pass the cap by
# one job's growth (13.96 GiB, the largest leg measured) before the next job
# removes it: at most 4 x (64 + 14) = 312 GiB across four runners, 28% of the
# 1123 GiB free on the root filesystem that day.
#
# The cap applies to each directory on its own, so a runner holds at most two
# capped directories. Measured sizes of the Check and Coverage builds are in
# docs/internals/build-ci-release.md. A cold Coverage build left 35 GiB, so
# its directory can pass the cap by that much: at most
# 4 x ((64 + 14) + (64 + 35)) = 708 GiB across four runners, 37% of the
# 1892 GiB free on the root filesystem on 2026-10-17.
#
# Not for reproducible.yml: its purpose is two builds in fresh trees, and a
# warm directory would make that comparison meaningless.
# tests/ci_runner_target_test.rs holds both the use and that exemption.
inputs:
  dir:
    description: >-
      The directory's name under this runner's directory: lowercase letters,
      digits and hyphens. `target` for a plain build.
    required: false
    default: target

runs:
  using: composite
  steps:
    - name: Bound and select the per-runner target directory
      if: runner.environment == 'self-hosted'
      shell: bash
      # Through the environment, so the input is a value and never script
      # text.
      env:
        TARGET_DIR_NAME: ${{ inputs.dir }}
      run: |
        set -euo pipefail
        # One path component, so the directory stays under this runner's.
        if ! [[ "$TARGET_DIR_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
          echo "::error::runner-target: dir '$TARGET_DIR_NAME' is not one name of [a-z0-9-]"
          exit 1
        fi
        CARGO_TARGET_DIR="$HOME/.cache/sipnab-ci/$RUNNER_NAME/$TARGET_DIR_NAME"
        bash "$GITHUB_WORKSPACE/scripts/ci-target-cap.sh" "$CARGO_TARGET_DIR" 64G
        echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
