base_url = "https://sipnab.com"
title = "sipnab"
description = "SIP & RTP capture, analysis, and security tool. One binary. One dependency (libpcap). Built in Rust."
default_language = "en"
compile_sass = true
build_search_index = true
generate_feeds = false
minify_html = false

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[markdown]
smart_punctuation = true

[markdown.highlighting]
enabled = true
theme = "ayu-dark"

[extra]
# Mirrors the crate version in Cargo.toml. The Pages workflow's "Sync site
# version" step overwrites this from Cargo.toml at build time (single source of
# truth), and a pre-commit hook plus `site_version_matches_crate_version` fail
# if the two drift. Update Cargo.toml, not this.
#
# It drives NOTHING a visitor sees. The homepage badge (index.html), the footer
# and JSON-LD `softwareVersion` (base.html) and every /download link
# (download.html) all read `published_version` below; no template reads
# `config.extra.version` at all. This comment used to claim the badge and the
# download links came from here. They did once — `download.html` was moved to
# `published_version` and the claim was never revisited, which is also how the
# same sentence ended up in site_journey_test.rs and pages.yml.
version = "0.5.190"
# The last version that actually EXISTS as a published GitHub release, which is
# what every download link must point at.
#
# This is NOT `version` above. `version` is the crate version in the tree, and
# the Pages step overwrites it from Cargo.toml on every build — so the moment a
# release COMMIT lands on main, the site advertised assets for a tag that had
# not been pushed yet and every link on /download returned 404. The window is
# the whole commit -> CI -> tag -> release-build cycle, and it lasted far longer
# on 0.5.61, whose release commit went red and was never tagged.
#
# Bumped after a release finishes publishing, not while cutting it.
# `site_advertises_only_a_released_version` requires a matching `v<x.y.z>` tag,
# so advertising something unreleased fails the suite rather than the visitor.
published_version = "0.5.190"
# Release date of `published_version` above -- NOT of `version`, further up.
# `download.html` renders this beside `published_version` in a single sentence,
# so the date belongs to the release a reader can actually download.
# It therefore moves in the POST-release commit, together with
# `published_version`, and must not be touched while cutting one: dating an
# untagged version is the conflation the published_version split exists to
# prevent. `site_release_date_matches_changelog` reads `published_version` and
# enforces this.
release_date = "2026-09-25"
# Minimum glibc of the released -gnu binaries and .debs. This is NOT a free
# choice: it is whatever the "Enforce glibc floor" step in release.yml admits,
# and it must equal SIPNAB_GLIBC_FLOOR in static/install.sh, which decides
# whether a host gets the gnu build or the musl fallback. To change it, change
# the release build environment first. 2.36 = Debian 12 / Ubuntu 23.04.
#
# This was 2.39 for eleven releases after release.yml moved the gnu builds into
# rust:1-bookworm and dropped the real floor to 2.36, because nothing compared
# the two. `published_glibc_floor_matches_release_gate` does now.
glibc_floor = "2.36"
glibc_floor_distros = "Debian 12+, Ubuntu 23.04+"
# Minimum macOS of the released darwin tarballs, per architecture. Like the
# glibc floor these are NOT a free choice: release.yml pins
# MACOSX_DEPLOYMENT_TARGET per target in its "Pin macOS deployment target" step,
# and these must equal what it pins. The two targets deliberately differ.
#
# The pin landed at the values rustc already defaulted to, so no binary changed:
#
#   rustc --print deployment-target --target aarch64-apple-darwin  -> 11.0
#   rustc --print deployment-target --target x86_64-apple-darwin   -> 10.12
#
# /download said "macOS 12+" for both for months. Nothing produced that number:
# no workflow step, no constant, no doc -- it existed only on the page a reader
# acts on, which is the same shape as the glibc floor bug above. It was wrong
# for both arches and hid the fact that they differ.
#
# `published_macos_floors_match_the_toolchain` holds these to the workflow's pin
# AND refuses a pin below the compiler's own default. To move real support,
# change the two `floor=` lines in release.yml and let the gate walk these to
# match. This comment claimed release.yml "never sets MACOSX_DEPLOYMENT_TARGET"
# for two releases after the pin landed in 0.5.65.
macos_floor_arm = "11.0"
macos_floor_intel = "10.12"
# Ceiling for the released stripped musl binary, in MB. Quoted on the homepage
# and in the build docs, and enforced against the real artifact by the "Enforce
# published binary size" step in release.yml. A ceiling rather than the exact
# size so it does not need editing every time the binary moves by a hundred KB.
#
# 13 -> 14 at 0.5.139, attributed by measuring both released artifacts rather
# than estimated: x86_64-musl was 13,551,816 bytes at 0.5.138 and 13,666,504 at
# 0.5.139, so `query_relay` and `decode_ng` -- six response types carrying
# derived JSON schemas, plus the seam's trait objects -- cost 114,688 bytes.
# 0.5.138 had only 79,672 bytes of headroom, so this was the release that
# tipped rather than the one that grew unusually.
#
# 15 -> 16 at 0.5.160, and the same shape again. Measured x86_64-musl, every
# figure from the shipped stripped binary inside the published tarball except
# the last, which is the release job's own `stat` of the artifact it refused:
#
#   0.5.157  15,612,680 bytes
#   0.5.158  15,608,584 bytes   (-4,096)
#   0.5.159  15,629,064 bytes   (+20,480, leaving 99,576 bytes of headroom)
#   0.5.160  15,747,848 bytes   (+118,784, over the 15 MB ceiling by 19,208)
#   0.5.161  15,772,424 bytes   (+24,576, leaving 1,004,792 bytes of headroom)
#   0.5.162  15,776,520 bytes   (+4,096, leaving 1,000,696 bytes of headroom)
#   0.5.163  15,776,520 bytes   (unchanged, leaving 1,000,696 bytes of headroom)
#   0.5.164  15,801,160 bytes   (+24,640, leaving 976,056 bytes of headroom)
#   0.5.165  15,809,416 bytes   (+8,256, leaving 967,800 bytes of headroom)
#   0.5.166  15,821,704 bytes   (+12,288, leaving 955,512 bytes of headroom)
#   0.5.167  15,817,608 bytes   (-4,096, leaving 959,608 bytes of headroom)
#   0.5.168  15,862,664 bytes   (+45,056, leaving 914,552 bytes of headroom)
#   0.5.169  15,916,232 bytes   (+53,568, leaving 860,984 bytes of headroom)
#   0.5.170  16,072,008 bytes   (+155,776, leaving 705,208 bytes of headroom)
#   0.5.171  16,096,776 bytes   (+24,768, leaving 680,440 bytes of headroom)
#   0.5.172  16,096,776 bytes   (unchanged, leaving 680,440 bytes of headroom)
#   0.5.173  16,121,352 bytes   (+24,576, leaving 655,864 bytes of headroom)
#   0.5.174  16,125,448 bytes   (+4,096, leaving 651,768 bytes of headroom)
#   0.5.175  16,125,448 bytes   (unchanged, leaving 651,768 bytes of headroom)
#   0.5.176  16,256,520 bytes   (+131,072, leaving 520,696 bytes of headroom)
#   0.5.177  16,477,704 bytes   (+221,184, leaving 299,512 bytes of headroom)
#   0.5.178  16,481,800 bytes   (+4,096, leaving 295,416 bytes of headroom)
#   0.5.179  16,481,800 bytes   (unchanged, leaving 295,416 bytes of headroom)
#   0.5.180  16,485,896 bytes   (+4,096, leaving 291,320 bytes of headroom)
#   0.5.181  16,489,992 bytes   (+4,096, leaving 287,224 bytes of headroom)
#   0.5.182  16,489,992 bytes   (+0, leaving 287,224 bytes of headroom)
#   0.5.183  16,498,184 bytes   (+8,192, leaving 279,032 bytes of headroom)
#   0.5.184  16,489,928 bytes   (-8,256, leaving 1,335,864 bytes of headroom under 17 MB)
#   0.5.185  16,924,936 bytes   (+435,008, leaving 900,856 bytes of headroom under 17 MB)
#   0.5.186  17,081,096 bytes   (+156,160, leaving 744,696 bytes of headroom under 17 MB)
#   0.5.187  17,154,952 bytes   (+73,856, leaving 670,840 bytes of headroom under 17 MB)
#   0.5.188  17,183,688 bytes   (+28,736, leaving 642,104 bytes of headroom under 17 MB)
#   0.5.189  17,806,848 bytes   (+623,160, leaving 1,067,520 bytes of headroom under 18 MB)
#   0.5.190  17,811,008 bytes   (+4,160, leaving 1,063,360 bytes of headroom under 18 MB)
#
# So 0.5.159 shipped one ordinary release away from tipping and nothing said
# so. The 118,784 bytes are `find_in_captures` -- a 66th MCP tool with derived
# input and output schemas -- plus the amplitude measurement, the per-interval
# quality types, and the config and CLI plumbing for `--quality-interval`.
# 16 MB left 1,029,368 bytes of headroom at 0.5.160, 1,004,792 at 0.5.161,
# 1,000,696 at both 0.5.162 and 0.5.163, which measured byte-for-byte
# identical, 976,056 at 0.5.164 -- the Landlock sandbox and six parser rules
# cost 24,640 bytes between them -- 967,800 at 0.5.165, where the seccomp
# program builder and two DTLS length rules cost 8,256 -- 955,512 at
# 0.5.166, where the enforcing filter and its allowlist parser cost 12,288, and
# 959,608 at 0.5.167 -- the first release in this run to come back SMALLER, by
# 4,096 bytes, with both halves of packet-level provenance in it. A byte range
# per header and a frame locator per RTCP report are paid per message and per
# report at runtime rather than in the binary, and deleting the second walk of
# the header grammar gave back more text than the fields cost -- and 914,552 at
# 0.5.168, where the rtpproxy control decoder, the relay statistics command and
# the attribution fields cost 45,056 between them. A text protocol parser is
# cheap; what it buys is a second relay sipnab can read at all -- and 860,984 at
# 0.5.169, where the CLI relay-statistics surface (C1-C4: the tiering
# vocabulary, the three-state wire rule, the per-call, name-list and compare
# renderings, and the control-client statistics and query paths behind
# --relay-stats, --relay-stats-call, --relay-stats-list and --relay-compare)
# cost 53,568. The vocabulary is carried once and rendered four ways, which is
# why four flags cost about what one MCP tool did -- and 705,208 at 0.5.170,
# where the relay-statistics surface finished across the other three interfaces:
# the REST endpoints (ST5), the relay_stats and relay_compare MCP tools (ST6),
# the --json shape and the --relay-stats-interval poller (ST7/C5) and the TUI
# RelayStats view on its own worker thread (ST8), plus a cargo-minor-patch
# dependency bump, cost 155,776. The same vocabulary again, so the four new
# surfaces cost about three MCP tools between them rather than one each -- and
# 680,440 at 0.5.171, where the ST9 failure and edge-case work (the per-call
# refusal, overflow, restart-detection, cookie-mismatch and interval-slip rules,
# each single-sourced in stats_vocab) plus a rustls security bump cost 24,768.
# Closing the edge cases was mostly reusing the vocabulary already there, which
# is why it cost a fraction of a surface -- and 680,440 at 0.5.172, which
# measured byte-for-byte identical to 0.5.171: it shipped the ST-D1 cookbook
# recipes and nothing that compiles into the binary -- and 655,864 at 0.5.173,
# where the runtime capture-filter editor (the append composer, its live
# re-apply across every fanout socket, and the shared generation-stamped
# control the loops poll) cost 24,576. About a fraction of a surface again: the
# editor reuses the pure filter composition already there and the loops reuse
# the poll point they already had for shutdown -- and 651,768 at 0.5.174, where
# the offline re-scan (the file loader re-reading under the composed filter, a
# filter argument threaded through the load path, and the editor's Enter wired
# to it) cost 4,096: one page, because it reuses the loader and the store-reset
# the in-session file open already had -- and 651,768 again at 0.5.175, measured
# byte-for-byte identical to 0.5.174: it shipped the relay-statistics completion
# (the REST failure-path and acceptance tests, the single-sourced poll gate, and
# the site docs), none of which compiles into the binary -- the tests and docs
# are outside it and the poll-gate refactor is binary-neutral.
# That figure is measured from the shipped tarball each release, checksum
# verified against the `.sha256` beside it, which is what makes it a
# measurement rather than an estimate carried forward.
#
# The 0.5.139 mitigation was this comment: "the remaining headroom is readable
# without building anything". It was not. Nothing required the record to be
# refreshed between ceiling moves, so it still described 0.5.138 while three
# releases went past, and the headroom was readable only by someone who
# downloaded three tarballs. `the_binary_ceiling_records_every_published_release`
# and `the_binary_ceiling_keeps_a_readable_margin` in
# tests/release_gate_visibility_test.rs enforce the refresh and act on the
# margin, so the raise now happens at the release that gets close rather than
# at the tag that fails.
#
# 16 -> 17 at 0.5.183, the first move made BEFORE a release failed rather than
# after. 0.5.183 left 279,032 bytes under 16 MB, 16,888 above the 262,144-byte
# THIN_MARGIN, and single releases in this record have grown by 155,776
# (0.5.170), 131,072 (0.5.176) and 221,184 (0.5.177), so the next ordinary
# release could have tipped. The binary grew 750,336 bytes from 0.5.160 to
# 0.5.183, about 32,600 per release; 17 MB leaves 1,327,608 bytes of headroom
# over the 0.5.183 measurement above, roughly forty releases at that rate.
#
# Shrinking was considered and rejected again, for the reason it was rejected
# at 0.5.139: `[profile.release]` already runs `lto`, `codegen-units = 1`,
# `strip` and `panic = "abort"`, and the only lever left is `opt-level = "z"`,
# which trades the throughput the benchmarks page publishes. Raising a claim
# that is no longer true beats keeping a claim that is.
#
# 17 -> 18 after 0.5.188, the first move made for growth measured before any
# release carried it. PW-MUSL adds the `archive` feature (ZIP and 7z input,
# archive passwords) to the musl tarballs and the -noaudio packages. Its cost
# was measured locally, not on a published artifact: two stripped release
# builds of the no-audio set on aarch64-unknown-linux-musl, in Alpine 3.22
# with rustc 1.98.0, were 14,057,840 bytes without `archive` and 14,517,104
# with it. x86_64 is unmeasured, because this host has no x86_64 musl
# toolchain. 0.5.188 left 642,104 bytes under 17 MB, and that growth would
# leave 182,840, under the 262,144-byte THIN_MARGIN. A pending line counted it
# against the margin until 0.5.189's own measurement carried it: the published
# x86_64-musl binary grew 623,160 bytes, leaving 1,067,520 under 18 MB and
# 18,944 under the old 17.
#
binary_size_ceiling_mb = "18"
github_url = "https://github.com/NormB/sipnab"
# `owner/repo`, for the places a bare slug is what the command wants rather than
# a URL: `gh attestation verify --repo`, the releases API path. These were
# hand-written as "NormB/sipnab" in three spots on /download while github_url sat
# in this file, so a rename would have left copy-pasteable commands pointing at a
# repository that no longer exists. `published_repo_slugs_agree` keeps this equal
# to the tail of github_url.
github_repo = "NormB/sipnab"
# The container image docker.yml publishes, lowercased because GHCR requires it.
# Also previously hand-written on /download. Pinned to the workflow by
# `published_ghcr_image_matches_docker_workflow`.
ghcr_image = "ghcr.io/normb/sipnab"
author = "Norm Brandinger"
linkedin_url = "https://www.linkedin.com/in/nbrandinger"
patreon_url = "https://www.patreon.com/c/NormB975"
github_sponsors_url = "https://github.com/sponsors/NormB"

# The docs navigation: ONE list, rendered twice. base.html builds the header
# Docs dropdown from it and macros::docs_nav builds the docs sidebar from it,
# so the two draw on the same pages. Each group is a
# `[[extra.docs_nav]]` table; each entry names a page by its content path, and
# both navs show that page's own title, so the link a reader clicks and the
# heading they land on always match. `menu = true` puts the entry in the dropdown as well
# as the sidebar. The dropdown carries the few pages a group is visited for and
# ends with "All docs", and the sidebar carries every entry.
#
# `every_docs_page_is_in_the_docs_nav_list` in tests/site_journey_test.rs
# holds this list to website/content/docs/*.md in both directions.
[[extra.docs_nav]]
id = "start"
title = "Start here"
pages = [
  { path = "docs/install.md", menu = true },
  { path = "docs/first-cli-triage.md", menu = true },
  { path = "docs/cookbook.md", menu = true },
  { path = "docs/troubleshooting.md", menu = true },
  { path = "docs/real-world-captures.md", menu = true },
  { path = "docs/glossary.md", menu = true },
]

[[extra.docs_nav]]
id = "capture"
title = "Capture in hard places"
pages = [
  { path = "docs/tls-capture.md", menu = true },
  { path = "docs/uprobe-walkthrough.md", menu = true },
  { path = "docs/tuning-capture.md", menu = true },
  { path = "docs/encapsulations.md", menu = true },
  { path = "docs/rtpengine.md", menu = true },
]

[[extra.docs_nav]]
id = "tui"
title = "Use the terminal UI"
