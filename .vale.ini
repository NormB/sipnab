# Prose linting for the published documentation.
#
# Scope is deliberate. Working documents -- design specs, implementation plans,
# research notes -- carry workstream identifiers ("WS6.1 API-guidelines sweep")
# and dated benchmark tables, and their audience is whoever is building the
# feature. Running a house style over them produces alerts nobody acts on. What
# ships to the website is what a reader outside this repo sees, so that is what
# is enforced; the glob sections at the bottom exempt the rest.
#
# ORDERING MATTERS. Every rule toggle must sit above the first glob section: INI
# keys bind to the section header that precedes them, so a toggle written after
# `[docs/design/**]` silently applies to design docs only. That happened while
# writing this file -- `Google.Quotes = NO` looked ignored because it had landed
# in the wrong section.
#
# COUNTS BELOW ARE MEASURED AT MinAlertLevel = error, the level enforced here.
# They were first written from a probe run at `suggestion`, which made five of
# the disables look load-bearing when they cannot fire at all at this threshold.
# Those five now say so. If you lower MinAlertLevel, read the backlog note at the
# bottom first -- the number that surfaces is not small.

StylesPath = .vale/styles
MinAlertLevel = error
Packages = Google
Vocab = sipnab

[*.md]
BasedOnStyles = Vale, Google, sipnab

# ---------------------------------------------------------------------------
# Load-bearing disables: these fire at `error` and are the reason this config
# reports zero. Counts are what each produced on the enforced scope.
# ---------------------------------------------------------------------------

# 2,515 alerts, every one an artifact of how the vocabulary was built.
# Vale.Terms enforces the exact capitalisation of each Vocab entry, and this
# vocabulary was generated from what the docs already use -- which includes both
# `pcap` and `Pcap`, `config` and `Config`, because sentence starts and
# identifiers legitimately differ. Enforcing case consistency needs a curated
# list of canonical product terms, not a baseline of observed spellings, so the
# rule would be measuring the vocabulary against itself.
Vale.Terms = NO

# 1,148 alerts. The em dash is part of the house voice and appears in nearly
# every paragraph. This rule wants it spaced; the docs are consistent without.
Google.EmDash = NO

# 68 alerts, all "Put a nonbreaking space between the number and the unit".
# Right for rendered UI copy; in Markdown it means salting the source with &nbsp;
# entities that then have to survive every mirror regeneration.
Google.Units = NO

# 61 alerts, mostly "Use 'for example' instead of 'e.g.'" -- and some land on the
# `e.g. <version>` lines in docs/install.md that
# docs_current_version_markers_match_cargo matches with the literal regex
# `e\.g\. (\d+\.\d+\.\d+)`. Rewording to "for example 0.5.64" removes the marker
# that gate looks for and it fails closed. Two enforcement systems wanting
# opposite things: the version gate protects a copy-pasteable download
# instruction from going stale, which outranks a Latin-abbreviation preference
# for a developer audience.
Google.Latin = NO

# 36 alerts, all "Commas and periods go inside quotation marks" -- the American
# typesetting convention. These docs quote exact literals and token lists: the
# canonical vendor value "no specific vendor", a recorded prior claim, and lines
# like `"trust", "verify", "act on" or "ensure"`. Moving punctuation inside
# changes what the quotation marks contain, which in a document about protocol
# fields and flag values is a correctness problem, not a style one.
Google.Quotes = NO

# 4 alerts, and replaced rather than dropped: .vale/styles/sipnab/LyHyphens.yml
# is the same rule with an exception list for nouns ending in "ly". Google flagged
# "reassembly-session" and "nightly-only", both correct compound modifiers.
Google.LyHyphens = NO

# ---------------------------------------------------------------------------
# Promotions: a rule enforced ABOVE its shipped severity. One, so far.
# ---------------------------------------------------------------------------

# PROMOTED to error, and the reason it is the only promotion here: passive voice
# in a how-to genuinely hides who does what, so the advice is right where the four
# rules above are wrong. It sat disabled with a note saying "866 alerts, a real
# editing pass, not a config change" -- which was true, and also the number was
# measured over the whole tree, counting the exempt design subtrees and the
# generated website/content mirrors. The authored, enforced scope was 353 alerts
# across 29 files. Those are now rewritten, and this is enforced so they cannot
# come back.
#
# `error`, not the rule's own `suggestion`: MinAlertLevel is `error`, so leaving
# the shipped severity would have enforced nothing while looking enforced.
#
# NOT forked with an exception list, unlike Google.LyHyphens below. Roughly a
# fifth of the alerts were adjectives rather than passives -- "is unsigned", "is
# unchanged", "is malformed", "is unbounded" -- matched by the rule's `[\w]+ed`
# catch-all. Excepting them needs either negative lookahead, which Go's RE2 does
# not have, or replacing the catch-all with an allowlist of participles, which
# would silently stop catching every verb nobody thought to list. They were
# reworded instead, and read better for it: "the token is unsigned" became "the
# token carries no signature".
Google.Passive = error

# PROMOTED to error, like Google.Passive above, and forked rather than used
# as-shipped: .vale/styles/sipnab/Headings.yml is Google.Headings with the
# vocabulary this project writes in. Google's exception list knows Azure and
# TypeScript; it does not know that RTP and DTMF are not words, that GET names an
# HTTP method, or that "488 Not Acceptable Here" is a reason phrase from RFC 3261.
#
# 156 authored alerts across 18 files, 311 counting the generated mirrors. 87 were
# genuine Title Case and are rewritten; the rest were the rule not knowing the
# domain. Anchors are unaffected throughout -- every slugger lowercases, so
# `## Call List` and `## Call list` both slug to `call-list`, which is why this
# could be done without touching a single inbound link.
#
# Four headings sets keep their capitalisation behind scoped
# `<!-- vale sipnab.Headings = NO -->` comments, each explaining itself in the
# file it affects: the TOML table headings in config-reference.md, the
# alphanumerically numbered sub-sections in examples.md and mcp-walkthrough.md
# (Vale reads "10a." as the first word and lowercases what follows; it handles a
# plain "13." correctly), and the SIP reason phrase in troubleshooting.md.
sipnab.Headings = error

# PROMOTED to error. 137 authored alerts across 27 files, 221 counting the
# generated mirrors. 115 were two independent clauses wearing a semicolon, and
# read better as two sentences -- which is the whole of Google's advice here.
#
# The other 22 are not that, and are kept:
#   * super-comma lists, where the items carry their own commas and parentheses
#     (the eight pre-commit gates, the bounded-input audit, the workstream list).
#     Google's guidance keeps this use; periods would turn one list into
#     fragments. Bracketed with `<!-- vale Google.Semicolons = NO -->` in place.
#   * protocol and stylesheet syntax inside terminal mockups -- `;branch=` on a
#     SIP Via, `;` between CSS declarations. Those live in raw HTML blocks that a
#     comment directive cannot reach, so the two pages carrying them are
#     switched off by name at the bottom of this file.
Google.Semicolons = error

# PROMOTED to error. 20 authored alerts across 12 files, 38 counting the
# generated mirrors, and unlike Google.Colons below every one of them was real:
# present tense reads better in all twenty. "the gates that will reject it"
# became "the gates that reject it", "it will never under-report" became "it
# never under-reports". Nothing needed an exception, a suppression or a fork --
# the smallest of the four backlog rules worked this session and the only one
# that came out clean.
Google.Will = error

# PROMOTED to error, both clean after a small pass. Six missing Oxford commas
# ("D22, D23 and D24", "captured, counted and searchable"), and three ellipses
# stood in for "and so on" in a parenthetical list. One apparent OxfordComma
# false positive turned out to be real on a second reading -- the match started
# at an odd offset, and the list it pointed into was "two SBOMs, a provenance
# attestation, a GHCR image and a Homebrew formula". One genuinely was not: the
# adverb pair "publishes, immediately and irreversibly" is not a list, and
# dropping that comma reads better anyway.
#
# Know what OxfordComma actually covers before trusting it. Its token is
# `(?:[^,]+,){1,}\s\w+\s(?:and|or)` -- exactly ONE word between the comma and
# the conjunction. It catches "INVITE, ACK and BYE" and misses "reads the
# socket, parses the frame and stores it", which is the same defect with a
# longer final item. Found while mutation-testing this: the first planted
# sentence did not fire, and the gate was right -- the test was wrong.
Google.Ellipses = error

# Google.OxfordComma: ENABLED, then REVERTED THE SAME DAY, and the reason is
# worth more than the rule.
#
# It was measured, mutation-tested and enforced against a LOCAL styles tree that
# was hours stale. `.vale/styles/Google/` is gitignored and CI runs `vale sync`
# every job, so CI always has whatever the registry published last. Between the
# local sync and that push, Google rewrote this rule from
#
#   (?:[^,]+,){1,}\s\w+\s(?:and|or)                    -- one word before "and"
#
# to a lookahead-based pattern matching up to five. Local said zero; CI failed
# with 35. Everything else in the enforced set survived the same package bump.
#
# The new pattern does not distinguish a three-item list from a pair. Of 17
# authored alerts, 5 were real serial commas and are fixed; the other 12 are
# phrases like "found and fixed", "not by packet or by call" and "both exist in
# the capture and the naive reading gives the wrong outcome". Enforcing it means
# suppressing twelve correct sentences.
#
# THE WIDER POINT: nothing pins this package. Every rule above can change under
# CI without a commit here, and a green local run proves nothing until
# `vale sync` has run. Sync first, then measure.
Google.OxfordComma = NO

# ---------------------------------------------------------------------------
# Pre-emptive disables: these sit at `suggestion` or `warning` severity, BELOW
# the enforced threshold, so they report nothing today whether on or off. They
# are switched off explicitly, with the count they would produce, so that
# lowering MinAlertLevel is a deliberate decision about a known quantity rather
# than an avalanche that gets fixed by reverting the whole file.
# ---------------------------------------------------------------------------

# suggestion, 3,675 alerts if enforced. Every one is "Spell out 'SIP'" / "'RTP'"
# / "'SDP'" on a SIP and RTP analyser. The protocol acronyms ARE the subject
# matter; a reader needing "Session Initiation Protocol" expanded is not the
# reader of this tool. This one should stay off at any threshold.
Google.Acronyms = NO

# suggestion, 2,403 alerts. Technical prose earns its parentheses -- target
# triples, flag defaults, units. "Use parentheses judiciously" is not a defect.
Google.Parens = NO

# suggestion, 490 alerts, all asking for contractions ("do not" -> "don't").
# The docs are consistently unclipped. A tone preference, not an error.
Google.Contractions = NO

# warning, 397 alerts, and the substitutions are wrong here more often than
# right: "command-line tool" for CLI (171 times), "stop"/"exit" for `kill` in a
# tool whose kill_packet module exists to kill calls, and "tap" instead of
# "touch", which is mobile-UI advice aimed at the shell command. The few worth
# keeping are re-implemented in .vale/styles/sipnab/Substitutions.yml.
Google.WordList = NO

# ---------------------------------------------------------------------------
# Known backlog. Lowering MinAlertLevel to `suggestion` surfaces 669 alerts from
# rules NOT disabled above, so the curation here is not the only thing standing
# between this config and a stricter one:
#
#   Google.Headings    311   sentence-case headings
#   Google.Semicolons  223   "use a semicolon sparingly"
#   Google.Colons      71    lowercase after a colon -- MEASURED AND REJECTED,
#                            see below; the number is not 71 pending defects
#   Google.Will        38    ENFORCED, see above -- all 20 authored were real
#
# Google.Colons was worked through rather than left estimated, and it is the one
# rule here whose advice does not survive contact with this corpus. Its token is
# `: [A-Z]` -- a colon, a space, a capital -- with no exception for any of the
# three cases the page it links actually permits. Of 36 authored alerts, 34 were
# correct English:
#
#   22  a complete sentence follows, which Google capitalises
#         "**Problem:** You want one sipnab box collecting from three proxies."
#    9  an acronym or identifier follows
#         "quality data: MOS score", "all fixed: SN-01", "in code: D2"
#    3  a proper noun follows
#         "distributions lag: Ubuntu 24.04", "two tabs: **Dialogs**"
#
# Two were genuine -- a label introducing a noun phrase, where the capital was
# simply wrong -- and are fixed. Enforcing the rule would have required either
# lowercasing 34 correct sentences or suppressing them one at a time, which is a
# lint driving the prose rather than the other way round.
#   remainder          26    WORKED: OxfordComma and Ellipses are enforced above.
#                            We, FirstPerson and Ranges are rejected, below.
#
# Google.We / Google.FirstPerson: 3 authored alerts, every one inside quoted
# user speech. The cookbook and troubleshooting pages open each recipe with the
# complaint that sends someone looking -- **Problem:** "We had a spike in
# failures around 14:00", "I can hear them but they can't hear me" -- and
# docs/README.md names the how-to genre as answering "how do I ...?". The
# pronoun is the user's, not the project's, and it is the point of the sentence.
# The one real first-person plural, "a viewer we control", is fixed.
#
# Google.Ranges: 4 alerts, all the same false positive. Its token is
# `(?:from|between)\s\d+\s?-\s?\d+`, so any ISO date after "from" is a range:
# "the sentence dates from 2026-07-25" reads as "from 2026 to 07". A repository
# that writes dates cannot enforce this.
#
# Recorded rather than discovered later: a threshold change is cheap to type and
# expensive to absorb.
#
# WHAT IS ACTUALLY ENFORCED, then, is the error-level set minus the disables
# above -- narrower than "the Google style guide", and worth knowing by name:
#
#   Vale.Spelling            unknown words (the vocabulary is the allowlist)
#   sipnab.Substitutions     utilize/in order to/functionality and friends
#   sipnab.LyHyphens         -ly adverb hyphens, minus the noun exceptions
#   Google.Passive           passive voice (PROMOTED from suggestion; see above)
#   sipnab.Headings          sentence-case headings (fork of Google.Headings)
#   Google.Semicolons        semicolons joining independent clauses
#   Google.Will              future tense where the present says it
#   Google.Ellipses          an ellipsis standing in for "and so on"
#   Google.Gender            gendered pronouns for a generic person
#   Google.GenderBias        "whitelist", "man hours", and similar
#   Google.Slang             informalisms that do not translate
#   Google.Spacing           double spaces after a period
#   Google.Periods           periods in acronyms
#   Google.OptionalPlurals   "thread(s)"
#   Google.Ordinal           "1st" for "first"
#   Google.Exclamation       exclamation points
#   Google.AMPM              "3am" for "3 AM"
#   Google.DateFormat        ambiguous numeric dates
#
# Verified by mutation: "We utilize a flumboozle to rapidly-process frames in
# order to win" produces four alerts from three of these rules; the unmodified
# tree produces zero. A gate never seen to fail is not known to work.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Exempt subtrees. A per-directory .vale.ini does NOT work: Vale resolves a
# single config by searching up from the working directory, so one committed
# inside docs/design/ was silently inert. Glob sections are the mechanism.
#
# `BasedOnStyles =` alone is NOT enough for a rule named explicitly above.
# Emptying the style list drops the styles; a rule given its own assignment in
# `[*.md]` is then added back on top of that, so `Google.Passive = error` linted
# all three of these subtrees until each one switched it off again. Measured:
# 506 alerts across the design, research and superpowers trees, which are
# working documents whose audience is whoever is building the feature. Any
# future promotion up there needs a matching line in each section down here.
# ---------------------------------------------------------------------------

[docs/design/**]
BasedOnStyles =
Google.Passive = NO
sipnab.Headings = NO
Google.Semicolons = NO
Google.Will = NO
Google.OxfordComma = NO
Google.Ellipses = NO

[docs/research/**]
BasedOnStyles =
Google.Passive = NO
sipnab.Headings = NO
Google.Semicolons = NO
Google.Will = NO
Google.OxfordComma = NO
Google.Ellipses = NO

[docs/superpowers/**]
BasedOnStyles =
Google.Passive = NO
sipnab.Headings = NO
Google.Semicolons = NO
Google.Will = NO
Google.OxfordComma = NO
Google.Ellipses = NO

# ---------------------------------------------------------------------------
# Three pages disable Google.Semicolons wholesale, listed with their generated
# mirrors. It has to be here rather than a `<!-- vale off -->` in the file: a
# comment directive does NOT reach the content these semicolons live in.
#
#   keybindings.md, theme-guide.md   terminal mockups built from
#       `<div class="terminal">` + `<pre>`. The semicolons are protocol and
#       stylesheet syntax -- `;branch=` and `;tag=` on SIP headers (RFC 3261),
#       and `;` between CSS declarations. A directive placed before the block
#       does not reach inside raw HTML; placed inside the `<pre>` it injected
#       blank lines into the rendered mockup, which `mockup_alignment_test`
#       exists to catch.
#   mcp-walkthrough.md   an OpenSIPS `trace_id` URI whose parameters are
#       semicolon-separated, in a fence indented inside a numbered list item.
#       A directive bracketing it does not reach there either.
#
# The cost is real: a prose semicolon added to any of these three from now on
# goes uncaught. All three were swept before this landed.
# ---------------------------------------------------------------------------

[docs/keybindings.md]
Google.Semicolons = NO

[website/content/docs/keybindings.md]
Google.Semicolons = NO

[docs/theme-guide.md]
Google.Semicolons = NO

[website/content/docs/theme.md]
Google.Semicolons = NO

[docs/mcp-walkthrough.md]
Google.Semicolons = NO

[website/content/docs/mcp-walkthrough.md]
Google.Semicolons = NO
